<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="家計シミュレーター">
<meta name="theme-color" content="#0B121B">
<title>家計・年金シミュレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Sans:opsz,wght@9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B121B;
    --panel:#101A26;
    --card:#131D29;
    --ink:#EDF2F7;
    --ink-soft:#94A5B8;
    --dim:#62748A;
    --line:#223246;
    --gold:#7AA7FF;
    --gold-soft:rgba(122,167,255,.14);
    --teal:#F2B84B;
    --teal-soft:rgba(242,184,75,.14);
    --red:#FF6B6B;
    --red-soft:rgba(255,107,107,.14);
    --pos:#3ECF8E;
    --neg:#FF6B6B;
    --radius-card: 22px;
    --radius-pill: 999px;
    --app-max: 520px;
  }
  @media (min-width:700px){ :root{ --app-max: 660px; } }
  @media (min-width:900px){ :root{ --app-max: 780px; } }
  @media (min-width:1200px){ :root{ --app-max: 880px; } }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;}
  body{
    background:radial-gradient(1200px 600px at 10% -10%,#15263A 0%,transparent 60%),radial-gradient(900px 500px at 110% 10%,#2A1E14 0%,transparent 55%),var(--bg);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Zen Kaku Gothic New','Hiragino Sans','Hiragino Kaku Gothic ProN',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  h1,h2,h3{
    font-family:'Zen Kaku Gothic New',sans-serif;
    font-weight:700;
    margin:0;
    letter-spacing:.01em;
  }
  .num{font-family:'DM Sans','Zen Kaku Gothic New',sans-serif;font-variant-numeric:tabular-nums;}
  #app{max-width:var(--app-max);margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

  .auth-screen{
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;
    padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px);
  }
  .auth-card{
    width:100%;max-width:380px;
    background:var(--card);border:1px solid var(--line);border-radius:24px;
    padding:32px 26px;
  }
  .auth-card h1{font-size:22px;color:var(--ink);text-align:center;margin-bottom:6px;}
  .auth-card .field-note{font-size:14.5px;color:var(--ink-soft);text-align:center;margin:0 0 18px;line-height:1.55;}
  .auth-card .btn{margin-top:16px;}
  .auth-card .btn.secondary{margin-top:10px;}
  .pin-dots{display:flex;justify-content:center;gap:18px;margin:8px 0 22px;padding:6px 0;}
  .pin-dots .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:transparent;transition:background .12s,border-color .12s,transform .12s;}
  .pin-dots .dot.filled{background:var(--teal);border-color:var(--teal);transform:scale(1.12);}
  .pin-dots.shake{animation:pinshake .38s;}
  @keyframes pinshake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}100%{transform:translateX(0)}}
  .pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:260px;margin:0 auto;}
  .pin-pad button{
    aspect-ratio:1;border-radius:50%;border:1px solid var(--line);background:#0E1722;
    font-size:22px;font-family:inherit;color:var(--ink);cursor:pointer;
  }
  .pin-pad button:active{background:#18293C;}
  .pin-pad button.empty{border:none;background:none;cursor:default;}
  .pin-pad button.pin-del{font-size:16px;color:var(--ink-soft);}

  header{
    padding:calc(env(safe-area-inset-top) + 18px) 20px 16px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    color:var(--ink);
    position:relative;
  }
  header .title-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  header h1{font-size:20px;color:var(--ink);}
  header .version{font-size:12px;color:var(--dim);font-weight:500;white-space:nowrap;}
  header .summary{
    display:flex;gap:10px;margin-top:16px;
  }
  header .summary .box{
    flex:1;background:rgba(255,255,255,.035);
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 14px;
  }
  header .summary .box .label{font-size:12px;color:var(--ink-soft);}
  header .summary .box .val{font-size:19px;font-weight:700;margin-top:2px;font-family:'DM Sans','Zen Kaku Gothic New',sans-serif;font-variant-numeric:tabular-nums;}
  header .sync-status{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-soft);margin-top:12px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;}
  header .sync-status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pos);box-shadow:0 0 8px var(--pos);flex:none;}
  header .sync-status.error::before{background:var(--neg);box-shadow:0 0 8px var(--neg);}

  main{flex:1;padding:16px 16px 90px;}

  .card{
    position:relative;
    background:linear-gradient(180deg,#16212F 0%,#121B26 100%);
    border:1px solid var(--line);
    border-radius:var(--radius-card);
    padding:18px 18px 20px;
    margin-bottom:14px;
    overflow:hidden;
  }
  .card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--teal),transparent 85%);}
  .card h2{font-size:16px;margin-bottom:12px;color:var(--ink);}
  .card h2 .sec-note{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:400;font-size:12px;color:var(--ink-soft);margin-left:6px;}

  label{display:block;font-size:12.5px;color:var(--ink-soft);margin:10px 0 4px;}
  label:first-child{margin-top:0;}
  input[type=number],input[type=date],input[type=month],input[type=text],input[type=password],select,textarea{
    width:100%;
    padding:10px 11px;
    font-size:15px;
    border:1px solid var(--line);
    border-radius:10px;
    background:#0E1722;
    color:var(--ink);
    font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 8px;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:100%;
    padding:12px;
    margin-top:14px;
    background:var(--teal);
    color:#0B121B;
    border:none;
    border-radius:var(--radius-pill);
    font-size:15px;font-weight:700;
    font-family:inherit;
    cursor:pointer;
  }
  .btn.secondary{background:none;color:var(--ink-soft);border:1px solid var(--line);font-weight:600;}
  .btn.gold{background:var(--gold);color:#0B121B;}
  .btn.small{width:auto;padding:7px 14px;font-size:13px;margin-top:0;}
  .btn.danger{background:var(--red);color:#fff;}

  .row-flex{display:flex;gap:8px;}
  .row-flex .btn{margin-top:8px;}

  .entry-item, .hist-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:11px 0;border-bottom:1px solid var(--line);
  }
  .entry-item:last-child, .hist-item:last-child{border-bottom:none;}
  .entry-item .meta{font-size:13.5px;font-weight:600;color:var(--ink);}
  .entry-item .sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .entry-item .figs{text-align:right;font-family:'DM Sans','Zen Kaku Gothic New',sans-serif;font-variant-numeric:tabular-nums;}
  .entry-item .figs .net.pos{color:var(--pos);}
  .entry-item .figs .net.neg{color:var(--neg);}
  .entry-item .acts{display:flex;gap:6px;margin-left:10px;}
  .hist-item .meta{color:var(--ink);}
  .hist-item .figs{font-family:'DM Sans','Zen Kaku Gothic New',sans-serif;font-variant-numeric:tabular-nums;}
  .icon-btn{
    background:none;border:none;color:var(--ink-soft);font-size:16px;padding:4px 6px;cursor:pointer;
  }

  .pill-select{display:flex;gap:8px;margin-top:4px;}
  .pill-select button{
    flex:1;padding:10px 4px;border-radius:var(--radius-pill);
    border:1px solid var(--line);background:#0E1722;color:var(--ink-soft);
    font-size:13.5px;font-family:inherit;cursor:pointer;
  }
  .pill-select button.active{
    background:var(--teal);border-color:var(--teal);color:#0B121B;font-weight:700;
  }

  .stat-line{display:flex;justify-content:space-between;padding:7px 0;font-size:14px;border-bottom:1px dashed var(--line);color:var(--ink);}
  .stat-line:last-child{border-bottom:none;}
  .stat-line span:first-child{color:var(--ink-soft);}
  .stat-line .v{font-weight:700;font-family:'DM Sans','Zen Kaku Gothic New',sans-serif;font-variant-numeric:tabular-nums;color:var(--ink);}

  .result-banner{
    display:flex;gap:12px;align-items:flex-start;
    border-radius:var(--radius-card);
    padding:18px;
    margin-bottom:14px;
    border:1px solid var(--line);
  }
  .result-banner svg{width:24px;height:24px;flex:none;margin-top:1px;}
  .result-banner .content{flex:1;min-width:0;}
  .result-banner.ok{background:rgba(62,207,142,.12);}
  .result-banner.warn{background:rgba(255,107,107,.12);}
  .result-banner.ok .headline, .result-banner.ok svg{color:var(--pos);}
  .result-banner.warn .headline, .result-banner.warn svg{color:var(--neg);}
  .result-banner .headline{font-size:17px;font-weight:700;font-family:'Zen Kaku Gothic New',sans-serif;}
  .result-banner .detail{font-size:13px;color:var(--ink-soft);margin-top:6px;line-height:1.6;}

  .empty{color:var(--ink-soft);font-size:13.5px;padding:14px 2px;text-align:center;}

  nav#bottom-nav{
    position:fixed;bottom:0;left:0;right:0;
    max-width:var(--app-max);margin:0 auto;
    background:var(--panel);border-top:1px solid var(--line);
    display:flex;
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav#bottom-nav button{
    flex:1;background:none;border:none;padding:10px 4px 8px;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--ink-soft);font-family:inherit;font-size:11px;cursor:pointer;
  }
  nav#bottom-nav button .ic{font-size:19px;line-height:1;}
  nav#bottom-nav button.active{color:var(--teal);font-weight:700;}

  .field-note{font-size:11px;color:var(--ink-soft);margin-top:4px;}
  .divider{height:1px;background:var(--line);margin:14px 0;}
  .footer-ver{text-align:center;font-size:11px;color:var(--dim);padding:6px 0 0;}

  .chart-box{position:relative;height:230px;margin-top:6px;}
  .chart-legend{display:flex;gap:14px;font-size:11.5px;color:var(--ink-soft);margin-top:8px;}
  .chart-legend span{display:inline-flex;align-items:center;gap:5px;}
  .chart-legend i{width:10px;height:10px;border-radius:2px;display:inline-block;}

  .c-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .c-head h2{margin:0;flex:1;}
  .c-ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal);flex:none;}
  .c-ico svg{width:20px;height:20px;}

  .kpi{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;}
  .kpi .lbl{font-size:12.5px;color:var(--ink-soft);}
  .kpi .val{font-size:28px;font-weight:700;line-height:1.15;font-family:'DM Sans','Zen Kaku Gothic New',sans-serif;font-variant-numeric:tabular-nums;color:var(--ink);}

  .chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;}
  .chip{flex:1;min-width:112px;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:14px;padding:10px 13px;}
  .chip .lbl{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
  .chip .lbl i{width:8px;height:8px;border-radius:3px;background:var(--dot,var(--teal));flex:none;}
  .chip .v{font-size:17px;font-weight:700;margin-top:3px;font-family:'DM Sans','Zen Kaku Gothic New',sans-serif;font-variant-numeric:tabular-nums;color:var(--ink);}

  .legend{display:flex;flex-direction:column;gap:7px;margin-top:12px;}
  .lg{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink);}
  .lg i{width:10px;height:10px;border-radius:3px;flex:none;}
  .lg b{margin-left:auto;font-weight:700;font-family:'DM Sans','Zen Kaku Gothic New',sans-serif;font-variant-numeric:tabular-nums;}

  /* ============ レスポンシブ対応（タブレット・横向き・大画面） ============ */
  @media (min-width:700px){
    main{padding:20px 24px 96px;}
    header{padding-left:26px;padding-right:26px;}
    header h1{font-size:23px;}
    header .summary .box .val{font-size:21px;}
    .card{padding:22px 24px;}
    .card h2{font-size:17px;}
    input[type=number],input[type=date],input[type=month],input[type=text],input[type=password],select,textarea{font-size:16px;padding:11px 12px;}
    .grid3{grid-template-columns:repeat(4,1fr);gap:0 12px;}
    .btn{font-size:16px;}
    nav#bottom-nav button{font-size:12.5px;padding:12px 4px 10px;}
    nav#bottom-nav button .ic{font-size:21px;}
  }
  @media (min-width:900px){
    .grid3{gap:0 16px;}
    main{padding:24px 30px 100px;}
  }
  /* 横向き（landscape）で高さが低い場合、下部ナビを詰めて画面を有効活用 */
  @media (max-height:420px) and (orientation:landscape){
    nav#bottom-nav button{padding:6px 4px 6px;font-size:10px;}
    nav#bottom-nav button .ic{font-size:15px;}
    main{padding-bottom:70px;}
  }
</style>
<!-- ===== Firebaseログイン(メール/パスワード)共通部品 ===== -->
<style>
#fbl{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:24px;padding-top:max(24px,env(safe-area-inset-top));background:#eef1f5;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;color:#1d2433;-webkit-text-size-adjust:100%}
#fbl .fbl-b{width:100%;max-width:360px;background:#fff;border-radius:14px;padding:26px 22px;box-shadow:0 6px 24px rgba(20,30,50,.12)}
#fbl h1{font-size:19px;margin:0 0 6px;font-weight:700;letter-spacing:0}
#fbl .fbl-s{font-size:13px;color:#5b6475;margin:0 0 8px;line-height:1.6}
#fbl label{display:block;font-size:12px;color:#5b6475;margin:14px 0 5px}
#fbl input{width:100%;box-sizing:border-box;font-size:16px;padding:12px;border:1px solid #c9d0db;border-radius:9px;background:#fff;color:#1d2433;-webkit-appearance:none}
#fbl input:focus{outline:2px solid #2f6fdf;outline-offset:0;border-color:#2f6fdf}
#fbl button{width:100%;margin-top:20px;font-size:16px;font-weight:700;padding:13px;border:0;border-radius:9px;background:#2f6fdf;color:#fff;cursor:pointer}
#fbl button:disabled{opacity:.6}
#fbl .fbl-e{min-height:1.4em;margin-top:12px;font-size:13px;color:#c0392b;line-height:1.5}
@media (prefers-color-scheme:dark){#fbl{background:#12161d;color:#e8ebf0}#fbl .fbl-b{background:#1c222c;box-shadow:none}#fbl .fbl-s,#fbl label{color:#9aa3b2}#fbl input{background:#12161d;color:#e8ebf0;border-color:#3a4352}}
</style>
<script>
(function(){
  var MSG={
    'auth/invalid-credential':'メールアドレスまたはパスワードが違います。',
    'auth/invalid-login-credentials':'メールアドレスまたはパスワードが違います。',
    'auth/wrong-password':'メールアドレスまたはパスワードが違います。',
    'auth/user-not-found':'メールアドレスまたはパスワードが違います。',
    'auth/invalid-email':'メールアドレスの形式が正しくありません。',
    'auth/missing-password':'パスワードを入力してください。',
    'auth/too-many-requests':'失敗が続いたため一時的に制限されています。しばらく待ってからお試しください。',
    'auth/network-request-failed':'通信できませんでした。インターネット接続を確認してください。',
    'auth/operation-not-allowed':'Firebaseで「メール/パスワード」のログインが有効になっていません。',
    'auth/user-disabled':'このアカウントは無効になっています。'
  };
  var box=null, submitFn=null;
  function build(){
    box=document.createElement('div');
    box.id='fbl';
    box.innerHTML='<form class="fbl-b" novalidate>'+
      '<h1>ログイン</h1>'+
      '<p class="fbl-s">iPhone・iPad共通のアカウントでログインしてください。この端末では次回から自動でログインします。</p>'+
      '<label for="fbl-m">メールアドレス</label><input id="fbl-m" type="email" autocomplete="username" autocapitalize="off" spellcheck="false">'+
      '<label for="fbl-p">パスワード</label><input id="fbl-p" type="password" autocomplete="current-password">'+
      '<button type="submit">ログイン</button><div class="fbl-e" role="alert"></div></form>';
    var f=box.querySelector('form'), btn=box.querySelector('button'), err=box.querySelector('.fbl-e');
    f.addEventListener('submit',function(ev){
      ev.preventDefault();
      var m=box.querySelector('#fbl-m').value.trim(), p=box.querySelector('#fbl-p').value;
      if(!m||!p){err.textContent='メールアドレスとパスワードを入力してください。';return;}
      btn.disabled=true; btn.textContent='確認中…'; err.textContent='';
      Promise.resolve().then(function(){return submitFn(m,p);}).catch(function(e){
        err.textContent=MSG[e&&e.code]||('ログインできませんでした('+((e&&(e.code||e.message))||'不明なエラー')+')');
      }).then(function(){btn.disabled=false; btn.textContent='ログイン';});
    });
    document.body.appendChild(box);
  }
  function show(fn){
    submitFn=fn;
    var go=function(){ if(!box) build(); box.style.display='flex'; };
    if(document.body) go(); else document.addEventListener('DOMContentLoaded',go);
  }
  function hide(){ if(box) box.style.display='none'; }
  /* o.onState(cb) / o.login(email,pw) / o.logout() を渡すと、ログイン済みユーザーで resolve する */
  window.fbLoginGate=function(o){
    return new Promise(function(resolve){
      o.onState(function(u){
        if(u && !u.isAnonymous){ hide(); resolve(u); return; }
        if(u && u.isAnonymous){ Promise.resolve().then(o.logout).catch(function(){}); return; } // 以前の匿名ログインは破棄
        show(o.login);
      });
    });
  };
})();
</script>

</head>
<body>
<div id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <h1>家計・年金シミュレーター</h1>
    <div id="auth-body"></div>
  </div>
</div>
<div id="app" style="display:none;">
  <header>
    <div class="title-row">
      <h1>家計・年金シミュレーター</h1>
      <span class="version">Ver1.7</span>
    </div>
    <div class="kpi" style="margin-top:14px;">
      <div><div class="lbl">資産合計（貯蓄＋投資）</div><div class="val" id="hdr-total">¥0</div></div>
    </div>
    <div class="summary">
      <div class="box" style="--dot:var(--teal)"><div class="label"><i style="width:8px;height:8px;border-radius:3px;background:var(--dot);display:inline-block;margin-right:5px;"></i>貯蓄額</div><div class="val" id="hdr-savings">¥0</div></div>
      <div class="box" style="--dot:var(--gold)"><div class="label"><i style="width:8px;height:8px;border-radius:3px;background:var(--dot);display:inline-block;margin-right:5px;"></i>投資運用額</div><div class="val" id="hdr-investment">¥0</div></div>
    </div>
    <div class="sync-status" id="sync-status"><span>同期中…</span></div>
  </header>
  <main id="tab-content"></main>
  <nav id="bottom-nav">
    <button data-tab="input"><span class="ic">📝</span>収支入力</button>
    <button data-tab="assets"><span class="ic">💰</span>資産管理</button>
    <button data-tab="settings"><span class="ic">⚙️</span>年金設定</button>
    <button data-tab="sim"><span class="ic">📈</span>シミュレーション</button>
  </nav>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>

function setSyncStatus(mode){
  const el = document.getElementById('sync-status');
  if(!el) return;
  el.classList.remove('error');
  if(mode==='syncing'){ el.innerHTML = '<span>同期中…</span>'; }
  else if(mode==='ok'){ el.innerHTML = '<span>同期済み</span>'; }
  else if(mode==='offline'){ el.innerHTML = '<span>オフライン（この端末のみ）</span>'; el.classList.add('error'); }
  else if(mode==='error'){ el.innerHTML = '<span>同期エラー</span>'; el.classList.add('error'); }
}

/* ============ 状態管理 ============ */
const STORAGE_KEY = 'kakeiSimData_v1';
const AUTH_LOCAL_KEY = 'kakeiSimAuthOK_v1';
let state = loadState();

function defaultState(){
  return {
    entries: [],      // {ym:'2026-09', income:{...}, expenses:{...}}
    assets: { savings:0, investment:0, history:[] }, // history: {id,date,type,amount,note}
    bigExpenses: [],  // {id, ym:'2028-05', label:'自動車購入', amount:2500000}
    settings: { birthDate:'', pensionBase65:0, startAge:65, simEndAge:90, monthlyBudget:0 },
    simInputs: { salary:0, dividend:0, expenses:{} },
    auth: { pinHash:'', recoveryQuestion:'', recoveryAnswerHash:'' }
  };
}
function normalizeState(parsed){
  const d = defaultState();
  if(!parsed) return d;
  return {
    entries: parsed.entries || d.entries,
    assets: Object.assign(d.assets, parsed.assets||{}),
    bigExpenses: parsed.bigExpenses || d.bigExpenses,
    settings: Object.assign(d.settings, parsed.settings||{}),
    simInputs: Object.assign(d.simInputs, parsed.simInputs||{}, {expenses: Object.assign({}, (parsed.simInputs&&parsed.simInputs.expenses)||{})}),
    auth: Object.assign(d.auth, parsed.auth||{})
  };
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    return normalizeState(JSON.parse(raw));
  }catch(e){ return defaultState(); }
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  renderHeader();
  if(firebaseReady && dataRef){
    suppressNextWrite = true;
    dataRef.set(state).then(()=>{
      setSyncStatus('ok');
    }).catch(err=>{
      console.error('Firebase write failed', err);
      setSyncStatus('error');
    });
  }
}

/* ============ Firebaseリアルタイム同期 ============ */
let appUnlocked = false;

function initFirebaseSync(){
  if(!firebaseReady || !dataRef){
    setSyncStatus('offline');
    checkAuthAndInit();
    return;
  }
  setSyncStatus('syncing');
  dataRef.on('value', snap => {
    // 自分自身の書き込みで発火した最初の通知はスキップ（不要な再描画防止）
    if(suppressNextWrite){ suppressNextWrite = false; setSyncStatus('ok'); return; }

    const val = snap.val();
    if(val){
      state = normalizeState(val);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      if(appUnlocked){
        renderHeader();
        renderers[currentTab]();
      } else {
        checkAuthAndInit();
      }
    } else if(!firstSnapshotHandled){
      // リモートが空 ＝ 初回。この端末のローカルデータをアップロードする
      dataRef.set(state).catch(err=>console.error('initial upload failed', err));
      checkAuthAndInit();
    }
    firstSnapshotHandled = true;
    setSyncStatus('ok');
  }, err => {
    console.error('Firebase sync error', err);
    setSyncStatus('error');
    if(!firstSnapshotHandled){
      firstSnapshotHandled = true;
      checkAuthAndInit(); // オフライン時はローカルキャッシュのデータで認証チェック
    }
  });
  // 応答が一定時間なければローカルキャッシュにフォールバック
  setTimeout(()=>{
    if(!firstSnapshotHandled){
      firstSnapshotHandled = true;
      checkAuthAndInit();
    }
  }, 4000);
}

/* ============ ログイン認証 ============ */
async function sha256Hex(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function normalizeAnswer(a){ return String(a||'').trim().toLowerCase(); }
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function checkAuthAndInit(){
  if(state.auth && state.auth.pinHash){
    if(localStorage.getItem(AUTH_LOCAL_KEY) === '1'){
      unlockApp();
    } else {
      showAuthScreen('login');
    }
  } else {
    showAuthScreen('setup');
  }
}

function unlockApp(){
  appUnlocked = true;
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  renderHeader();
  setTab(currentTab || 'input');
}

function pinPadHtml(){
  return `
    <div class="pin-dots" id="pin-dots">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <div class="pin-pad" id="pin-pad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button class="empty" tabindex="-1"></button><button data-k="0">0</button><button class="pin-del" data-k="del">⌫</button>
    </div>
  `;
}
function mountPinPad(onComplete){
  const pad = document.getElementById('pin-pad');
  const dots = document.getElementById('pin-dots');
  let buf = '';
  function update(){
    dots.querySelectorAll('.dot').forEach((d,i)=> d.classList.toggle('filled', i < buf.length));
  }
  pad.querySelectorAll('button[data-k]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const k = btn.dataset.k;
      if(k === 'del'){ buf = buf.slice(0,-1); update(); return; }
      if(buf.length >= 4) return;
      buf += k;
      update();
      if(buf.length === 4){
        setTimeout(()=>{ const val = buf; buf=''; update(); onComplete(val); }, 150);
      }
    });
  });
}

function showAuthScreen(mode){
  appUnlocked = false;
  document.getElementById('app').style.display = 'none';
  const scr = document.getElementById('auth-screen');
  scr.style.display = 'flex';
  const body = document.getElementById('auth-body');

  if(mode === 'loading'){
    body.innerHTML = `<div class="empty">読み込み中…</div>`;
    return;
  }

  if(mode === 'setup'){
    body.innerHTML = `
      <div class="field-note" style="text-align:center;">はじめに、このアプリを開く際の暗証番号（4桁）を設定してください。</div>
      ${pinPadHtml()}
    `;
    mountPinPad(pin1 => showSetupConfirm(pin1));
    return;
  }

  if(mode === 'login'){
    body.innerHTML = `
      <div class="field-note" style="text-align:center;">暗証番号（4桁）を入力してください</div>
      ${pinPadHtml()}
      <div class="field-note" id="auth-error" style="color:var(--red);text-align:center;"></div>
      <button class="btn secondary" id="auth-forgot-btn">暗証番号を忘れた場合</button>
    `;
    mountPinPad(async pin => {
      const hash = await sha256Hex(pin);
      if(hash === state.auth.pinHash){
        localStorage.setItem(AUTH_LOCAL_KEY, '1');
        unlockApp();
      } else {
        document.getElementById('auth-error').textContent = '暗証番号が違います';
        const dots = document.getElementById('pin-dots');
        if(dots){ dots.classList.add('shake'); setTimeout(()=> dots.classList.remove('shake'), 400); }
      }
    });
    document.getElementById('auth-forgot-btn').addEventListener('click', ()=>{
      if(state.auth && state.auth.recoveryQuestion && state.auth.recoveryAnswerHash){
        showAuthScreen('recover');
      } else {
        alert('秘密の質問が設定されていないため、この画面からの復旧はできません。復旧するには改めてご相談ください。');
      }
    });
    return;
  }

  if(mode === 'recover'){
    body.innerHTML = `
      <div class="field-note">秘密の質問</div>
      <div class="stat-line" style="border-bottom:none;"><span style="font-weight:600;color:var(--ink);">${escapeHtml(state.auth.recoveryQuestion||'')}</span></div>
      <label>答え</label>
      <input type="text" id="auth-recover-answer" autocomplete="off">
      <button class="btn" id="auth-recover-btn">確認する</button>
      <button class="btn secondary" id="auth-back-btn">ログイン画面に戻る</button>
      <div class="field-note" id="auth-error" style="color:var(--red);"></div>
    `;
    const tryRecover = async ()=>{
      const ans = document.getElementById('auth-recover-answer').value;
      const err = document.getElementById('auth-error');
      const hash = await sha256Hex(normalizeAnswer(ans));
      if(hash === state.auth.recoveryAnswerHash){
        showResetPin();
      } else {
        err.textContent = '答えが正しくありません';
      }
    };
    document.getElementById('auth-recover-btn').addEventListener('click', tryRecover);
    document.getElementById('auth-recover-answer').addEventListener('keydown', e=>{ if(e.key === 'Enter') tryRecover(); });
    document.getElementById('auth-back-btn').addEventListener('click', ()=> showAuthScreen('login'));
    document.getElementById('auth-recover-answer').focus();
    return;
  }
}

function showSetupConfirm(pin1){
  const body = document.getElementById('auth-body');
  body.innerHTML = `
    <div class="field-note" style="text-align:center;">確認のため、もう一度入力してください</div>
    ${pinPadHtml()}
    <div class="field-note" id="auth-error" style="color:var(--red);text-align:center;"></div>
  `;
  mountPinPad(pin2 => {
    if(pin2 !== pin1){
      document.getElementById('auth-error').textContent = '一致しません。最初からやり直してください';
      setTimeout(()=> showAuthScreen('setup'), 900);
      return;
    }
    showSetupQuestion(pin1);
  });
}

function showSetupQuestion(pin1){
  const body = document.getElementById('auth-body');
  body.innerHTML = `

function showResetPin(){

function showResetConfirm(pin1){

  body.innerHTML = `
    <div class="field-note" style="text-align:center;">確認のため、もう一度入力してください</div>

function logoutApp(){
  localStorage.removeItem(AUTH_LOCAL_KEY);
  showAuthScreen('login');
}

async function changePin(){
  if(!state.auth || !state.auth.pinHash){ alert('暗証番号が未設定です'); return; }
  const current = prompt('現在の暗証番号（4桁）を入力してください');
  if(current === null) return;
  const curHash = await sha256Hex(current);
  if(curHash !== state.auth.pinHash){ alert('現在の暗証番号が違います'); return; }
  const next1 = prompt('新しい暗証番号（4桁の数字）を入力してください');
  if(next1 === null) return;
  if(!/^[0-9]{4}$/.test(next1)){ alert('4桁の数字で入力してください'); return; }
  const next2 = prompt('確認のため、もう一度入力してください');
  if(next2 === null) return;
  if(next1 !== next2){ alert('一致しません'); return; }
  state.auth.pinHash = await sha256Hex(next1);
  saveState();
  alert('暗証番号を変更しました');
}

async function changeRecoveryQuestion(){
  if(!state.auth || !state.auth.pinHash){ alert('暗証番号が未設定です'); return; }
  const current = prompt('本人確認のため、現在の暗証番号（4桁）を入力してください');
  if(current === null) return;
  const curHash = await sha256Hex(current);
  if(curHash !== state.auth.pinHash){ alert('暗証番号が違います'); return; }
  const q = prompt('秘密の質問を入力してください（例：初めて飼ったペットの名前は？）', state.auth.recoveryQuestion || '');
  if(q === null) return;
  if(!q.trim()){ alert('質問を入力してください'); return; }
  const a = prompt('答えを入力してください');
  if(a === null) return;
  if(!a.trim()){ alert('答えを入力してください'); return; }
  state.auth.recoveryQuestion = q.trim();
  state.auth.recoveryAnswerHash = await sha256Hex(normalizeAnswer(a));
  saveState();
  alert('秘密の質問を更新しました');
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ============ ユーティリティ ============ */
function yen(n){
  n = Math.round(Number(n)||0);
  return '¥' + n.toLocaleString('ja-JP');
}
function num(v){ return Number(String(v==null?'':v).replace(/,/g,'')) || 0; }
function fmtInput(v){
  if(v===undefined || v===null || v==='') return '';
  const n = Number(v);
  if(isNaN(n)) return '';
  return n.toLocaleString('ja-JP');
}
function sumFields(obj, fields){
  return fields.reduce((s,f)=> s + num(obj[f.key]), 0);
}
function monthLabel(ym){
  if(!ym) return '';
  const [y,m] = ym.split('-');
  return `${y}年${parseInt(m,10)}月`;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }

/* ============ 収支入力タブ ============ */
let editingYm = null;

function yearMonthOptions(draft){
  const now = new Date();
  const curYear = now.getFullYear();
  const [dy, dm] = draft ? draft.ym.split('-').map(Number) : [curYear, now.getMonth()+1];
  const years = [];
  for(let y=curYear-3; y<=curYear+60; y++) years.push(y);
  const yearOpts = years.map(y=>`<option value="${y}" ${y===dy?'selected':''}>${y}年</option>`).join('');
  const monthOpts = Array.from({length:12},(_,i)=>i+1).map(m=>`<option value="${m}" ${m===dm?'selected':''}>${m}月</option>`).join('');
  return {yearOpts, monthOpts};
}

function saveEntry(){
  const yearEl = document.getElementById('f-year');
  const monthEl = document.getElementById('f-month');
  const ym = (yearEl && monthEl) ? `${yearEl.value}-${String(monthEl.value).padStart(2,'0')}` : '';
  if(!ym){ alert('開始年月を選択してください'); return; }
  const income = {}; INCOME_FIELDS.forEach(f=> income[f.key] = num(document.getElementById('inc-'+f.key).value));
  const expenses = {}; EXPENSE_FIELDS.forEach(f=> expenses[f.key] = num(document.getElementById('exp-'+f.key).value));

  const idx = state.entries.findIndex(e=>e.ym===ym);
  const entry = {ym, income, expenses};
  if(idx>=0) state.entries[idx] = entry; else state.entries.push(entry);

  editingYm = null;
  saveState();
  renderInputTab();
}

function renderEntryList(){
  const box = document.getElementById('entry-list');
  const sorted = [...state.entries].sort((a,b)=> b.ym.localeCompare(a.ym));
  if(sorted.length===0){ box.innerHTML = '<div class="empty">まだ記録がありません</div>'; return; }
  box.innerHTML = sorted.map(e=>{
    const incTotal = sumFields(e.income, INCOME_FIELDS);
    const expTotal = sumFields(e.expenses, EXPENSE_FIELDS);
    const net = incTotal - expTotal;
    return `
      <div class="entry-item">
        <div>
          <div class="meta">${monthLabel(e.ym)}</div>
          <div class="sub">収入 ${yen(incTotal)} ／ 支出 ${yen(expTotal)}</div>
        </div>
        <div class="figs">
          <div class="net ${net>=0?'pos':'neg'}">${net>=0?'+':''}${yen(net)}</div>
        </div>
        <div class="acts">
          <button class="icon-btn" data-edit="${e.ym}" title="編集">✎</button>
          <button class="icon-btn" data-del="${e.ym}" title="削除">🗑</button>

function pensionAnnual(base65, startAge){
  base65 = num(base65);
  const months = (startAge - 65) * 12;
  let rate = 0;
  if(months > 0) rate = months * 0.007;       // 繰下げ受給：1ヶ月あたり+0.7%
  else if(months < 0) rate = months * 0.004;  // 繰上げ受給：1ヶ月あたり-0.4%（参考）
  return Math.round(base65 * (1 + rate));
}
function addYears(dateStr, years){
  const d = new Date(dateStr);
  d.setFullYear(d.getFullYear() + years);
  return d;
}
function fmtDate(d){

}

/* ============ バックアップの保存・復元 ============ */
function exportBackup(){
  const payload = {
    app: 'kakei-sim',
    version: 'Ver1.7',
    exportedAt: new Date().toISOString(),
    data: state
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const ts = new Date();
  const pad = n=>String(n).padStart(2,'0');
  const fname = `kakei-sim-backup-${ts.getFullYear()}${pad(ts.getMonth()+1)}${pad(ts.getDate())}-${pad(ts.getHours())}${pad(ts.getMinutes())}.json`;
  const a = document.createElement('a');
  a.href = url;
  a.download = fname;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importBackupFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    let incoming;
    try{
      const parsed = JSON.parse(reader.result);
      incoming = (parsed && typeof parsed === 'object' && parsed.data) ? parsed.data : parsed;
      if(!incoming || typeof incoming !== 'object') throw new Error('invalid format');
    }catch(e){
      alert('ファイルの読み込みに失敗しました。正しいバックアップファイルか確認してください。');
      return;
    }
    if(!confirm('現在のデータを、選択したバックアップファイルの内容で上書きします。よろしいですか？')) return;
    state = normalizeState(incoming);
    saveState();
    renderHeader();
    renderers[currentTab]();
    alert('バックアップから復元しました');
  };
  reader.onerror = ()=>{
    alert('ファイルの読み込みに失敗しました。');
  };
  reader.readAsText(file);
}

function averageOf(key, source){
  // source: 'income' or 'expenses'
  const vals = state.entries.map(e => num(e[source][key]));
  if(vals.length===0) return 0;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}
function computeMonthlyNetFromEntries(){
  // 収支入力の記録から、月あたりの平均収支差額（収入合計－支出合計）を算出
  if(state.entries.length===0) return 0;
  const nets = state.entries.map(e => sumFields(e.income, INCOME_FIELDS) - sumFields(e.expenses, EXPENSE_FIELDS));
  return Math.round(nets.reduce((a,b)=>a+b,0)/nets.length);
}

function runSimulation(){
  const s = state.settings;

  const salary = num(document.getElementById('si-salary').value);
  const dividend = num(document.getElementById('si-dividend').value);
  const expenses = {};
  EXPENSE_FIELDS.forEach(f=> expenses[f.key] = num(document.getElementById('si-exp-'+f.key).value));

  state.simInputs = { salary, dividend, expenses };
  saveState();

  const annual = pensionAnnual(s.pensionBase65, s.startAge);
  const pensionMonthly = annual/12;
  const expenseTotal = Object.values(expenses).reduce((a,b)=>a+b,0);
  const incomeMonthly = salary + pensionMonthly + dividend;
  const netMonthly = incomeMonthly - expenseTotal;
  const shortfall = s.monthlyBudget - netMonthly; // 受給開始後：> 0 なら資産を取り崩す

  const preNetMonthly = computeMonthlyNetFromEntries(); // 受給開始前：現在の収支入力の月平均差額

  const bigExpenseByYm = {};
  state.bigExpenses.forEach(e=>{
    bigExpenseByYm[e.ym] = (bigExpenseByYm[e.ym]||0) + num(e.amount);
  });

  let savings = state.assets.savings;
  let investment = state.assets.investment;

  const startDate = addYears(s.birthDate, s.startAge); // 年金受給開始日
  const endDate = addYears(s.birthDate, s.simEndAge);

  const today = new Date();
  today.setDate(1);

  const points = []; // {date, savings, investment}
  let cursor = new Date(today < startDate ? today : startDate);
  let depletedAt = null;

  points.push({date:new Date(cursor), savings, investment});

  function drawDown(amount){
    // 貯蓄→投資運用額の順に取り崩す。両方尽きたらtrueを返す
    if(amount <= 0) return false;
    if(savings >= amount){ savings -= amount; return false; }
    const remaining = amount - savings;
    savings = 0;
    if(investment >= remaining){ investment -= remaining; return false; }
    investment = 0;
    return true;
  }

  let guardMonths = 0;
  while(cursor < endDate && guardMonths < 2400){
    guardMonths++;
    const cursorYm = `${cursor.getFullYear()}-${String(cursor.getMonth()+1).padStart(2,'0')}`;
    const inPensionPhase = cursor >= startDate;

    // 自動車購入・リフォームなど、単発の大きな支出（予定年月が一致する月に一括で取り崩す）
    if(bigExpenseByYm[cursorYm]){
      if(drawDown(bigExpenseByYm[cursorYm])){
        depletedAt = new Date(cursor);
        depletedAt.setMonth(depletedAt.getMonth()+1);
        cursor.setMonth(cursor.getMonth()+1);
        points.push({date:new Date(cursor), savings, investment});
        break;
      }
    }

    if(!inPensionPhase){
      // 年金受給開始日まで：現在の収支の差額を貯蓄額へ加算（マイナス収支ならその分減額）
      savings += preNetMonthly;
      if(savings < 0) savings = 0;
    } else if(shortfall > 0){
      if(drawDown(shortfall)){
        depletedAt = new Date(cursor);
        depletedAt.setMonth(depletedAt.getMonth()+1);
        cursor.setMonth(cursor.getMonth()+1);
        points.push({date:new Date(cursor), savings, investment});
        break;
      }
    } else {
      savings += (-shortfall);
    }

    cursor.setMonth(cursor.getMonth()+1);
    // 12ヶ月に一度だけ記録（グラフを軽量化）
    if(guardMonths % 12 === 0){
      points.push({date:new Date(cursor), savings, investment});
    }
  }
  if(!depletedAt){
    points.push({date:new Date(cursor), savings, investment});
  }

  renderSimResult({shortfall, depletedAt, birthDate:s.birthDate, endAgeSetting:s.simEndAge, finalBalance: savings+investment, points, startDate});
}

function ageAt(birthDateStr, date){
  const b = new Date(birthDateStr);
  let age = date.getFullYear() - b.getFullYear();
  const beforeBirthday = (date.getMonth() < b.getMonth()) || (date.getMonth()===b.getMonth() && date.getDate() < b.getDate());
  if(beforeBirthday) age--;
  return age;
}

function renderSimResult({shortfall, depletedAt, birthDate, endAgeSetting, finalBalance, points, startDate}){
  const box = document.getElementById('si-result');
  let bannerClass, headline, detail, iconSvg;
  const okIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>';
  const warnIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17v.5"/></svg>';

  if(depletedAt){
    const age = ageAt(birthDate, depletedAt);
    headline = `${age}歳ごろ（${fmtDate(depletedAt)}）に資金が枯渇する見込みです`;
    detail = `毎月の不足額は約${yen(shortfall)}です。不足分を貯蓄・投資運用額から取り崩しながら毎月の利用可能額（${yen(state.settings.monthlyBudget)}）を使い続けると、上記の時期に資産が尽きる計算になります。`;
    bannerClass = 'warn'; iconSvg = warnIcon;
  } else if(shortfall > 0){
    headline = `${endAgeSetting}歳まで資金は維持できる見込みです`;
    detail = `毎月の不足額は約${yen(shortfall)}で、貯蓄・投資運用額から取り崩しますが、${endAgeSetting}歳の時点で約${yen(finalBalance)}が残る見込みです。`;
    bannerClass = 'ok'; iconSvg = okIcon;
  } else {
    headline = `${endAgeSetting}歳まで資金は減らずに維持できる見込みです`;
    detail = `毎月の収支は目標の利用可能額を上回っており、余剰分は貯蓄に加算されます。${endAgeSetting}歳時点の資産見込みは約${yen(finalBalance)}です。`;
    bannerClass = 'ok'; iconSvg = okIcon;
  }

  const last = points[points.length-1];

  box.innerHTML = `
    <div class="result-banner ${bannerClass}">
      ${iconSvg}
      <div class="content">
        <div class="headline">${headline}</div>
        <div class="detail">${detail}</div>
      </div>
    </div>
    <div class="card">
      <div class="c-head">
        <span class="c-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M4 16l5-5 4 3 7-8"/><path d="M15 6h5v5"/></svg></span>
        <h2>資産残高の推移<span class="sec-note">内訳つき</span></h2>
      </div>
      <div class="chips">
        <div class="chip" style="--dot:var(--teal)"><div class="lbl"><i></i>貯蓄額</div><div class="v">${yen(last.savings)}</div></div>
        <div class="chip" style="--dot:var(--gold)"><div class="lbl"><i></i>投資運用額</div><div class="v">${yen(last.investment)}</div></div>
        <div class="chip" style="--dot:var(--pos)"><div class="lbl"><i></i>資産合計（${endAgeSetting}歳時点）</div><div class="v">${yen(last.savings+last.investment)}</div></div>
      </div>
      <div class="chart-box"><canvas id="sim-chart"></canvas></div>
      <div class="field-note">積み上げ表示：下段が貯蓄額、上段が投資運用額です。点線は年金受給開始のタイミングを示します。</div>
    </div>
  `;
  drawBalanceChart(points, birthDate, startDate);
}

function yenCompact(n){
  n = Math.round(Number(n)||0);
  if(n === 0) return '¥0';
  const man = Math.round(n/10000);
  return man.toLocaleString('ja-JP') + '万円';
}

let simChartInstance = null;
const pensionStartLinePlugin = {
  id: 'pensionStartLine',
  afterDatasetsDraw(chart, args, opts){
    if(opts.index == null || opts.index < 0) return;
    const xScale = chart.scales.x;
    const x = xScale.getPixelForValue(opts.index);
    const {top, bottom} = chart.chartArea;
    const ctx = chart.ctx;
    ctx.save();
    ctx.strokeStyle = 'rgba(242,184,75,.8)';
    ctx.setLineDash([5,5]);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x, top+16);
    ctx.lineTo(x, bottom);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#F2B84B';
    ctx.font = '700 11px "Zen Kaku Gothic New",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(opts.label||'', x, top+10);
    ctx.restore();
  }
};

function drawBalanceChart(points, birthDate, startDate){
  const canvas = document.getElementById('sim-chart');
  if(!canvas || typeof Chart === 'undefined') return;
  if(points.length < 2) return;

  if(!drawBalanceChart._defaultsSet){
    Chart.defaults.color = '#94A5B8';
    Chart.defaults.borderColor = 'rgba(255,255,255,.06)';
    Chart.defaults.font.family = '"DM Sans","Zen Kaku Gothic New",sans-serif';
    Chart.defaults.font.size = 12;
    Chart.defaults.plugins.tooltip.backgroundColor = '#0B121B';
    Chart.defaults.plugins.tooltip.borderColor = '#2B3D55';
    Chart.defaults.plugins.tooltip.borderWidth = 1;
    Chart.defaults.plugins.tooltip.padding = 10;
    drawBalanceChart._defaultsSet = true;
  }

  const labels = points.map(p => ageAt(birthDate, p.date) + '歳');
  const pensionIdx = points.findIndex(p => p.date >= startDate);

  if(simChartInstance){ simChartInstance.destroy(); }
  simChartInstance = new Chart(canvas, {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label:'貯蓄額', data: points.map(p=>Math.round(p.savings)), borderColor:'#F2B84B', backgroundColor:'rgba(242,184,75,.35)', borderWidth:2, tension:.3, pointRadius:0, pointHoverRadius:5, fill:'origin', stack:'assets' },
        { label:'投資運用額', data: points.map(p=>Math.round(p.investment)), borderColor:'#7AA7FF', backgroundColor:'rgba(122,167,255,.35)', borderWidth:2, tension:.3, pointRadius:0, pointHoverRadius:5, fill:'origin', stack:'assets' }
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      interaction:{ mode:'index', intersect:false },
      plugins:{
        legend:{ display:false },
        pensionStartLine:{ index: pensionIdx, label:'年金開始' },
        tooltip:{ callbacks:{
          label: c => ` ${c.dataset.label}: ${yen(c.raw)}`,
          footer: items => '合計 ' + yen(items.reduce((s,i)=>s+i.raw,0))
        } }
      },
      scales:{
        x:{ stacked:true, grid:{ display:false }, ticks:{ maxTicksLimit:8 } },
        y:{ stacked:true, min:0, ticks:{ callback: v => yenCompact(v) }, border:{ display:false } }
      }
    },
    plugins:[pensionStartLinePlugin]
  });
}


/* ============ 金額入力欄のカンマ整形（全タブ共通） ============ */
document.addEventListener('input', e=>{
  if(e.target && e.target.classList && e.target.classList.contains('money-input')){
    const raw = e.target.value.replace(/[^0-9]/g,'');
    e.target.value = raw ? Number(raw).toLocaleString('ja-JP') : '';
  }
});

/* ============ 初期化 ============ */
showAuthScreen('loading');
if(fbAuth && dataRef){
  fbLoginGate({ onState: cb => fbAuth.onAuthStateChanged(cb), login: (m,p) => fbAuth.signInWithEmailAndPassword(m,p), logout: () => fbAuth.signOut() }).then(()=>{
    if(firebaseReady) return;
    firebaseReady = true;
    initFirebaseSync();
  });
} else {
  initFirebaseSync();
}
</script>
