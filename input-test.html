<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="入力テスト">
<title>入力テスト</title>
<style>
  body{margin:0;padding:20px 16px 60px;background:#EEF1F5;color:#172234;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;font-size:15px;line-height:1.6}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px}
  .note{color:#5E6B80;font-size:13px;margin:0 0 16px}
  .card{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .card h2{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;gap:8px}
  .mark{font-size:14px;font-weight:700}
  .ok{color:#2E8062} .ng{color:#B3362D} .yet{color:#95A1B5}
  .styled{display:block;width:100%;height:48px;padding:0 14px;border:1px solid #DCE2EA;border-radius:8px;
    background:#F6F8FB;font-size:16px;-webkit-appearance:none;appearance:none;box-sizing:border-box}
  form input{display:block;width:100%;height:44px;margin-bottom:8px;font-size:16px;box-sizing:border-box}
  button{font:inherit;font-weight:700;padding:10px 14px;border-radius:8px;border:0;background:#3D63B0;color:#fff}
  button.sub{background:#DCE2EA;color:#172234}
  #fbState{font-size:13px;color:#5E6B80;margin-top:8px}
  .result{background:#1F3358;color:#fff;border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:14px}
  .result b{display:block;margin-bottom:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>入力テスト</h1>
  <p class="note">ホーム画面から開き、①から順に入力欄をタッチしてください。画面が消えて再表示されたら、次の番号へ進んでください。最後にこの画面のスクリーンショットを送ってください。</p>

  <div class="result" id="result"></div>

  <div class="card">
    <h2>① 飾りなしの入力欄 <span class="mark" id="m-t1"></span></h2>
    <input id="t1" type="text">
  </div>

  <div class="card">
    <h2>② アプリと同じ見た目の入力欄 <span class="mark" id="m-t2"></span></h2>
    <input id="t2" class="styled" type="text">
  </div>

  <div class="card">
    <h2>③ メール+パスワード(ログイン形式) <span class="mark" id="m-t3"></span></h2>
    <form onsubmit="return false" autocomplete="on">
      <input id="t3" type="email" autocomplete="username" placeholder="メールアドレス">
      <input id="t3p" type="password" autocomplete="current-password" placeholder="パスワード">
    </form>
  </div>

  <div class="card">
    <h2>④ Firebase読み込み後の入力欄 <span class="mark" id="m-t4"></span></h2>
    <button id="fbBtn">先にこのボタンを押す</button>
    <div id="fbState">未読み込み</div>
    <input id="t4" type="text" style="margin-top:10px;display:block;width:100%;height:44px;font-size:16px;box-sizing:border-box">
  </div>

  <button class="sub" id="resetBtn">結果をリセット</button>
</div>

<script>
(function(){
  var K='input_test', d={};
  try{ d=JSON.parse(localStorage.getItem(K))||{}; }catch(e){}
  d.res=d.res||{};
  var save=function(){ try{localStorage.setItem(K,JSON.stringify(d));}catch(e){} };
  var ids=['t1','t2','t3','t4'];
  var norm=function(id){ return id==='t3p'?'t3':id; };

  // 前回、入力欄をタッチしてすぐ落ちていたら「×」
  if(d.pending && Date.now()-d.pending.t < 120000){ d.res[d.pending.id]='ng'; }
  d.pending=null; save();

  function paint(){
    ids.forEach(function(id){
      var r=d.res[id], el=document.getElementById('m-'+id);
      el.textContent = r==='ok'?'○ 落ちない':r==='ng'?'× 落ちる':'未テスト';
      el.className='mark '+(r==='ok'?'ok':r==='ng'?'ng':'yet');
    });
    var standalone=(navigator.standalone===true)||matchMedia('(display-mode: standalone)').matches;
    document.getElementById('result').innerHTML='<b>テスト結果</b>'+
      '開き方:'+(standalone?'ホーム画面':'ブラウザ')+'<br>'+
      ids.map(function(id,i){ var r=d.res[id]; return '①②③④'[i]+' '+(r==='ok'?'○':r==='ng'?'×':'-'); }).join(' / ');
  }
  paint();

  var timer=null;
  document.addEventListener('focusin',function(e){
    var id=norm(e.target.id); if(ids.indexOf(id)<0) return;
    d.pending={id:id,t:Date.now()}; save();
    clearTimeout(timer);
    timer=setTimeout(function(){ d.res[id]='ok'; d.pending=null; save(); paint(); },4000); // 4秒生きていれば「○」
  },true);

  document.getElementById('resetBtn').onclick=function(){ d={res:{}}; save(); paint(); };
})();
</script>

<script type="module">
document.getElementById('fbBtn').onclick = async () => {
  const st = document.getElementById('fbState');
  st.textContent = '読み込み中…';
  try{
    const B='https://www.gstatic.com/firebasejs/10.12.2/';
    const { initializeApp } = await import(B+'firebase-app.js');
    const { initializeAuth, browserLocalPersistence } = await import(B+'firebase-auth.js');
    const { getDatabase, ref, onValue } = await import(B+'firebase-database.js');
    const app = initializeApp({
      apiKey: "AIzaSyBUQjfeamTm1gCWNiXhZcxyBIUiQSptvDs",
      authDomain: "asset-tracker-b3fac.firebaseapp.com",
      databaseURL: "https://asset-tracker-b3fac-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "asset-tracker-b3fac",
      storageBucket: "asset-tracker-b3fac.firebasestorage.app",
      messagingSenderId: "36181399487",
      appId: "1:36181399487:web:0ef48412b814d81aaa330a"
    });
    initializeAuth(app, { persistence: browserLocalPersistence });
    onValue(ref(getDatabase(app), '.info/connected'), s => {
      st.textContent = 'Firebase読み込み済み(接続:' + (s.val() ? 'あり' : 'なし') + ')→ 下の入力欄をタッチ';
    });
  }catch(e){ st.textContent = '読み込み失敗:' + e.message; }
};
</script>
</body>
</html>
