<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://www.gstatic.com; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src https://*.firebasedatabase.app wss://*.firebasedatabase.app https://*.firebaseio.com wss://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>定期コスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EDEFE7;
    --paper-line: #D9DCCF;
    --card: #FBFCF9;
    --ink: #1F2A24;
    --ink-soft: #57604F;
    --stamp: #B33A3A;
    --stamp-soft: #E9D4CF;
    --ledger: #4A6B5A;
    --ledger-soft: #DCE6DD;
    --gold: #B08A3E;
    --radius: 4px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      repeating-linear-gradient(180deg, transparent, transparent 39px, var(--paper-line) 40px);
    color:var(--ink);
    font-family:'IBM Plex Sans JP', sans-serif;
    min-height:100vh;
    padding-bottom:100px;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:28px 18px 0;
  }
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:22px;
    border-bottom:2px solid var(--ink);
    padding-bottom:10px;
  }
  .title-row{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .version-badge{
    font-size:11px;
    color:var(--ink-soft);
    border:1px solid var(--paper-line);
    border-radius:10px;
    padding:1px 8px;
    font-family:'IBM Plex Sans JP', sans-serif;
  }
  h1{
    font-family:'Source Serif 4', serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:.02em;
    margin:0;
  }
  .sub-count{
    font-size:12px;
    color:var(--ink-soft);
  }
  .totals{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:24px;
  }
  .total-card{
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:16px 14px;
    position:relative;
    overflow:hidden;
  }
  .total-card::before{
    content:'';
    position:absolute;
    top:0; left:0;
    width:4px; height:100%;
    background:var(--ledger);
  }
  .total-card.year::before{ background:var(--gold); }
  .total-label{
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .total-value{
    font-family:'Source Serif 4', serif;
    font-weight:600;
    font-size:26px;
    line-height:1.1;
    font-variant-numeric:tabular-nums;
  }
  .total-value span.yen{
    font-size:15px;
    margin-right:2px;
    color:var(--ink-soft);
  }
  .cat-summary{
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:14px 14px 6px;
    margin-bottom:22px;
  }
  .cat-summary-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
  }
  .cat-summary-head .label{
    font-size:12px;
    color:var(--ink-soft);
  }
  .cat-toggle{
    display:flex;
    gap:4px;
    background:var(--paper);
    border-radius:12px;
    padding:2px;
  }
  .cat-toggle button{
    border:none;
    background:none;
    font-family:inherit;
    font-size:11px;
    padding:4px 10px;
    border-radius:10px;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .cat-toggle button.active{
    background:var(--ink);
    color:var(--paper);
  }
  .cat-row{
    margin-bottom:10px;
  }
  .cat-row-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-size:13px;
    margin-bottom:4px;
  }
  .cat-row-name{
    display:flex;
    align-items:center;
    gap:6px;
    font-weight:500;
  }
  .cat-row-amount{
    font-family:'Source Serif 4', serif;
    font-weight:600;
    font-variant-numeric:tabular-nums;
  }
  .cat-row-pct{
    font-size:11px;
    color:var(--ink-soft);
    margin-left:6px;
  }
  .cat-bar-track{
    height:6px;
    background:var(--paper);
    border-radius:3px;
    overflow:hidden;
  }
  .cat-bar-fill{
    height:100%;
    border-radius:3px;
  }
  .section-title{
    font-size:12px;
    color:var(--ink-soft);
    margin:0 0 10px 2px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .sort-select{
    font-family:inherit;
    font-size:12px;
    color:var(--ink);
    background:transparent;
    border:none;
    border-bottom:1px solid var(--paper-line);
    padding:2px 0;
  }
  .list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:20px;
  }
  .item{
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:14px 14px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    position:relative;
  }
  .item.due-soon{
    background:#FBEDEA;
    border:1px solid var(--stamp);
    box-shadow:0 0 0 1px var(--stamp);
    padding-left:18px;
  }
  .item.due-soon::before{
    content:'';
    position:absolute;
    top:0; left:0;
    width:6px;
    height:100%;
    background:var(--stamp);
    border-radius:var(--radius) 0 0 var(--radius);
  }
  .item.due-today{
    background:#F7DCD5;
  }
  .item-main{ flex:1; min-width:0; }
  .item-name{
    font-weight:600;
    font-size:16px;
    margin-bottom:4px;
    word-break:break-word;
    display:flex;
    align-items:center;
    gap:7px;
  }
  .cat-dot{
    display:inline-block;
    width:9px;
    height:9px;
    border-radius:50%;
    flex-shrink:0;
  }
  .badge.cat{
    border:1px solid transparent;
  }
  .item-meta{
    font-size:12px;
    color:var(--ink-soft);
    display:flex;
    flex-wrap:wrap;
    gap:6px 10px;
    align-items:center;
  }
  .badge{
    display:inline-block;
    font-size:11px;
    padding:1px 7px;
    border-radius:10px;
    background:var(--ledger-soft);
    color:var(--ledger);
    border:1px solid transparent;
  }
  .badge.year{ background:#F1E8D3; color:var(--gold); }
  .badge.due{
    background:var(--stamp);
    color:#fff;
    font-weight:700;
    padding:2px 9px;
    animation:pulse-due 1.6s ease-in-out infinite;
  }
  @keyframes pulse-due{
    0%, 100% { opacity:1; }
    50% { opacity:.62; }
  }
  @media (prefers-reduced-motion: reduce){
    .badge.due{ animation:none; }
  }
  .item-memo{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:6px;
    padding-top:6px;
    border-top:1px dashed var(--paper-line);
  }
  .item-right{
    text-align:right;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:8px;
  }
  .item-amount{
    font-family:'Source Serif 4', serif;
    font-weight:600;
    font-size:18px;
    white-space:nowrap;
  }
  .item-actions{
    display:flex;
    gap:6px;
  }
  .icon-btn{
    border:none;
    background:none;
    color:var(--ink-soft);
    font-size:14px;
    padding:4px 6px;
    cursor:pointer;
  }
  .icon-btn:active{ color:var(--stamp); }
  .icon-btn.cancel-btn{ color:var(--stamp); }
  .icon-btn.renew-btn{ color:var(--ledger); }
  .empty{
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    padding:40px 10px;
    border:1px dashed var(--paper-line);
    border-radius:var(--radius);
  }
  .fab{
    position:fixed;
    right:20px;
    bottom:28px;
    width:56px;
    height:56px;
    border-radius:50%;
    background:var(--ink);
    color:var(--paper);
    border:none;
    font-size:28px;
    line-height:1;
    box-shadow:0 4px 14px rgba(0,0,0,.25);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:20;
  }
  .fab:active{ transform:scale(.94); }
  .sync-note{
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    padding:6px 0 10px;
  }
  .sync-dot{
    display:inline-block;
    width:6px;height:6px;
    border-radius:50%;
    background:#8ba88c;
    margin-right:5px;
  }
  .sync-dot.off{ background:var(--stamp); }
  .backup-row{
    display:flex;
    justify-content:center;
    gap:18px;
    padding-bottom:24px;
  }
  .backup-link{
    font-size:12px;
    color:var(--ledger);
    background:none;
    border:none;
    text-decoration:underline;
    cursor:pointer;
    font-family:inherit;
    padding:4px;
  }

  /* login */
  .login-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:var(--paper);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  body.locked .login-overlay{ display:flex; }
  body.locked .wrap,
  body.locked .fab,
  body.locked .overlay{ display:none !important; }
  body.booting .login-card{ visibility:hidden; }
  .login-card{
    width:100%;
    max-width:360px;
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:24px 20px;
  }
  .login-card h2{
    font-family:'Source Serif 4', serif;
    font-size:22px;
    margin:0 0 4px;
  }
  .login-card .login-note{
    font-size:12px;
    color:var(--ink-soft);
    margin:0 0 18px;
  }
  .login-error{
    min-height:18px;
    font-size:12px;
    color:var(--stamp);
    margin:0 0 10px;
  }

  /* modal */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(31,42,36,.45);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:30;
  }
  .overlay.open{ display:flex; }
  .modal{
    background:var(--paper);
    width:100%;
    max-width:640px;
    border-radius:16px 16px 0 0;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    max-height:88vh;
    overflow-y:auto;
    box-shadow:0 -6px 24px rgba(0,0,0,.2);
  }
  .modal h2{
    font-family:'Source Serif 4', serif;
    font-size:19px;
    margin:0 0 16px;
    border-bottom:2px solid var(--ink);
    padding-bottom:8px;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  .field input, .field select, .field textarea{
    width:100%;
    font-family:inherit;
    font-size:15px;
    padding:10px 11px;
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    background:var(--card);
    color:var(--ink);
  }
  .field textarea{ resize:vertical; min-height:56px; }
  .cycle-toggle{
    display:flex;
    gap:8px;
  }
  .cycle-toggle button{
    flex:1;
    padding:10px;
    border:1px solid var(--paper-line);
    background:var(--card);
    border-radius:var(--radius);
    font-family:inherit;
    font-size:14px;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .cycle-toggle button.active{
    background:var(--ledger);
    border-color:var(--ledger);
    color:#fff;
  }
  .modal-actions{
    display:flex;
    gap:10px;
    margin-top:6px;
  }
  .btn{
    flex:1;
    padding:13px;
    border-radius:var(--radius);
    border:none;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .btn-primary{ background:var(--ink); color:var(--paper); }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--paper-line); }
  .btn-delete{ background:var(--stamp); color:#fff; }
</style>
</head>
<body class="locked booting">

<div class="login-overlay" id="loginOverlay">
  <form class="login-card" id="loginForm" novalidate>
    <h2>定期コスト</h2>
    <p class="login-note">この端末で初回のみサインインしてください。</p>
    <div class="field">
      <label for="loginEmail">メールアドレス</label>
      <input type="email" id="loginEmail" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="254">
    </div>
    <div class="field">
      <label for="loginPassword">パスワード</label>
      <input type="password" id="loginPassword" autocomplete="current-password" maxlength="128">
    </div>
    <div class="login-error" id="loginError" role="alert"></div>
    <button type="submit" class="btn btn-primary" id="loginBtn" style="width:100%;">サインイン</button>
  </form>
</div>

<div class="wrap">
  <header>
    <div>
      <div class="title-row">
        <h1>定期コスト</h1>
        <span class="version-badge" id="versionBadge">v1.0.0</span>
      </div>
      <div class="sub-count" id="subCount">0件登録中</div>
    </div>
  </header>

  <div class="totals">
    <div class="total-card month">
      <div class="total-label">月計</div>
      <div class="total-value"><span class="yen">¥</span><span id="monthTotal">0</span></div>
    </div>
    <div class="total-card year">
      <div class="total-label">年計</div>
      <div class="total-value"><span class="yen">¥</span><span id="yearTotal">0</span></div>
    </div>
  </div>

  <div class="cat-summary">
    <div class="cat-summary-head">
      <span class="label">カテゴリ別集計</span>
      <div class="cat-toggle" id="catToggle">
        <button type="button" data-mode="month" class="active">月別</button>
        <button type="button" data-mode="year">年別</button>
      </div>
    </div>
    <div id="catSummaryBody"></div>
  </div>

  <div class="section-title">
    <span>登録リスト</span>
    <select class="sort-select" id="sortSelect">
      <option value="date">次回課金日順</option>
      <option value="amountDesc">金額が高い順</option>
      <option value="name">名前順</option>
      <option value="category">カテゴリ順</option>
    </select>
  </div>

  <div class="list" id="list"></div>
  <div class="empty" id="emptyState" style="display:none;">まだ登録がありません。右下の＋から追加してください。</div>

  <div class="sync-note"><span class="sync-dot" id="syncDot"></span><span id="syncText">同期状態を確認中…</span></div>
  <div class="backup-row">
    <button class="backup-link" id="backupBtn">バックアップを保存</button>
    <button class="backup-link" id="restoreBtn">バックアップから復元</button>
    <button class="backup-link" id="logoutBtn">サインアウト</button>
  </div>
  <input type="file" id="restoreFile" accept="application/json" style="display:none;">
</div>

<button class="fab" id="openAdd" aria-label="追加">＋</button>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">サブスクを追加</h2>
    <input type="hidden" id="editId">
    <div class="field">
      <label>サービス名</label>
      <input type="text" id="fName" placeholder="例：Netflix" maxlength="100">
    </div>
    <div class="field">
      <label>カテゴリ</label>
      <select id="fCategory"></select>
    </div>
    <div class="field">
      <label>課金周期</label>
      <div class="cycle-toggle">
        <button type="button" id="cycleMonth" class="active">月次</button>
        <button type="button" id="cycleYear">年次</button>
      </div>
    </div>
    <div class="field">
      <label>金額（円）</label>
      <input type="number" id="fAmount" placeholder="例：1490" inputmode="numeric">
    </div>
    <div class="field">
      <label>次回課金日</label>
      <input type="date" id="fDate" min="2000-01-01" max="2100-12-31">
    </div>
    <div class="field">
      <label>解約予定・メモ（任意）</label>
      <textarea id="fMemo" placeholder="例：来年3月に解約予定 / 家族プランで分担中" maxlength="500"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelBtn">キャンセル</button>
      <button class="btn btn-primary" id="saveBtn">保存</button>
    </div>
    <div class="modal-actions" id="deleteRow" style="display:none;">
      <button class="btn btn-delete" id="deleteBtn">この登録を削除</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getDatabase, ref, onValue, set, remove, push

} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// Firebase 接続設定（公開前提の識別子です。データの保護はサインイン＋データベースルールで行います）
const firebaseConfig = {

/*
  定期コスト — バージョン履歴
  v1.0.0 (2026-09-05) カテゴリ機能を実装、アプリ名を「定期コスト」に変更しバージョン管理を開始
  v1.1.0 (2026-09-05) 次回更新日の5日前からアラート表示に変更。各項目に「更新」（次回課金日を1周期進める）「解約」（確認後に削除）ボタンを追加
  v1.1.1 (2026-09-05) アラート表示を強化：該当項目を赤背景+左帯で強調、バッジを点滅表示、画面上部に更新間近の一覧バナーを追加
  v1.1.2 (2026-09-05) 画面上部の「もうすぐ更新」一覧バナーを削除。項目カード側の赤背景・点滅バッジによる強調表示のみに変更

document.getElementById('versionBadge').textContent = APP_VERSION;

// ---------- 定数・検証ユーティリティ ----------
const LIMIT = {

  categories: 30,
  amountMax: 1000000000,
  backupBytes: 2 * 1024 * 1024
};
const ID_RE = /^[A-Za-z0-9_-]{1,64}$/;
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const COLOR_RE = /^#[0-9A-Fa-f]{6}$/;
const FALLBACK_COLOR = '#8A8F82';

const DEFAULT_CATEGORIES = [
  { id: 'hobby',  label: '趣味・娯楽', color: '#B33A3A' },
  { id: 'car',    label: '車',       color: '#3A5FB3' },
  { id: 'tax',    label: '税金',     color: '#B08A3E' },
  { id: 'health', label: '医療',     color: '#4A6B5A' },
  { id: 'other',  label: 'その他',   color: FALLBACK_COLOR }
];
// 新規カテゴリ追加時に順番に割り当てる色パレット
const COLOR_PALETTE = ['#7A4FA0','#3A9DA8','#C9743A','#5C7A9E','#9E5C7A','#6B8E4E','#A8763A','#4E6B8E'];

function isPlainObject(v){
  return v !== null && typeof v === 'object' && !Array.isArray(v);
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"'`]/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;', '`':'&#96;'
  }[c]));
}

// YYYY-MM-DD を厳密に解釈（範囲外・存在しない日付は null）。ローカル日付として扱う
function parseYMD(s){
  if(typeof s !== 'string' || !DATE_RE.test(s)) return null;
  const y = Number(s.slice(0, 4)), m = Number(s.slice(5, 7)), d = Number(s.slice(8, 10));
  if(y < 2000 || y > 2100) return null;
  const dt = new Date(y, m - 1, d);
  if(dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;
  return dt;
}

function sanitizeItem(raw){
  if(!isPlainObject(raw)) return null;
  const name = typeof raw.name === 'string' ? raw.name.trim().slice(0, LIMIT.name) : '';
  if(!name) return null;
  let amount = NaN;
  if(typeof raw.amount === 'number') amount = raw.amount;
  else if(typeof raw.amount === 'string' && raw.amount.trim() !== '') amount = Number(raw.amount);
  if(!Number.isFinite(amount) || amount < 0 || amount > LIMIT.amountMax) return null;
  return {
    name,
    category: (typeof raw.category === 'string' && ID_RE.test(raw.category)) ? raw.category : 'other',
    amount,
    cycle: raw.cycle === 'year' ? 'year' : 'month',
    nextDate: parseYMD(raw.nextDate) ? raw.nextDate : '',
    memo: typeof raw.memo === 'string' ? raw.memo.trim().slice(0, LIMIT.memo) : ''
  };
}

function sanitizeItems(raw){
  const out = {};
  if(raw === null || typeof raw !== 'object') return out;
  let n = 0;
  for(const id of Object.keys(raw)){
    if(!ID_RE.test(id)) continue;
    const it = sanitizeItem(raw[id]);
    if(!it) continue;
    out[id] = it;
    if(++n >= LIMIT.items) break;
  }
  return out;
}

// Firebase形式 {id:{label,color}} とバックアップ形式 [{id,label,color}] の両方を受け付ける
function sanitizeCategories(raw){
  if(raw === null || typeof raw !== 'object') return null;
  const entries = Array.isArray(raw)
    ? raw.map(c => (isPlainObject(c) ? [c.id, c] : [null, null]))
    : Object.keys(raw).map(id => [id, raw[id]]);
  const list = [];
  const seen = new Set();
  for(const [id, c] of entries){
    if(typeof id !== 'string' || !ID_RE.test(id) || seen.has(id) || !isPlainObject(c)) continue;
    const label = typeof c.label === 'string' ? c.label.trim().slice(0, LIMIT.catLabel) : '';
    if(!label) continue;
    seen.add(id);
    list.push({
      id,
      label,
      color: (typeof c.color === 'string' && COLOR_RE.test(c.color)) ? c.color : FALLBACK_COLOR
    });
    if(list.length >= LIMIT.categories) break;
  }
  if(list.length === 0) return null;
  if(!seen.has('other')) list.push({ id: 'other', label: 'その他', color: FALLBACK_COLOR });
  return list;
}

// ---------- 状態 ----------
let items = {};
let CATEGORIES = DEFAULT_CATEGORIES.slice();
let catSummaryMode = 'month';

function categoryOf(id){
  return CATEGORIES.find(c => c.id === id)
    || CATEGORIES.find(c => c.id === 'other')
    || CATEGORIES[CATEGORIES.length - 1];
}

function nextPaletteColor(){
  const used = Math.max(0, CATEGORIES.length - DEFAULT_CATEGORIES.length);
  return COLOR_PALETTE[used % COLOR_PALETTE.length];
}

function newCategoryId(){
  return 'cat_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

// ---------- Firebase ----------
const syncDot = document.getElementById('syncDot');
const syncText = document.getElementById('syncText');
function setSyncStatus(ok, text){
  syncDot.classList.toggle('off', !ok);
  syncText.textContent = text;
}

function isPermissionError(err){
  return /permission[_ ]denied/i.test(String((err && (err.code || err.message)) || ''));
}

function handleWriteError(err){
  if(isPermissionError(err)){
    alert('保存できませんでした：権限がありません。いったんサインアウトして、もう一度サインインしてください。');
  }else{
    alert('保存に失敗しました。通信状態を確認してください。');
  }
}

let auth = null, db = null, subsRef = null, categoriesRef = null;
try{
  const app = initializeApp(firebaseConfig);
  // initializeAuth を先に呼ぶこと（Realtime Database がサインイン情報を使うため）
  auth = initializeAuth(app, { persistence: [indexedDBLocalPersistence, browserLocalPersistence] });
  db = getDatabase(app);
  subsRef = ref(db, 'subscriptions');
  categoriesRef = ref(db, 'costCategories');
}catch(e){
  setSyncStatus(false, 'Firebaseの初期化に失敗しました');
}

let unsubscribers = [];
let syncUid = null;

function startSync(uid){
  if(syncUid === uid) return;
  stopSync();
  syncUid = uid;
  setSyncStatus(true, 'iPhone / iPad 間で自動同期中');
  const onErr = (err) => {
    setSyncStatus(false, '同期エラー：' + (isPermissionError(err)
      ? '権限がありません（サインインまたはデータベースルールを確認してください）'
      : ((err && err.message) || '不明なエラー')));
  };
  unsubscribers.push(onValue(subsRef, (snap) => {
    items = sanitizeItems(snap.val());
    render();
  }, onErr));
  unsubscribers.push(onValue(categoriesRef, (snap) => {
    const raw = snap.val();
    const cats = sanitizeCategories(raw);
    if(cats){
      CATEGORIES = cats;
    }else{
      CATEGORIES = DEFAULT_CATEGORIES.slice();
      // 初回のみ：データベースが空のときだけ初期カテゴリを書き込む
      if(raw === null) saveCategories().catch(() => {});
    }
    renderCategoryOptions();
    render();
  }, onErr));
}

function stopSync(){
  unsubscribers.forEach(fn => { try{ fn(); }catch(e){} });
  unsubscribers = [];
  syncUid = null;
  items = {};
  CATEGORIES = DEFAULT_CATEGORIES.slice();
  renderCategoryOptions();
  render();
}

function saveCategories(list){
  const obj = {};
  (list || CATEGORIES).forEach(c => { obj[c.id] = { label: c.label, color: c.color }; });
  return set(categoriesRef, obj);
}

// ---------- サインイン画面 ----------
const loginForm = document.getElementById('loginForm');
const loginEmail = document.getElementById('loginEmail');
const loginPassword = document.getElementById('loginPassword');
const loginError = document.getElementById('loginError');
const loginBtn = document.getElementById('loginBtn');

function authErrorMessage(err){
  const code = String((err && err.code) || '');
  if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email','auth/missing-password'].includes(code)){
    return 'メールアドレスまたはパスワードが違います';
  }
  if(code === 'auth/too-many-requests') return '試行回数が多すぎます。しばらく待ってからやり直してください';
  if(code === 'auth/network-request-failed') return '通信に失敗しました。ネットワークを確認してください';
  if(code === 'auth/user-disabled') return 'このアカウントは無効化されています';
  return 'サインインに失敗しました';
}

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  if(!auth){ loginError.textContent = 'Firebaseの初期化に失敗しました。ページを再読み込みしてください'; return; }
  const email = loginEmail.value.trim();
  const pw = loginPassword.value;
  if(!email || !pw){ loginError.textContent = 'メールアドレスとパスワードを入力してください'; return; }
  loginError.textContent = '';
  loginBtn.disabled = true;
  try{
    await signInWithEmailAndPassword(auth, email, pw);
    loginPassword.value = '';
  }catch(err){
    loginError.textContent = authErrorMessage(err);
  }finally{
    loginBtn.disabled = false;
  }
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  if(!auth) return;
  if(!confirm('サインアウトしますか？')) return;
  try{ await signOut(auth); }catch(e){ alert('サインアウトに失敗しました'); }
});

// ---------- 計算・表示 ----------
function formatYen(n){
  return Math.round(n).toLocaleString('ja-JP');
}

function monthlyEquivalent(item){
  return item.cycle === 'year' ? item.amount / 12 : item.amount;
}
function yearlyEquivalent(item){
  return item.cycle === 'year' ? item.amount : item.amount * 12;
}

function nextOccurrence(dateStr, cycle){
  // 表示上、過去日付なら次の周期に繰り上げて見せる（日付は 2000〜2100 年のみ受け付けるため上限は有限）
  const d = parseYMD(dateStr);
  if(!d) return null;
  const today = new Date();
  today.setHours(0,0,0,0);
  let guard = 0;
  while(d < today && guard++ < 2000){
    if(cycle === 'year'){
      d.setFullYear(d.getFullYear() + 1);
    }else{
      d.setMonth(d.getMonth() + 1);
    }
  }
  return d;
}

function formatDateJP(d){
  const today = new Date();
  if(d.getFullYear() !== today.getFullYear()){
    return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
  }
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function toYMD(d){
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

const catSelect = document.getElementById('fCategory');
function renderCategoryOptions(selectedId){
  const keep = selectedId || catSelect.value || 'other';
  catSelect.textContent = '';
  CATEGORIES.forEach(c => {
    const o = document.createElement('option');
    o.value = c.id;
    o.textContent = c.label;
    catSelect.appendChild(o);
  });
  const add = document.createElement('option');
  add.value = '__add__';
  add.textContent = '＋ 新しいカテゴリを追加…';
  catSelect.appendChild(add);
  catSelect.value = CATEGORIES.some(c => c.id === keep) ? keep : 'other';
}

function render(){
  const list = document.getElementById('list');
  const empty = document.getElementById('emptyState');
  const ids = Object.keys(items);
  document.getElementById('subCount').textContent = ids.length + '件登録中';

  if(ids.length === 0){
    list.innerHTML = '';
    empty.style.display = 'block';
    document.getElementById('monthTotal').textContent = '0';
    document.getElementById('yearTotal').textContent = '0';
    document.getElementById('catSummaryBody').innerHTML = '<div class="cat-row" style="color:var(--ink-soft); font-size:12px;">データがありません</div>';
    return;
  }
  empty.style.display = 'none';

  let monthSum = 0, yearSum = 0;
  ids.forEach(id => {
    const it = items[id];
    monthSum += monthlyEquivalent(it);
    yearSum += yearlyEquivalent(it);
  });
  document.getElementById('monthTotal').textContent = formatYen(monthSum);
  document.getElementById('yearTotal').textContent = formatYen(yearSum);

  renderCategorySummary(ids);

  const sortMode = document.getElementById('sortSelect').value;
  const todayMid = new Date(); todayMid.setHours(0,0,0,0);
  let sorted = ids.map(id => ({ id, ...items[id], next: nextOccurrence(items[id].nextDate, items[id].cycle) }));
  if(sortMode === 'date'){
    sorted.sort((a,b) => {
      if(!a.next && !b.next) return 0;
      if(!a.next) return 1;
      if(!b.next) return -1;
      return a.next - b.next;
    });
  }else if(sortMode === 'amountDesc'){
    sorted.sort((a,b) => yearlyEquivalent(b) - yearlyEquivalent(a));
  }else if(sortMode === 'category'){
    sorted.sort((a,b) => {
      const ia = CATEGORIES.findIndex(c => c.id === a.category);
      const ib = CATEGORIES.findIndex(c => c.id === b.category);
      return ia - ib || a.name.localeCompare(b.name, 'ja');
    });
  }else{
    sorted.sort((a,b) => a.name.localeCompare(b.name, 'ja'));
  }

  list.innerHTML = sorted.map(it => {
    const next = it.next;
    const dleft = next ? Math.round((next - todayMid) / 86400000) : null;
    const dueSoon = dleft !== null && dleft <= 5;
    const dueToday = dleft !== null && dleft <= 0;
    const dateLabel = next ? formatDateJP(next) : '未設定';
    const cat = categoryOf(it.category);
    return `
      <div class="item ${dueSoon ? 'due-soon' : ''} ${dueToday ? 'due-today' : ''}" data-id="${esc(it.id)}">
        <div class="item-main">
          <div class="item-name"><span class="cat-dot" style="background:${esc(cat.color)}"></span>${esc(it.name)}</div>
          <div class="item-meta">
            <span class="badge cat" style="color:${esc(cat.color)}; background:${esc(cat.color)}1A;">${esc(cat.label)}</span>
            <span class="badge ${it.cycle === 'year' ? 'year' : ''}">${it.cycle === 'year' ? '年次' : '月次'}</span>
            <span>次回: ${esc(dateLabel)}</span>
            ${dueSoon ? `<span class="badge due">${dleft <= 0 ? '本日' : dleft + '日後'}</span>` : ''}
          </div>
          ${it.memo ? `<div class="item-memo">${esc(it.memo)}</div>` : ''}
        </div>
        <div class="item-right">
          <div class="item-amount">¥${formatYen(it.amount)}</div>
          <div class="item-actions">
            <button class="icon-btn renew-btn" data-act="renew" data-id="${esc(it.id)}">更新</button>
            <button class="icon-btn cancel-btn" data-act="cancel" data-id="${esc(it.id)}">解約</button>
            <button class="icon-btn edit-btn" data-act="edit" data-id="${esc(it.id)}">編集</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

document.getElementById('list').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-act]');
  if(!btn) return;
  const id = btn.dataset.id || '';
  if(!ID_RE.test(id) || !items[id]) return;
  if(btn.dataset.act === 'renew') renewItem(id);
  else if(btn.dataset.act === 'cancel') cancelItem(id);
  else if(btn.dataset.act === 'edit') openEdit(id);
});

function renderCategorySummary(ids){
  const body = document.getElementById('catSummaryBody');
  const sums = {};
  ids.forEach(id => {
    const it = items[id];
    const catId = categoryOf(it.category).id;
    const val = catSummaryMode === 'year' ? yearlyEquivalent(it) : monthlyEquivalent(it);
    sums[catId] = (sums[catId] || 0) + val;
  });
  const total = Object.values(sums).reduce((a,b) => a+b, 0);
  const rows = Object.keys(sums)
    .map(catId => ({ cat: categoryOf(catId), amount: sums[catId] }))
    .sort((a,b) => b.amount - a.amount);

  if(rows.length === 0){
    body.innerHTML = '<div class="cat-row" style="color:var(--ink-soft); font-size:12px;">データがありません</div>';
    return;
  }

  body.innerHTML = rows.map(r => {
    const pct = total > 0 ? Math.round((r.amount / total) * 100) : 0;
    return `
      <div class="cat-row">
        <div class="cat-row-top">
          <span class="cat-row-name"><span class="cat-dot" style="background:${esc(r.cat.color)}"></span>${esc(r.cat.label)}</span>
          <span><span class="cat-row-amount">¥${formatYen(r.amount)}</span><span class="cat-row-pct">${pct}%</span></span>
        </div>
        <div class="cat-bar-track">
          <div class="cat-bar-fill" style="width:${pct}%; background:${esc(r.cat.color)};"></div>
        </div>
      </div>
    `;
  }).join('');
}

document.getElementById('catToggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-mode]');
  if(!btn) return;
  catSummaryMode = btn.dataset.mode === 'year' ? 'year' : 'month';
  document.querySelectorAll('#catToggle button').forEach(b => b.classList.toggle('active', b === btn));
  render();
});

document.getElementById('sortSelect').addEventListener('change', render);

// ---------- 更新・解約 ----------
function renewItem(id){
  const it = items[id];
  if(!it) return;
  const base = nextOccurrence(it.nextDate, it.cycle) || (() => { const t = new Date(); t.setHours(0,0,0,0); return t; })();
  const d = new Date(base);
  if(it.cycle === 'year'){
    d.setFullYear(d.getFullYear() + 1);
  }else{
    d.setMonth(d.getMonth() + 1);
  }
  if(!confirm(`「${it.name}」の次回課金日を ${formatDateJP(d)} に更新しますか？`)) return;
  const data = { name: it.name, category: it.category, amount: it.amount, cycle: it.cycle, nextDate: toYMD(d), memo: it.memo || '' };
  Promise.resolve(set(ref(db, 'subscriptions/' + id), data)).catch(handleWriteError);
}

function cancelItem(id){
  const it = items[id];
  if(!it) return;
  if(!confirm(`「${it.name}」を解約として削除しますか？この操作は取り消せません。`)) return;
  Promise.resolve(remove(ref(db, 'subscriptions/' + id))).catch(handleWriteError);
}

// ---------- カテゴリ追加 ----------
catSelect.addEventListener('change', () => {
  if(catSelect.value !== '__add__') return;
  const label = (prompt('新しいカテゴリ名を入力してください（' + LIMIT.catLabel + '文字まで）') || '').trim().slice(0, LIMIT.catLabel);
  if(!label){ renderCategoryOptions('other'); return; }
  const dup = CATEGORIES.find(c => c.label === label);
  if(dup){ renderCategoryOptions(dup.id); return; }
  if(CATEGORIES.length >= LIMIT.categories){
    alert('カテゴリ数の上限に達しました');
    renderCategoryOptions('other');
    return;
  }
  const newCat = { id: newCategoryId(), label, color: nextPaletteColor() };
  CATEGORIES = CATEGORIES.concat(newCat);
  renderCategoryOptions(newCat.id);
  Promise.resolve(saveCategories()).catch(handleWriteError);
});

// ---------- 入力フォーム ----------
const overlay = document.getElementById('overlay');
const openAdd = document.getElementById('openAdd');
const cancelBtn = document.getElementById('cancelBtn');
const saveBtn = document.getElementById('saveBtn');
const deleteBtn = document.getElementById('deleteBtn');
const deleteRow = document.getElementById('deleteRow');
const cycleMonth = document.getElementById('cycleMonth');
const cycleYear = document.getElementById('cycleYear');
let currentCycle = 'month';

function resetForm(){
  document.getElementById('editId').value = '';
  document.getElementById('fName').value = '';
  renderCategoryOptions('other');
  document.getElementById('fAmount').value = '';
  document.getElementById('fDate').value = '';
  document.getElementById('fMemo').value = '';
  currentCycle = 'month';
  cycleMonth.classList.add('active');
  cycleYear.classList.remove('active');
  deleteRow.style.display = 'none';
  document.getElementById('modalTitle').textContent = 'サブスクを追加';
}

function openEdit(id){
  const it = items[id];
  if(!it) return;
  document.getElementById('editId').value = id;
  document.getElementById('fName').value = it.name;
  renderCategoryOptions(it.category || 'other');
  document.getElementById('fAmount').value = it.amount;
  document.getElementById('fDate').value = it.nextDate || '';
  document.getElementById('fMemo').value = it.memo || '';
  currentCycle = it.cycle;
  if(currentCycle === 'year'){
    cycleYear.classList.add('active');
    cycleMonth.classList.remove('active');
  }else{
    cycleMonth.classList.add('active');
    cycleYear.classList.remove('active');
  }
  deleteRow.style.display = 'flex';
  document.getElementById('modalTitle').textContent = 'サブスクを編集';
  overlay.classList.add('open');
}

openAdd.addEventListener('click', () => {
  resetForm();
  overlay.classList.add('open');
});
cancelBtn.addEventListener('click', () => overlay.classList.remove('open'));
overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.classList.remove('open'); });

cycleMonth.addEventListener('click', () => {
  currentCycle = 'month';
  cycleMonth.classList.add('active');
  cycleYear.classList.remove('active');
});
cycleYear.addEventListener('click', () => {
  currentCycle = 'year';
  cycleYear.classList.add('active');
  cycleMonth.classList.remove('active');
});

saveBtn.addEventListener('click', () => {
  const name = document.getElementById('fName').value.trim();
  const category = catSelect.value === '__add__' ? 'other' : catSelect.value;
  const amount = parseFloat(document.getElementById('fAmount').value);
  const nextDate = document.getElementById('fDate').value;
  const memo = document.getElementById('fMemo').value.trim();
  const editId = document.getElementById('editId').value;

  if(!name){ alert('サービス名を入力してください'); return; }
  if(name.length > LIMIT.name){ alert('サービス名は' + LIMIT.name + '文字以内で入力してください'); return; }
  if(!Number.isFinite(amount) || amount < 0 || amount > LIMIT.amountMax){ alert('金額を正しく入力してください（0〜10億円）'); return; }
  if(nextDate && !parseYMD(nextDate)){ alert('次回課金日が正しくありません（2000〜2100年）'); return; }
  if(memo.length > LIMIT.memo){ alert('メモは' + LIMIT.memo + '文字以内で入力してください'); return; }
  if(editId && !ID_RE.test(editId)){ alert('編集対象が正しくありません'); return; }

  const data = sanitizeItem({ name, category, amount, cycle: currentCycle, nextDate, memo });
  if(!data){ alert('入力内容を確認してください'); return; }

  const p = editId ? set(ref(db, 'subscriptions/' + editId), data) : push(subsRef, data);
  Promise.resolve(p).catch(handleWriteError);
  overlay.classList.remove('open');
});

deleteBtn.addEventListener('click', () => {
  const editId = document.getElementById('editId').value;
  if(!editId || !ID_RE.test(editId)) return;
  if(!confirm('この登録を削除しますか？')) return;
  Promise.resolve(remove(ref(db, 'subscriptions/' + editId))).catch(handleWriteError);
  overlay.classList.remove('open');
});

// ---------- バックアップの保存・復元 ----------
document.getElementById('backupBtn').addEventListener('click', () => {
  const backup = {
    exportedAt: new Date().toISOString(),
    appVersion: APP_VERSION,
    categories: CATEGORIES,
    subscriptions: items
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `teiki-cost-backup-${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

const restoreFile = document.getElementById('restoreFile');
document.getElementById('restoreBtn').addEventListener('click', () => {
  restoreFile.value = '';
  restoreFile.click();
});

restoreFile.addEventListener('change', () => {
  const file = restoreFile.files[0];
  if(!file) return;
  if(file.size > LIMIT.backupBytes){
    alert('バックアップファイルが大きすぎます（2MBまで）。');
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    let backup;
    try{
      backup = JSON.parse(reader.result);
    }catch(e){
      alert('バックアップファイルの読み込みに失敗しました。ファイル形式を確認してください。');
      return;
    }
    if(!isPlainObject(backup) || backup.subscriptions === null || typeof backup.subscriptions !== 'object'){
      alert('バックアップファイルの形式が正しくありません。');
      return;
    }
    const newItems = sanitizeItems(backup.subscriptions);
    const count = Object.keys(newItems).length;
    const dropped = Object.keys(backup.subscriptions).length - count;
    if(count === 0){
      alert('バックアップに有効なデータがありません。復元を中止しました。');
      return;
    }
    const newCategories = sanitizeCategories(backup.categories) || DEFAULT_CATEGORIES.slice();
    const t = new Date(backup.exportedAt);
    const exportedLabel = isNaN(t.getTime()) ? '不明な日時' : t.toLocaleString('ja-JP');
    const droppedNote = dropped > 0 ? `（形式が不正な${dropped}件は除外します）` : '';
    if(!confirm(`${exportedLabel} 時点のバックアップ（${count}件）${droppedNote}を復元します。\n現在のデータはすべて上書きされます。よろしいですか？`)) return;

    Promise.all([set(subsRef, newItems), saveCategories(newCategories)])
      .then(() => alert('バックアップを復元しました。'))
      .catch(handleWriteError);
  };
  reader.readAsText(file);
});

// ---------- 起動：サインイン状態に応じて同期を開始/停止 ----------
renderCategoryOptions();
render();

if(auth){
  onAuthStateChanged(auth, (user) => {
    document.body.classList.remove('booting');
    if(user){
      document.body.classList.remove('locked');
      startSync(user.uid);
    }else{
      document.body.classList.add('locked');
      stopSync();
      setSyncStatus(false, 'サインインしていません');
    }
  });
}else{
  document.body.classList.remove('booting');
  loginError.textContent = 'Firebaseの初期化に失敗しました。ページを再読み込みしてください。';
}
</script>
</body>
