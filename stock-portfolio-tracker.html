<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>銘柄別評価損益</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.3/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0f1115;
    --card:#181b22;
    --card2:#1f2330;
    --border:#2a2f3a;
    --text:#e8eaf0;
    --sub:#8890a0;
    --accent:#4f8cff;
    --green:#3ecf8e;
    --red:#ff5c5c;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 16px) 0;}
  header{padding:16px 16px 8px;position:sticky;top:0;background:var(--bg);z-index:5;
    border-bottom:1px solid var(--border);}
  header .title-row{display:flex;align-items:center;justify-content:space-between;}
  h1{font-size:18px;margin:0;font-weight:700;}
  .ver{font-size:11px;color:var(--sub);}
  .summary{display:flex;gap:10px;margin-top:10px;overflow-x:auto;padding-bottom:2px;}
  .sum-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:10px 14px;min-width:110px;flex:1;}
  .sum-card .label{font-size:11px;color:var(--sub);}
  .sum-card .value{font-size:16px;font-weight:700;margin-top:2px;}
  main{padding:12px 16px 90px;}
  .sync-status{font-size:11px;color:var(--sub);text-align:right;margin:4px 2px 8px;}
  .sync-status.ok::before{content:"● ";color:var(--green);}
  .sync-status.err::before{content:"● ";color:var(--red);}
  .holding{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px 14px;margin-bottom:10px;}
  .h-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .h-name{font-weight:700;font-size:15px;color:var(--accent);text-decoration:none;cursor:pointer;}
  .h-code{font-size:11px;color:var(--sub);margin-top:2px;}
  .h-nisa{display:inline-block;font-size:10px;background:#2a4030;color:var(--green);
    border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle;}
  .h-right{text-align:right;}
  .h-price{font-size:13px;color:var(--sub);}
  .h-value{font-size:16px;font-weight:700;}
  .h-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:10px;
    font-size:12px;color:var(--sub);border-top:1px dashed var(--border);padding-top:8px;}
  .h-grid b{color:var(--text);font-weight:600;}
  .h-profit{font-weight:700;}
  .pos{color:var(--green);}
  .neg{color:var(--red);}
  .h-actions{display:flex;gap:8px;margin-top:10px;}
  .h-actions button{flex:1;background:var(--card2);border:1px solid var(--border);color:var(--sub);
    padding:7px;border-radius:8px;font-size:12px;}
  .h-actions button.del{color:var(--red);}
  .empty{text-align:center;color:var(--sub);font-size:13px;padding:40px 20px;}
  .fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 18px);
    width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;
    font-size:28px;border:none;box-shadow:0 6px 16px rgba(79,140,255,.4);z-index:10;
    display:flex;align-items:center;justify-content:center;}
  .refresh-btn{background:var(--card2);border:1px solid var(--border);color:var(--text);
    font-size:12px;padding:6px 10px;border-radius:8px;}
  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none;
    align-items:flex-end;justify-content:center;}
  .overlay.show{display:flex;}
  .sheet{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;
    padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:88vh;overflow-y:auto;}
  .sheet h2{margin:0 0 14px;font-size:16px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px;}
  .field input, .field select{width:100%;background:var(--card2);border:1px solid var(--border);
    color:var(--text);padding:10px 12px;border-radius:10px;font-size:15px;}
  .field .hint{font-size:11px;color:var(--sub);margin-top:4px;}
  .btn-row{display:flex;gap:10px;margin-top:16px;}
  .btn-row button{flex:1;padding:12px;border-radius:10px;border:none;font-size:14px;font-weight:600;}
  .btn-cancel{background:var(--card2);color:var(--sub);}
  .btn-save{background:var(--accent);color:#fff;}
  .chart-wrap{background:var(--card2);border-radius:10px;padding:10px;margin-top:6px;}
  .range-tabs{display:flex;gap:6px;margin-top:10px;}
  .range-tabs button{flex:1;background:var(--card2);border:1px solid var(--border);
    color:var(--sub);padding:6px;border-radius:8px;font-size:12px;}
  .range-tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .close-x{position:absolute;right:16px;top:14px;font-size:20px;color:var(--sub);background:none;border:none;}
  .sheet-head{position:relative;}
  .loading-line{font-size:11px;color:var(--sub);text-align:center;padding:6px;}
</style>
</head>
<body>

<header>
  <div class="title-row">
    <h1>銘柄別評価損益 <span class="ver">Ver1.0</span></h1>
    <button class="refresh-btn" id="refreshAllBtn">株価更新</button>
  </div>
  <div class="summary">
    <div class="sum-card"><div class="label">評価額合計</div><div class="value" id="sumValue">-</div></div>
    <div class="sum-card"><div class="label">取得額合計</div><div class="value" id="sumCost">-</div></div>
    <div class="sum-card"><div class="label">評価損益</div><div class="value" id="sumProfit">-</div></div>
  </div>
</header>

<main>
  <div class="sync-status" id="syncStatus">同期状態を確認中...</div>
  <div id="list"></div>
  <div class="empty" id="emptyMsg" style="display:none;">銘柄が登録されていません。右下の + から追加してください。</div>
</main>

<button class="fab" id="addBtn">＋</button>

<!-- 登録/編集シート -->
<div class="overlay" id="editOverlay">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="editTitle">銘柄を登録</h2>
      <button class="close-x" id="editClose">✕</button>
    </div>
    <div class="field">
      <label>銘柄コード（例: 7203）</label>
      <input type="text" id="inCode" inputmode="numeric" placeholder="7203">
      <div class="hint">日本株の証券コードを入力してください</div>
    </div>
    <div class="field">
      <label>取得日</label>
      <input type="date" id="inDate">
    </div>
    <div class="field">
      <label>取得株数</label>
      <input type="number" id="inShares" inputmode="numeric" placeholder="100">
    </div>
    <div class="field">
      <label>取得単価（円）</label>
      <input type="number" id="inPrice" inputmode="decimal" placeholder="2500">
    </div>
    <div class="field">
      <label>NISA区分</label>
      <select id="inNisa">
        <option value="no">NISAではない（課税口座）</option>
        <option value="yes">NISA口座</option>
      </select>
    </div>
    <div class="btn-row">
      <button class="btn-cancel" id="editCancel">キャンセル</button>
      <button class="btn-save" id="editSave">保存</button>
    </div>
  </div>
</div>

<!-- グラフシート -->
<div class="overlay" id="chartOverlay">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="chartTitle">株価推移</h2>
      <button class="close-x" id="chartClose">✕</button>
    </div>
    <div class="range-tabs">
      <button data-range="1m" class="active">1ヶ月</button>
      <button data-range="3m">3ヶ月</button>
      <button data-range="6m">6ヶ月</button>
      <button data-range="1y">1年</button>
      <button data-range="all">全期間</button>
    </div>
    <div class="chart-wrap">
      <div class="loading-line" id="chartLoading">読み込み中...</div>
      <canvas id="priceChart" height="220"></canvas>
    </div>
  </div>
</div>

<script>
/* ===================== Firebase 設定 =====================
  「株評価損益」アプリと同じFirebaseプロジェクトの config をここに設定してください。
  例:
  const firebaseConfig = {
    apiKey: "xxxx",
    authDomain: "xxxx.firebaseapp.com",
    databaseURL: "https://xxxx-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "xxxx",
    storageBucket: "xxxx.appspot.com",
    messagingSenderId: "xxxx",
    appId: "xxxx"
  };
============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBUQjfeamTm1gCWNiXhZcxyBIUiQSptvDs",
  authDomain: "asset-tracker-b3fac.firebaseapp.com",
  databaseURL: "https://asset-tracker-b3fac-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "asset-tracker-b3fac",
  storageBucket: "asset-tracker-b3fac.firebasestorage.app",
  messagingSenderId: "36181399487",
  appId: "1:36181399487:web:0ef48412b814d81aaa330a"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
// 既存アプリ(dailyTotal等)と衝突しないよう専用ノードを使用
const holdingsRef = db.ref('stockPortfolio/holdings');
const priceCacheRef = db.ref('stockPortfolio/priceCache');

let holdings = {};      // id -> {code,date,shares,price,nisa}
let priceCache = {};    // code -> {name, price, updatedAt}
let editingId = null;
let currentChartCode = null;
let currentChartRange = '1m';
let priceChart = null;

const yen = n => (n===null||n===undefined||isNaN(n)) ? '-' : '¥' + Math.round(n).toLocaleString('ja-JP');
const setStatus = (ok, msg) => {
  const el = document.getElementById('syncStatus');
  el.className = 'sync-status ' + (ok ? 'ok' : 'err');
  el.textContent = msg;
};

/* ---------- Firebase 同期 ---------- */
holdingsRef.on('value', snap => {
  holdings = snap.val() || {};
  render();
  setStatus(true, '同期済み（iPhone / iPad 共通）');
}, err => {
  setStatus(false, '同期エラー: ' + err.message);
});

priceCacheRef.on('value', snap => {
  priceCache = snap.val() || {};
  render();
});

/* ---------- stooq から株価取得 ----------
  現在値・銘柄名: https://stooq.com/q/l/?s=CODE.jp&f=snd2t2ohlcv&e=csv
  日足履歴      : https://stooq.com/q/d/l/?s=CODE.jp&i=d
------------------------------------------- */
async function fetchQuote(code){
  const url = `https://stooq.com/q/l/?s=${code}.jp&f=snd2t2ohlcv&e=csv`;
  const res = await fetch(url);
  const text = await res.text();
  const lines = text.trim().split('\n');
  if(lines.length < 2) throw new Error('no data');
  const cols = lines[1].split(',');
  // Symbol,Name,Date,Time,Open,High,Low,Close,Volume
  const name = cols[1] && cols[1] !== 'N/D' ? cols[1] : code;
  const close = parseFloat(cols[7]);
  return { name, price: isNaN(close) ? null : close };
}

async function fetchHistory(code){
  const url = `https://stooq.com/q/d/l/?s=${code}.jp&i=d`;
  const res = await fetch(url);
  const text = await res.text();
  const lines = text.trim().split('\n');
  const rows = [];
  for(let i=1;i<lines.length;i++){
    const c = lines[i].split(',');
    if(c.length < 5) continue;
    rows.push({ date: c[0], close: parseFloat(c[4]) });
  }
  return rows;
}

async function refreshAllPrices(){
  const codes = [...new Set(Object.values(holdings).map(h => h.code))];
  setStatus(true, '株価を更新中...');
  for(const code of codes){
    try{
      const q = await fetchQuote(code);
      await priceCacheRef.child(code).set({ name: q.name, price: q.price, updatedAt: Date.now() });
    }catch(e){
      console.error('quote fetch failed', code, e);
    }
  }
  setStatus(true, '同期済み（iPhone / iPad 共通）');
}

/* ---------- 集計・描画 ---------- */
function render(){
  const list = document.getElementById('list');
  const ids = Object.keys(holdings);
  document.getElementById('emptyMsg').style.display = ids.length ? 'none' : 'block';

  // 銘柄コードごとに集約（同一銘柄の複数取得もまとめて表示）
  const byCode = {};
  ids.forEach(id => {
    const h = holdings[id];
    if(!byCode[h.code]) byCode[h.code] = [];
    byCode[h.code].push({ id, ...h });
  });

  let totalValue = 0, totalCost = 0;
  list.innerHTML = '';

  Object.keys(byCode).sort().forEach(code => {
    const lots = byCode[code];
    const cache = priceCache[code] || {};
    const curPrice = cache.price;
    const name = cache.name || code;
    const shares = lots.reduce((s,l)=>s+Number(l.shares),0);
    const cost = lots.reduce((s,l)=>s+Number(l.shares)*Number(l.price),0);
    const value = curPrice!==null && curPrice!==undefined ? curPrice*shares : null;
    const profit = value!==null ? value - cost : null;
    if(value!==null) totalValue += value;
    totalCost += cost;

    const div = document.createElement('div');
    div.className = 'holding';
    const nisaAny = lots.some(l=>l.nisa==='yes');
    div.innerHTML = `
      <div class="h-top">
        <div>
          <a class="h-name" data-code="${code}">${name}${nisaAny?'<span class="h-nisa">NISA</span>':''}</a>
          <div class="h-code">${code}</div>
        </div>
        <div class="h-right">
          <div class="h-price">${curPrice!==null&&curPrice!==undefined ? yen(curPrice)+' /株' : '取得中'}</div>
          <div class="h-value">${yen(value)}</div>
        </div>
      </div>
      <div class="h-grid">
        <div>株数 <b>${shares.toLocaleString('ja-JP')}</b></div>
        <div>利益額 <b class="h-profit ${profit>0?'pos':profit<0?'neg':''}">${profit===null?'-':(profit>=0?'+':'')+yen(profit)}</b></div>
      </div>
      <div class="h-actions">
        <button class="editL" data-code="${code}">明細を編集</button>
        <button class="del" data-code="${code}">削除</button>
      </div>
    `;
    list.appendChild(div);
  });

  document.getElementById('sumValue').textContent = yen(totalValue);
  document.getElementById('sumCost').textContent = yen(totalCost);
  const sp = document.getElementById('sumProfit');
  const totalProfit = totalValue - totalCost;
  sp.textContent = (totalProfit>=0?'+':'') + yen(totalProfit);
  sp.className = 'value ' + (totalProfit>0?'pos':totalProfit<0?'neg':'');

  // イベント付与
  list.querySelectorAll('.h-name').forEach(el=>{
    el.onclick = () => openChart(el.dataset.code);
  });
  list.querySelectorAll('.editL').forEach(el=>{
    el.onclick = () => openLotsEditor(el.dataset.code);
  });
  list.querySelectorAll('.del').forEach(el=>{
    el.onclick = () => deleteCode(el.dataset.code);
  });
}

function deleteCode(code){
  if(!confirm(code + ' の登録内容をすべて削除しますか？')) return;
  const updates = {};
  Object.keys(holdings).forEach(id=>{
    if(holdings[id].code === code) updates[id] = null;
  });
  holdingsRef.update(updates);
}

function openLotsEditor(code){
  // 複数取得ロットがある場合は、最初の1件を編集対象として開く簡易対応
  const id = Object.keys(holdings).find(id => holdings[id].code === code);
  if(id) openEdit(id);
}

/* ---------- 登録/編集シート ---------- */
const editOverlay = document.getElementById('editOverlay');
document.getElementById('addBtn').onclick = () => openEdit(null);
document.getElementById('editClose').onclick = closeEdit;
document.getElementById('editCancel').onclick = closeEdit;

function openEdit(id){
  editingId = id;
  document.getElementById('editTitle').textContent = id ? '銘柄を編集' : '銘柄を登録';
  if(id){
    const h = holdings[id];
    document.getElementById('inCode').value = h.code;
    document.getElementById('inDate').value = h.date;
    document.getElementById('inShares').value = h.shares;
    document.getElementById('inPrice').value = h.price;
    document.getElementById('inNisa').value = h.nisa || 'no';
  } else {
    document.getElementById('inCode').value = '';
    document.getElementById('inDate').value = new Date().toISOString().slice(0,10);
    document.getElementById('inShares').value = '';
    document.getElementById('inPrice').value = '';
    document.getElementById('inNisa').value = 'no';
  }
  editOverlay.classList.add('show');
}
function closeEdit(){ editOverlay.classList.remove('show'); editingId = null; }

document.getElementById('editSave').onclick = async () => {
  const code = document.getElementById('inCode').value.trim();
  const date = document.getElementById('inDate').value;
  const shares = document.getElementById('inShares').value;
  const price = document.getElementById('inPrice').value;
  const nisa = document.getElementById('inNisa').value;
  if(!code || !date || !shares || !price){
    alert('すべての項目を入力してください'); return;
  }
  const data = { code, date, shares: Number(shares), price: Number(price), nisa };
  if(editingId){
    await holdingsRef.child(editingId).set(data);
  } else {
    await holdingsRef.push(data);
  }
  closeEdit();
  // 新規銘柄なら価格取得
  try{
    const q = await fetchQuote(code);
    await priceCacheRef.child(code).set({ name: q.name, price: q.price, updatedAt: Date.now() });
  }catch(e){ console.error(e); }
};

/* ---------- グラフシート ---------- */
const chartOverlay = document.getElementById('chartOverlay');
document.getElementById('chartClose').onclick = () => chartOverlay.classList.remove('show');
document.querySelectorAll('.range-tabs button').forEach(btn=>{
  btn.onclick = () => {
    document.querySelectorAll('.range-tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentChartRange = btn.dataset.range;
    drawChartForCurrentCode();
  };
});

async function openChart(code){
  currentChartCode = code;
  currentChartRange = '1m';
  document.querySelectorAll('.range-tabs button').forEach(b=>b.classList.remove('active'));
  document.querySelector('.range-tabs button[data-range="1m"]').classList.add('active');
  const cache = priceCache[code] || {};
  document.getElementById('chartTitle').textContent = (cache.name || code) + ' (' + code + ')';
  chartOverlay.classList.add('show');
  document.getElementById('chartLoading').style.display = 'block';
  try{
    const rows = await fetchHistory(code);
    window.__histCache = window.__histCache || {};
    window.__histCache[code] = rows;
    drawChartForCurrentCode();
  }catch(e){
    document.getElementById('chartLoading').textContent = '取得に失敗しました';
  }
}

function drawChartForCurrentCode(){
  const rows = (window.__histCache && window.__histCache[currentChartCode]) || [];
  if(!rows.length) return;
  const now = new Date();
  let fromDate = null;
  if(currentChartRange==='1m') fromDate = new Date(now.getFullYear(), now.getMonth()-1, now.getDate());
  else if(currentChartRange==='3m') fromDate = new Date(now.getFullYear(), now.getMonth()-3, now.getDate());
  else if(currentChartRange==='6m') fromDate = new Date(now.getFullYear(), now.getMonth()-6, now.getDate());
  else if(currentChartRange==='1y') fromDate = new Date(now.getFullYear()-1, now.getMonth(), now.getDate());

  const filtered = fromDate ? rows.filter(r => new Date(r.date) >= fromDate) : rows;
  document.getElementById('chartLoading').style.display = 'none';

  const ctx = document.getElementById('priceChart').getContext('2d');
  if(priceChart) priceChart.destroy();
  priceChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: filtered.map(r=>r.date),
      datasets: [{
        label: '評価単価',
        data: filtered.map(r=>r.close),
        borderColor: '#4f8cff',
        backgroundColor: 'rgba(79,140,255,0.15)',
        fill: true,
        pointRadius: 0,
        borderWidth: 2,
        tension: 0.15
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color:'#8890a0', maxTicksLimit:6 }, grid:{ color:'#2a2f3a' } },
        y: { ticks: { color:'#8890a0' }, grid:{ color:'#2a2f3a' } }
      }
    }
  });
}

document.getElementById('refreshAllBtn').onclick = refreshAllPrices;

// 初回ロード後に自動で1回価格更新
setTimeout(()=>{ if(Object.keys(holdings).length) refreshAllPrices(); }, 1500);
</script>
</body>
</html>
