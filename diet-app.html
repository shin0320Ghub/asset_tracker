<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="からだノート">
<meta name="theme-color" content="#0B121B">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>からだノート</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Sans:opsz,wght@9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B121B; --card:#131D29; --card2:#0E1722; --line:#223246; --ink:#EDF2F7; --sub:#94A5B8; --dim:#62748A;
  --soft:rgba(255,255,255,.05); --pine:#3CC9A6; --leaf:#3CC9A6; --leaf2:#3ECF8E;
  --b:#F2C14E; --l:#7AA7FF; --d:#B48CFF; --s:#FF8A6B; --warn:#FF6B6B; --pos:#3ECF8E;
  --num:"DM Sans","Zen Kaku Gothic New",sans-serif;
  color-scheme:dark;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(900px 520px at 0% -10%,#15263A 0%,transparent 60%),radial-gradient(700px 420px at 110% 8%,#2A1E14 0%,transparent 55%),var(--bg);background-attachment:fixed;
  color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em;font-weight:700}
.app{max-width:560px;margin:0 auto;padding:16px 16px 120px}
svg.i{width:22px;height:22px;flex:none}

/* ヘッダー */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 16px}
.brand{font-weight:700;font-size:21px;letter-spacing:.02em;display:flex;align-items:center;gap:10px;white-space:nowrap;min-width:0}
@media (max-width:400px){.top .brand{font-size:18px}.top .brand .bi{width:34px;height:34px}}
.brand .bi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--leaf) 18%,transparent);color:var(--leaf)}
.datenav{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px}
.datenav button{width:32px;height:32px;border-radius:50%;font-size:18px;color:var(--sub)}
.datenav button:active{background:var(--soft)}
.datenav .d{font-weight:700;font-size:14px;min-width:100px;text-align:center;cursor:pointer}

/* カード共通(ダッシュボード準拠) */
.card,.plate,.meal,.stat,.mini,.goal-hero,.wchip,.pfc{
  --c:var(--leaf);position:relative;overflow:hidden;
  background:linear-gradient(180deg,#16212F 0%,#121B26 100%);border:1px solid var(--line);border-radius:22px}
.card::before,.plate::before,.meal::before,.goal-hero::before,.mini::before,.wchip::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--c),transparent 85%)}
.plate::after,.goal-hero::after,.meal::after{content:"";position:absolute;width:240px;height:240px;right:-120px;top:-140px;border-radius:50%;background:var(--c);opacity:.08;filter:blur(20px);pointer-events:none}
.card{padding:18px}
.card+.card{margin-top:12px}
.muted{color:var(--sub);font-size:13px}
.h2{font-size:15px;font-weight:500;color:var(--sub);margin:22px 4px 8px}

/* 食事:お皿 */
.plate{padding:22px 18px 18px;display:grid;grid-template-columns:170px 1fr;gap:16px;align-items:center}
.plate svg{width:170px;height:170px;display:block}
.plate .center{position:absolute;left:18px;top:22px;width:170px;height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.center .big{font-size:36px;line-height:1}
.center .unit{font-size:12px;color:var(--sub);margin-top:6px}
.side{position:relative;z-index:1}
.side .rem{font-size:13px;color:var(--sub)}
.side .rem b{display:block;font-size:30px;color:var(--ink);line-height:1.15}
.side .rem.over b{color:var(--warn)}
.legend{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:5px;font-size:13.5px}
.legend li{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{margin-left:auto;font-family:var(--num);font-variant-numeric:tabular-nums;color:var(--sub)}

.pfc{padding:14px 16px;margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;border-radius:18px}
.pfc .lab{font-size:12.5px;color:var(--sub);display:flex;justify-content:space-between}
.pfc .v{font-size:19px}
.bar{height:8px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;border-radius:999px;transition:width .6s}

.tip{display:flex;gap:12px;align-items:flex-start;margin-top:12px;padding:14px 16px;border-radius:14px;background:rgba(60,201,166,.09);border:1px solid rgba(60,201,166,.22);font-size:14px}
.tip .face{flex:none;width:36px;height:36px;border-radius:12px;background:color-mix(in srgb,var(--leaf) 18%,transparent);color:var(--leaf);display:grid;place-items:center}
.tip b{display:block;font-size:12.5px;color:var(--leaf);font-weight:700}

.meal{margin-top:12px;border-radius:20px}
.meal-h{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:14px 14px 12px 16px}
.meal-h .ic,.mini .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.meal-h .t{font-weight:700;font-size:17px}
.meal-h .k{font-size:13px;color:var(--sub)}
.add{margin-left:auto;height:38px;padding:0 16px 0 12px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:4px}
.add svg{width:18px;height:18px}
.add:active{transform:scale(.96)}
.items{position:relative;z-index:1;list-style:none;margin:0;padding:0 12px 10px}
.items li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.035);margin-top:6px;cursor:pointer}
.items .n{flex:1;min-width:0}
.items .n div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.items .n small{color:var(--sub);font-size:12px}
.items .kc{font-family:var(--num);font-weight:700}
.items li.new{box-shadow:inset 0 0 0 1.5px var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);transition:background .6s,box-shadow .6s}
.seg button small{font-family:var(--num);font-size:11px;margin-left:3px}
.btn:disabled{cursor:default;opacity:.45}
.empty-line{position:relative;color:var(--dim);font-size:13px;padding:0 16px 14px}

.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.mini{padding:12px;text-align:left;border-radius:18px}
.mini .ic{width:32px;height:32px;border-radius:10px;margin-bottom:6px}
.mini .ic svg{width:18px;height:18px}
.mini .l{font-size:12.5px;color:var(--sub)}
.mini .v{font-size:20px;line-height:1.3;white-space:nowrap}
.mini .v small{font-size:11px;font-weight:500;color:var(--sub)}
.mini .s{font-size:11px;color:var(--c)}

.wchip{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:12px;padding:14px 16px;text-align:left;border-radius:18px}
.wchip .lbl{font-size:13px;color:var(--sub)}
.wchip .val{font-size:24px}

/* 入力 */
.winput{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0 14px}
.winput button{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--card2);font-size:22px}
.winput input{width:150px;text-align:center;font-family:var(--num);font-size:42px;font-weight:700;border:0;background:transparent;font-variant-numeric:tabular-nums}
.winput .u{font-size:14px;color:var(--sub);margin-left:-8px}
.bpin{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.bpin label{text-align:center;font-size:12.5px;color:var(--sub)}
.bpin input{width:100%;height:60px;border-radius:14px;border:1px solid var(--line);background:var(--card2);text-align:center;font-family:var(--num);font-size:26px;font-weight:700;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:50px;padding:0 20px;border-radius:999px;background:linear-gradient(90deg,var(--leaf),var(--l));color:#0B121B;font-weight:700;width:100%;font-size:16px}
.btn.sub{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink)}
.btn.warn{background:transparent;color:var(--warn);border:1px solid rgba(255,107,107,.5)}
.btn:active{filter:brightness(.92)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.035)}
.stat .l{font-size:12.5px;color:var(--sub)}
.stat .v{font-size:21px}
.up{color:var(--warn)} .down{color:var(--pos)}

.chips{display:inline-flex;gap:2px;max-width:100%;overflow-x:auto;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;padding:3px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:5px 14px;border-radius:999px;font-size:13.5px;color:var(--sub)}
.chip.on{background:var(--c,var(--leaf));color:#0B121B;font-weight:700}
.wchip .chip.on{background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.chart{width:100%;height:auto;display:block;margin-top:10px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;padding:10px 12px;gap:10px;border-radius:12px;background:rgba(255,255,255,.035);margin-top:6px}
.list li:first-child{margin-top:0}
.tap{cursor:pointer}.tap:active,.items li:active{background:rgba(255,255,255,.08)}
.ed{color:var(--dim);display:grid;place-items:center}.ed svg{width:16px;height:16px}
.x{color:var(--dim);font-size:18px;width:32px;height:32px;border-radius:50%}

/* 目標 */
.goal-hero{padding:20px;border-radius:22px}
.goal-hero>*{position:relative;z-index:1}
.goal-hero .m{font-size:14px;color:var(--sub)}
.goal-hero .g{font-size:44px;line-height:1.1}
.goal-hero .g small{font-size:18px;font-weight:500;color:var(--sub)}
.track{position:relative;height:14px;border-radius:999px;background:rgba(255,255,255,.06);margin:16px 0 8px;overflow:hidden}
.track>i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--leaf),var(--pos))}
.goal-hero .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--sub)}
.goal-hero .btn{margin-top:14px;background:color-mix(in srgb,var(--leaf) 16%,transparent);color:var(--leaf)}
.badge{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px}
.badge.ok{background:rgba(62,207,142,.12);color:var(--pos)}
.badge.ng{background:rgba(255,107,107,.12);color:var(--warn)}
.badge.wait{background:rgba(255,255,255,.08);color:var(--sub)}
.warnbox{background:rgba(255,107,107,.12);color:#FF9A9A;border-radius:14px;padding:11px 14px;font-size:13.5px;margin-top:12px;font-weight:500}

/* フォーム */
label.f{display:block;margin-top:12px;font-size:13px;color:var(--sub)}
.field{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card2);padding:0 12px;font-size:16px;margin-top:4px}
textarea.field{height:auto;min-height:84px;padding:10px 12px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.seg{display:flex;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;padding:3px;margin-top:4px}
.seg button{flex:1;min-width:0;white-space:nowrap;height:38px;border-radius:999px;font-size:14px;color:var(--sub);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button svg{width:17px;height:17px}
.seg button.on{background:var(--leaf);color:#0B121B;font-weight:700}

/* ナビ */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(11,18,27,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;color:var(--dim);border-radius:12px}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--leaf);font-weight:700}

/* シート */
.back{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.back.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:#101924;border:1px solid var(--line);border-bottom:0;border-top:3px solid var(--leaf);border-radius:24px 24px 0 0;max-height:88vh;max-height:88dvh;overflow-y:auto;padding:4px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 12px}
.sheet h3{margin:0 0 4px;font-size:20px;font-weight:700}
.results{list-style:none;padding:0;margin:10px 0 0}
.results li{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.035);margin-top:6px;cursor:pointer}
.results li:active{background:rgba(255,255,255,.08)}
.results .n{flex:1}
.results small{color:var(--sub)}
.results b{font-family:var(--num)}
.stepper{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0}
.stepper button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card2);font-size:20px}
.stepper input{width:110px;text-align:center;font-family:var(--num);font-size:32px;font-weight:700;border:0;background:transparent}
.calc{display:flex;justify-content:space-around;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0 14px;text-align:center}
.calc .v{font-size:21px}
.calc .l{font-size:12px;color:var(--sub)}
.camrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.cambtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:100px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,#16212F,#121B26);font-weight:700;font-size:14px;position:relative;overflow:hidden;color:var(--ink)}
.cambtn .e{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--l) 18%,transparent);color:var(--l)}
.cambtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.preview{width:100%;max-height:220px;object-fit:cover;border-radius:16px;margin-top:12px;display:block;border:1px solid var(--line)}
.ai-item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.035);margin-top:6px}
.ai-item input[type=checkbox]{width:22px;height:22px;accent-color:var(--leaf)}
.ai-item .g{width:72px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card2);text-align:right;padding:0 8px;font-family:var(--num)}
.loading{display:flex;align-items:center;gap:10px;padding:18px 0;color:var(--sub)}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--leaf);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--leaf);color:#0B121B;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;transition:.25s;z-index:60;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.celebrate{text-align:center;padding:10px 0}
.celebrate .e{font-size:64px;line-height:1.1}
@media (max-width:370px){.plate{grid-template-columns:1fr;justify-items:center}.plate .center{left:50%;margin-left:-85px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="nav"><div class="in" id="nav"></div></nav>
<div class="back" id="back"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script>
/* ========== アイコン ========== */
const SV=(d,cls='i')=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const IC={
 leaf:SV('<path d="M5 19c0-8 5-13 15-14-1 10-6 15-14 15"/><path d="M5 19l7-7"/>'),
 sunrise:SV('<path d="M17 18a5 5 0 0 0-10 0"/><path d="M12 2v6M4.2 10.2l1.4 1.4M2 18h2M20 18h2M18.4 11.6l1.4-1.4M23 22H1M8 6l4-4 4 4"/>'),
 sun:SV('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
 moon:SV('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'),
 cup:SV('<path d="M4 8h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 2v3M12 2v3"/>'),
 plus:SV('<path d="M12 5v14M5 12h14"/>'),
 scale:SV('<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 9a5 5 0 0 1 8 0"/><path d="M12 9l1.5-2"/>'),
 steps:SV('<path d="M7 16c-1.5 0-3-1.2-3-4s1-6 3-6 3 2.5 3 5-1.5 5-3 5z"/><path d="M4.5 18.5h5"/><path d="M17 12c-1.5 0-3-1.2-3-4s1-5 3-5 3 2.5 3 5-1.5 4-3 4z"/><path d="M14.5 14.5h5"/>'),
 heart:SV('<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/><path d="M3 12h4l2-3 3 6 2-3h7"/>'),
 meal:SV('<path d="M3 2v7a3 3 0 0 0 6 0V2M6 2v20"/><path d="M18 2c-2 0-3 3-3 7h3v13"/>'),

const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY=()=>ymd(new Date());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const WD='日月火水木金土';
const fmtDate=s=>{const d=parse(s);return `${d.getMonth()+1}月${d.getDate()}日(${WD[d.getDay()]})`};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1=n=>Math.round(n*10)/10;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function wKeys(){return Object.keys(S.weights).sort()}
function latestWeight(upto){const k=wKeys().filter(x=>x<=upto);return k.length?S.weights[k[k.length-1]]:null}
function calc(){
  const p=S.profile, w=latestWeight(cur), h=+p.height, a=+p.age;
  let bmr=null,tdee=null,rec=null;
  if(w&&h&&a&&p.sex){
    bmr=10*w+6.25*h-5*a+(p.sex==='male'?5:-161);
    tdee=bmr*(+p.activity||1.375);
    rec=Math.round(Math.max(tdee-500,bmr,1200)/10)*10;
  }
  const target=+p.manualKcal>0?+p.manualKcal:(rec||1800);
  return {bmr,tdee,rec,target,w};
}
function dayTotals(day){
  const list=S.meals[day]||[];const t={kcal:0,p:0,f:0,c:0,by:{}};
  MEALS.forEach(m=>t.by[m.k]=0);
  list.forEach(i=>{t.kcal+=i.kcal;t.p+=i.p;t.f+=i.f;t.c+=i.c;t.by[i.meal]+=i.kcal});
  return t;
}

/* ========== 今日 ========== */
function plateSVG(t,target){
  const r=64,C=2*Math.PI*r,max=Math.max(target,t.kcal);
  let off=0,segs='';
  MEALS.forEach(m=>{
    const v=t.by[m.k];if(!v)return;
    const len=C*Math.min(v/max,1);
    segs+=`<circle cx="85" cy="85" r="${r}" fill="none" stroke="${m.hex}" stroke-width="16" stroke-dasharray="${Math.max(len-2,0.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 85 85)" stroke-linecap="butt"/>`;
    off+=len;
  });
  const overMark=t.kcal>target?`<circle cx="85" cy="85" r="${r+12}" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="3 5"/>`:'';
  return `<svg viewBox="0 0 170 170" aria-hidden="true">
    <circle cx="85" cy="85" r="80" fill="rgba(255,255,255,.03)" stroke="var(--line)"/>
    <circle cx="85" cy="85" r="${r}" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="16"/>
    ${segs}${overMark}
    <circle cx="85" cy="85" r="50" fill="#121B26" stroke="var(--line)"/>
  </svg>`;
}
function advice(t,c){
  const list=S.meals[cur]||[];
  if(!list.length)return cur===TODAY()?'朝食をとると体温が上がり、1日の代謝が整います。まずは朝ごはんから記録してみましょう。':'この日の記録はまだありません。';
  const pr=t.kcal?t.p*4/t.kcal:0, fr=t.kcal?t.f*9/t.kcal:0;
  if(t.kcal>c.target)return `目標を${Math.round(t.kcal-c.target)}kcal上回っています。次の食事は野菜・汁物から食べ始める「ベジファースト」で、主食を少し控えめにしましょう。`;
  if(t.by.snack>200)return '間食が200kcalを超えています。間食は1日200kcalまでが目安です。ナッツやヨーグルトなど、たんぱく質のあるものを選ぶと満足感が続きます。';
  if(t.kcal>500&&pr<0.13)return 'たんぱく質が少なめです。卵・納豆・鶏むね肉・魚などを1品足すと、筋肉を守りながら減量できます。';
  if(t.kcal>500&&fr>0.30)return '脂質の割合が高めです。揚げ物は「焼く・蒸す・煮る」料理に置きかえると、無理なくカロリーを抑えられます。';
  if(!t.by.breakfast&&cur===TODAY()&&new Date().getHours()>=11)return '朝食がまだのようです。欠食すると昼にドカ食いしやすくなります。明日は簡単なものでも口にしてみましょう。';
  return `残り${Math.max(0,Math.round(c.target-t.kcal))}kcal。PFCバランスは良好です。この調子で続けましょう。`;
}

    </div>
  </section>
  <section class="pfc">
    ${pfc('たんぱく質',t.p,pT,'var(--leaf)')}${pfc('脂質',t.f,fT,'var(--b)')}${pfc('炭水化物',t.c,cT,'var(--l)')}
  </section>
  <div class="tip"><div class="face">${IC.doctor}</div><div><b>管理栄養士より</b>${advice(t,c)}</div></div>
  ${profileHint}
  ${MEALS.map(m=>{
    const list=(S.meals[cur]||[]).filter(i=>i.meal===m.k);

      <div class="meal-h">

        <div><div class="t">${m.n}</div><div class="k num">${Math.round(t.by[m.k])} kcal</div></div>
        <button class="add" onclick="openAdd('${m.k}')" aria-label="${m.n}を追加">${IC.plus}追加</button>
      </div>

    </section>`}).join('')}
  <div class="minis">

function drawCalc(){const k=pick.g/pick.base;$('#pc').innerHTML=[['kcal',pick.kcal],['P',pick.p],['F',pick.f],['C',pick.c]].map(([l,v])=>`<div><div class="v num">${l==='kcal'?Math.round(v*k):r1(v*k)}</div><div class="l">${l==='kcal'?'エネルギー':l==='P'?'たんぱく質':l==='F'?'脂質':'炭水化物'}</div></div>`).join('')}
function pushItem(it){(S.meals[cur]=S.meals[cur]||[]).push(Object.assign({id:uid(),meal:addMeal},it))}
function addPicked(){const k=pick.g/pick.base;pushItem({name:pick.name,grams:Math.round(pick.g),kcal:pick.kcal*k,p:pick.p*k,f:pick.f*k,c:pick.c*k});save();closeSheet();render();toast(`${pick.name}を追加しました`)}

/* ========== 食事のコピー ========== */
let cpDate=null,cpMeal=null,cpSel={},lastCopied=new Set();
function cpInit(){
  // 既定：コピー先と同じ区分で、直近に記録がある日（なければ前日）
  const ks=Object.keys(S.meals).filter(k=>k<cur&&(S.meals[k]||[]).some(i=>i.meal===addMeal)).sort();
  cpDate=ks.length?ks[ks.length-1]:addDays(cur,-1);cpMeal=addMeal;cpReset();
}
function cpItems(){return (S.meals[cpDate]||[]).filter(i=>i.meal===cpMeal)}
function cpReset(){cpSel={};cpItems().forEach(i=>cpSel[i.id]=true)}
function cpPick(d,m){cpDate=d;cpMeal=m;cpReset();drawAdd()}
function cpRecent(){
  const out=[];const ks=Object.keys(S.meals).sort().reverse();
  for(const k of ks){
    for(const m of MEALS){
      if(k===cur&&m.k===addMeal)continue;
      const l=(S.meals[k]||[]).filter(i=>i.meal===m.k);if(!l.length)continue;
      out.push({k,m,l,kcal:l.reduce((a,i)=>a+i.kcal,0)});
      if(out.length>=8)return out;
    }
  }
  return out;
}
function cpBody(){
  const dest=MEALS.find(x=>x.k===addMeal),items=cpItems();
  const cnt=MEALS.map(m=>(S.meals[cpDate]||[]).filter(i=>i.meal===m.k).length);
  const selN=items.filter(i=>cpSel[i.id]).length,selK=items.filter(i=>cpSel[i.id]).reduce((a,i)=>a+i.kcal,0);
  const rec=cpRecent();
  return `<p class="muted" style="margin:10px 0 0">コピー元の日と食事を選ぶと、${fmtDate(cur)}の<b style="color:${dest.hex}">${dest.n}</b>に追加します。</p>
  <label class="f">コピー元の日付
    <input class="field" type="date" max="${TODAY()}" value="${cpDate}" onchange="cpPick(this.value||cpDate,cpMeal)"></label>
  <div class="chips" style="margin-top:8px">${[[-1,'前日'],[-2,'2日前'],[-7,'1週間前']].map(([d,l])=>{const k=addDays(cur,d);return `<button class="chip ${cpDate===k?'on':''}" onclick="cpPick('${k}',cpMeal)">${l}</button>`}).join('')}</div>
  <label class="f">コピー元の食事</label>
  <div class="seg">${MEALS.map((m,i)=>`<button class="${cpMeal===m.k?'on':''}" onclick="cpPick(cpDate,'${m.k}')">${m.n}${cnt[i]?`<small style="opacity:.7">${cnt[i]}</small>`:''}</button>`).join('')}</div>
  ${items.length?`<div style="margin-top:10px">${items.map(i=>`<label class="ai-item" style="grid-template-columns:auto 1fr auto;cursor:pointer">
      <input type="checkbox" ${cpSel[i.id]?'checked':''} onchange="cpSel['${i.id}']=this.checked;drawAdd()">
      <div><div>${esc(i.name)}</div><small class="muted">${i.grams?i.grams+'g ・ ':''}P${r1(i.p)} F${r1(i.f)} C${r1(i.c)}</small></div>
      <b class="num">${Math.round(i.kcal)}</b></label>`).join('')}</div>
    <button class="btn" style="margin-top:14px" ${selN?'':'disabled'} onclick="cpDo()">${selN?`${selN}品（${Math.round(selK)} kcal）を${dest.n}にコピー`:'コピーする料理を選んでください'}</button>
    <p class="muted" style="margin:8px 0 0;text-align:center">コピー後は、各料理をタップして量や内容を訂正できます</p>`
  :`<div class="list" style="margin-top:10px"><div class="muted" style="padding:14px;border-radius:12px;background:rgba(255,255,255,.035)">${fmtDate(cpDate)}の${MEALS.find(x=>x.k===cpMeal).n}は記録がありません。日付か食事を変えるか、下の「最近の記録」から選んでください。</div></div>`}
  ${rec.length?`<div class="h2" style="margin:20px 2px 6px">最近の記録から選ぶ</div>
  <ul class="results" style="margin-top:0">${rec.map(r=>`<li onclick="cpPick('${r.k}','${r.m.k}')" style="${r.k===cpDate&&r.m.k===cpMeal?'box-shadow:inset 3px 0 0 '+r.m.hex:''}">
    <div class="n"><div><span style="color:${r.m.hex};font-weight:700">${r.m.n}</span>　${fmtDate(r.k)}</div><small>${esc(r.l.map(i=>i.name).join('、'))}</small></div>
    <b class="num">${Math.round(r.kcal)}</b><small>kcal</small></li>`).join('')}</ul>`:''}`;
}
function cpDo(){
  const sel=cpItems().filter(i=>cpSel[i.id]);if(!sel.length){toast('コピーする料理を選んでください');return}
  lastCopied=new Set();
  sel.forEach(i=>{const id=uid();lastCopied.add(id);(S.meals[cur]=S.meals[cur]||[]).push({id,meal:addMeal,name:i.name,grams:i.grams||0,kcal:i.kcal,p:i.p,f:i.f,c:i.c})});
  save();closeSheet();render();
  toast(`${sel.length}品をコピーしました。タップで訂正できます`);
  setTimeout(()=>{lastCopied=new Set();document.querySelectorAll('.items li.new').forEach(e=>e.classList.remove('new'))},4000);
}

/* ========== AI ========== */
const SYS=`あなたは日本の管理栄養士です。食事の写真または説明から、料理・食品ごとに推定量(g)、エネルギー(kcal)、たんぱく質p・脂質f・炭水化物c(g)を、日本食品標準成分表や一般的な外食・市販品の値を参考に推定してください。量が書かれていなければ一般的な1人前とします。必ず次のJSONのみを出力し、前後に文章やコードブロックを付けないでください。
{"items":[{"name":"ごはん","grams":150,"kcal":234,"p":3.8,"f":0.5,"c":55.7}],"comment":"栄養バランスについて管理栄養士としての一言（60字以内）"}
食べ物が写っていない場合は {"items":[],"comment":"食べ物が見つかりませんでした"} を返してください。`;
async function geminiOnce(model,text,img){
  const parts=[{text}];if(img)parts.push({inline_data:{mime_type:'image/jpeg',data:img}});
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',
    headers:{'content-type':'application/json','x-goog-api-key':S.geminiKey},
    body:JSON.stringify({systemInstruction:{parts:[{text:SYS}]},contents:[{role:'user',parts}],generationConfig:{temperature:0.2,responseMimeType:'application/json'}})});
  const d=await r.json().catch(()=>({}));
  return {ok:r.ok,status:r.status,d};
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function callGemini(text,img){
  const main=(S.geminiModel||'gemini-flash-latest').trim();
  // 混雑時は少し待って再試行し、それでもだめなら軽量モデルに切り替える
  const plan=[[main,0],[main,2500],['gemini-flash-lite-latest',0],['gemini-flash-lite-latest',3000]];
  let last=null;
  for(const [model,delay] of plan){
    if(delay)await wait(delay);
    const res=await geminiOnce(model,text,img);
    if(res.ok)return (res.d.candidates?.[0]?.content?.parts||[]).map(x=>x.text||'').join('');
    last=res;
    if(![500,503,504].includes(res.status)&&!(res.status===404&&model!==main))break;
  }
  const r=last,d=last.d;
  if([500,503,504].includes(r.status))throw new Error('Geminiが混み合っていて応答できませんでした（Google側の一時的な混雑です）。APIキーは正しく認識されています。少し時間をおいてもう一度お試しください。');
  if(r.status===429)throw new Error('無料枠の回数制限に達しました。1分ほど待つか、明日もう一度お試しください。');
  if(r.status===401||r.status===403)throw new Error('APIキーが認証されませんでした。キーを全部コピーできているか（途中で切れていないか）確認してください。（'+(d.error?.message||r.status)+'）');
  if(r.status===404)throw new Error('モデル名が見つかりません。設定のモデル名を「gemini-flash-latest」に戻してください。（'+(d.error?.message||'')+'）');
  throw new Error(d.error?.message||('HTTP '+r.status));
}
async function callClaude(text,img){
  const content=img?[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:img}},{type:'text',text}]:text;
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:S.model||'claude-sonnet-5-5',max_tokens:1500,system:SYS,messages:[{role:'user',content}]})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error?.message||('HTTP '+r.status));
  return d.content.filter(x=>x.type==='text').map(x=>x.text).join('');
}
async function askAI(text,img){
  const gem=S.provider!=='claude';
  if(gem?!S.geminiKey:!S.apiKey){toast('設定でAPIキーを登録してください');return null}
  $('#aiout').innerHTML=(aiImg?`<img class="preview" src="${aiImg}" alt="">`:'')+`<div class="loading"><div class="spin"></div>AIが料理を分析しています…</div>`;
  try{
    const raw=gem?await callGemini(text,img):await callClaude(text,img);
    const txt=raw.replace(/```json|```/g,'');
    const j=JSON.parse(txt.slice(txt.indexOf('{'),txt.lastIndexOf('}')+1));
    aiItems={items:(j.items||[]).map(i=>({name:i.name,grams:+i.grams||0,base:+i.grams||0,kcal:+i.kcal||0,p:+i.p||0,f:+i.f||0,c:+i.c||0,on:true})),comment:j.comment||''};
  }catch(e){
    aiItems=null;
    $('#aiout').innerHTML=(aiImg?`<img class="preview" src="${aiImg}" alt="">`:'')+`<div class="warnbox">分析できませんでした：${esc(e.message)}<br>APIキー・モデル名・通信状況を確認してください。</div>`;
    return;
  }
  $('#aiout').innerHTML=(aiImg?`<img class="preview" src="${aiImg}" alt="">`:'')+aiList();
}
function aiList(){
  if(!aiItems.items.length)return `<div class="warnbox">${esc(aiItems.comment||'食べ物が見つかりませんでした')}</div>`;
  const sum=aiItems.items.filter(i=>i.on).reduce((a,i)=>a+i.kcal*(i.base?i.grams/i.base:1),0);
  return `<div style="margin-top:12px">${aiItems.items.map((i,n)=>{const k=i.base?i.grams/i.base:1;return `<div class="ai-item">
    <input type="checkbox" ${i.on?'checked':''} onchange="aiItems.items[${n}].on=this.checked;refreshAI()">
    <div><div>${esc(i.name)}</div><small class="muted">${Math.round(i.kcal*k)} kcal ・ P${r1(i.p*k)} F${r1(i.f*k)} C${r1(i.c*k)}</small></div>
    <div><input class="g" type="number" inputmode="decimal" value="${i.grams}" onchange="aiItems.items[${n}].grams=+this.value||0;refreshAI()"><small class="muted"> g</small></div></div>`}).join('')}
  </div>
  ${aiItems.comment?`<div class="tip"><div class="face">${IC.doctor}</div><div><b>管理栄養士より</b>${esc(aiItems.comment)}</div></div>`:''}
  <p class="muted" style="margin:8px 0">AIの推定値です。量（g）を直すとカロリーも変わります。</p>
  <button class="btn" onclick="addAI()">合計 ${Math.round(sum)} kcal を追加</button>`;
}
function refreshAI(){$('#aiout').innerHTML=(aiImg?`<img class="preview" src="${aiImg}" alt="">`:'')+aiList()}
function addAI(){
  const sel=aiItems.items.filter(i=>i.on);if(!sel.length){toast('追加する料理を選んでください');return}
  sel.forEach(i=>{const k=i.base?i.grams/i.base:1;pushItem({name:i.name,grams:Math.round(i.grams),kcal:i.kcal*k,p:i.p*k,f:i.f*k,c:i.c*k})});
  save();closeSheet();render();toast(`${sel.length}品を追加しました`);
}
function onPhoto(inp){
  const file=inp.files[0];if(!file)return;
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{
    const max=1024,s=Math.min(1,max/Math.max(img.width,img.height));
    const cv=document.createElement('canvas');cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);
    aiImg=cv.toDataURL('image/jpeg',0.82);aiItems=null;
    askAI('この食事の内容を推定してください。',aiImg.split(',')[1]);
  };
  img.src=url;
}
function onText(){const t=$('#aitext').value.trim();if(!t){toast('食べたものを入力してください');return}aiImg=null;askAI(t,null)}

/* ========== 記録の編集（食事） ========== */
let edit=null;
function openEdit(id){
  const it=(S.meals[cur]||[]).find(i=>i.id===id);if(!it)return;
  edit={id,from:cur,meal:it.meal,g:it.grams||0};
  const nf=(id,lab,v,step)=>`<label class="f">${lab}<input class="field" id="${id}" type="number" inputmode="decimal" step="${step}" value="${v}"></label>`;
  openSheet(`<h3>記録を訂正</h3><div class="muted">日付・区分・内容を直して「保存」を押してください</div>
  <label class="f">日付<input class="field" id="ed" type="date" max="${TODAY()}" value="${cur}"></label>
  <label class="f">食事の区分</label><div class="seg" id="em">${MEALS.map(m=>`<button class="${it.meal===m.k?'on':''}" onclick="edit.meal='${m.k}';document.querySelectorAll('#em button').forEach(b=>b.classList.remove('on'));this.classList.add('on')">${m.n}</button>`).join('')}</div>
  <label class="f">食品名<input class="field" id="en" value="${esc(it.name)}"></label>

  <div class="stepper" style="margin-top:4px"><button onclick="eStep(-10)" aria-label="10g減らす">−</button><input id="eg" type="number" inputmode="decimal" value="${it.grams||''}" placeholder="—" oninput="eGrams(+this.value||0)"><span class="muted">g</span><button onclick="eStep(10)" aria-label="10g増やす">＋</button></div>
  <div class="muted" style="text-align:center;margin-top:-6px">量を変えると、カロリーとPFCも自動で計算し直します</div>
  <div class="grid2">${nf('ek','カロリー（kcal）',Math.round(it.kcal),1)}${nf('ep','たんぱく質 P（g）',r1(it.p),0.1)}</div>
  <div class="grid2">${nf('ef','脂質 F（g）',r1(it.f),0.1)}${nf('ec2','炭水化物 C（g）',r1(it.c),0.1)}</div>
  <button class="btn" style="margin-top:18px" onclick="saveEdit()">訂正を保存</button>
  <button class="btn warn" style="margin-top:8px" onclick="delItem()">この記録を削除</button>`);
}
function eStep(d){const g=Math.max(0,(+$('#eg').value||0)+d);$('#eg').value=g;eGrams(g)}
function eGrams(g){
  if(edit.g>0&&g>0){const k=g/edit.g;
    $('#ek').value=Math.round((+$('#ek').value||0)*k);
    ['ep','ef','ec2'].forEach(id=>$('#'+id).value=r1((+$('#'+id).value||0)*k));}
  if(g>0)edit.g=g;
}
function saveEdit(){
  const date=$('#ed').value,name=$('#en').value.trim(),kcal=+$('#ek').value;
  if(!date){toast('日付を選んでください');return}
  if(!name){toast('食品名を入力してください');return}
  if(!(kcal>=0)){toast('カロリーを正しく入力してください');return}
  const list=S.meals[edit.from]||[],i=list.findIndex(x=>x.id===edit.id);if(i<0)return;
  const it=list[i];
  Object.assign(it,{name,meal:edit.meal,grams:Math.round(+$('#eg').value||0),kcal,p:+$('#ep').value||0,f:+$('#ef').value||0,c:+$('#ec2').value||0});
  if(date!==edit.from){
    list.splice(i,1);if(!list.length)delete S.meals[edit.from];
    (S.meals[date]=S.meals[date]||[]).push(it);cur=date;
    toast(`${fmtDate(date)}に移動しました`);
  }else toast('訂正を保存しました');
  save();closeSheet();render();
}
function delItem(){if(!confirm('この記録を削除しますか？'))return;S.meals[edit.from]=(S.meals[edit.from]||[]).filter(i=>i.id!==edit.id);if(!S.meals[edit.from].length)delete S.meals[edit.from];save();closeSheet();render();toast('削除しました')}

/* ========== 記録の編集（体重・歩数・血圧） ========== */

  <button class="btn" style="margin-top:18px" onclick="saveRec()">訂正を保存</button>
  <button class="btn warn" style="margin-top:8px" onclick="if(confirm('この記録を削除しますか？')){delete S[recEdit.type][recEdit.k];save();closeSheet();render();toast('削除しました')}">この記録を削除</button>`);
}
function saveRec(){
  const {type,k}=recEdit,date=$('#rd').value;
  if(!date){toast('日付を選んでください');return}
  let val;
  if(type==='weights'){val=r1(+$('#rv').value);if(!(val>20&&val<300)){toast('体重を正しく入力してください');return}}
  else if(type==='steps'){val=Math.round(+$('#rv').value);if(!(val>=0&&val<200000)||$('#rv').value===''){toast('歩数を正しく入力してください');return}}
  else{
    val={};
    for(const sl of ['am','pm']){
      const sv=$('#'+sl+'s').value,dv=$('#'+sl+'d').value;if(sv===''&&dv==='')continue;
      const x={s:Math.round(+sv),d:Math.round(+dv)},pp=Math.round(+$('#'+sl+'p').value)||0;
      if(!(x.s>=60&&x.s<=260&&x.d>=30&&x.d<=180&&x.s>x.d)){toast(`${sl==='am'?'朝':'夜'}の血圧を正しく入力してください`);return}
      if(pp)x.p=pp;val[sl]=x;
    }
    if(!val.am&&!val.pm){toast('朝か夜のどちらかを入力してください');return}
  }
  if(date!==k&&S[type][date]!=null&&!confirm(`${fmtDate(date)}にはすでに記録があります。上書きしますか？`))return;
  if(date!==k)delete S[type][k];
  S[type][date]=val;save();closeSheet();render();
  toast(date!==k?`${fmtDate(date)}に移動しました`:'訂正を保存しました');
}

    <button class="btn sub" style="margin-top:8px" onclick="closeSheet()">あとで</button>`);}

async function hkPaste(){
  let t='';
  try{t=await navigator.clipboard.readText()}catch(e){t=prompt('コピーした歩数を貼り付けてください')||''}
  closeSheet();hkImport(t);
}
function hkImport(t){
  t=String(t||'').trim();if(!t){toast('貼り付ける内容がありません');return 0}
  const lines=t.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const re=/^(\d{4})[-\/年.](\d{1,2})[-\/月.](\d{1,2})日?\s*[=:：]\s*(\d[\d,]*(?:\.\d+)?)/;
  const num=x=>Math.round(parseFloat(String(x).replace(/,/g,'')));
  // 各行の歩数（日付の有無にかかわらず取り出す）
  const rows=lines.map(l=>{const m=l.match(re);if(m)return {k:`${m[1]}-${pad(m[2])}-${pad(m[3])}`,v:num(m[4])};
    const x=l.replace(/^.*[=＝]/,'').replace(/[\s歩,]/g,'');return /^\d+(\.\d+)?$/.test(x)?{k:null,v:num(x)}:null}).filter(Boolean);
  if(!rows.length){toast('歩数のデータが見つかりませんでした');return 0}
  // 日付がすべて付いていて重複もなければ日付どおり。それ以外は「1行目=今日、2行目=昨日…」の順番で割り当てる
  const ks=rows.map(r=>r.k),trust=ks.every(Boolean)&&new Set(ks).size===ks.length&&ks.every(k=>k<=TODAY());
  let n=0;
  rows.forEach((r,i)=>{if(!(r.v>=0&&r.v<200000))return;const k=trust?r.k:addDays(TODAY(),-i);S.steps[k]=r.v;n++});
  if(!n){toast('歩数のデータが見つかりませんでした');return 0}
  const d=new Date();S.hkLast=`${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}（${n}日分）`;
  save();bodyMode='steps';tab='weight';render();toast(`ヘルスケアから${n}日分の歩数を取り込みました`);return n;
}

function stepS(d){const e=$('#sv');e.value=Math.max(0,(+e.value||0)+d)}
function saveSteps(){const v=Math.round(+$('#sv').value);if(!(v>=0&&v<200000)||$('#sv').value===''){toast('歩数を正しく入力してください');return}S.steps[wDate]=v;save();render();toast(`${fmtDate(wDate)}　${v.toLocaleString()}歩を記録しました`)}
function delRec(type,k){if(!confirm(`${fmtDate(k)}の記録を削除しますか？`))return;delete S[type][k];save();render()}
function stepChart(){
  const days=[...Array(sRange)].map((_,i)=>addDays(TODAY(),i-sRange+1));
  if(!days.some(d=>S.steps[d]!=null))return `<div class="muted" style="padding:40px 0;text-align:center">歩数を記録するとグラフが表示されます</div>`;
  const W=340,H=200,L=38,R=8,T=12,B=26,vals=days.map(d=>S.steps[d]||0);
  const hi=Math.max(...vals,S.stepGoal)*1.12,bw=(W-L-R)/days.length;
  const Y=v=>T+(1-v/hi)*(H-T-B);
  let grid='';for(let i=0;i<=3;i++){const v=hi*i/3,y=Y(v);grid+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.06)"/><text x="${L-5}" y="${y+4}" text-anchor="end" font-size="10" font-family="DM Sans,sans-serif" fill="var(--dim)">${v>=1000?Math.round(v/1000)+'千':Math.round(v)}</text>`}
  const bars=days.map((d,i)=>{const v=S.steps[d];if(v==null)return'';const x=L+i*bw+bw*0.15,w=Math.max(bw*0.7,1.5),y=Y(v);return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${(H-B-y).toFixed(1)}" rx="${Math.min(w/2,4)}" fill="${v>=S.stepGoal?'var(--leaf)':'var(--l)'}"/>`}).join('');
  const idx=sRange===7?[0,1,2,3,4,5,6]:[0,Math.floor(days.length/3),Math.floor(days.length*2/3),days.length-1];
  const xl=idx.map(i=>{const d=parse(days[i]);return `<text x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle" font-size="10" font-family="DM Sans,sans-serif" fill="var(--dim)">${sRange===7?WD[d.getDay()]:(d.getMonth()+1)+'/'+d.getDate()}</text>`}).join('');
  const gy=Y(S.stepGoal);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="歩数のグラフ">${grid}${bars}${xl}<line x1="${L}" x2="${W-R}" y1="${gy}" y2="${gy}" stroke="var(--warn)" stroke-width="1.6" stroke-dasharray="4 4"/></svg>`;
}

function viewBP(){
  wDate=wDate||cur;

function saveBP(){
  const s=Math.round(+$('#bs').value),d=Math.round(+$('#bd').value),p=Math.round(+$('#bpp').value)||0;

  (S.bp[wDate]=S.bp[wDate]||{})[bpSlot]=p?{s,d,p}:{s,d};
  save();render();toast(`${bpSlot==='am'?'朝':'夜'}の血圧 ${s}/${d} を記録しました`);
}
function bpChart(){
  let ks=Object.keys(S.bp).sort();
  if(bRange){const from=addDays(TODAY(),-bRange);ks=ks.filter(k=>k>=from)}
  const pts=[];ks.forEach(k=>['am','pm'].forEach(sl=>{const r=S.bp[k][sl];if(r)pts.push({t:parse(k).getTime(),sl,...r})}));
  const days=new Set(pts.map(p=>p.t));
  if(days.size<2)return `<div class="muted" style="padding:40px 0;text-align:center">2日分以上記録するとグラフが表示されます</div>`;
  const W=340,H=210,L=34,R=10,T=12,B=26;
  const t0=Math.min(...days),t1=Math.max(...days),span=Math.max(t1-t0,864e5);
  let lo=Math.min(...pts.map(p=>p.d),85)-8,hi=Math.max(...pts.map(p=>p.s),135)+8;
  const X=t=>L+(t-t0)/span*(W-L-R),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let grid='';for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);grid+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.06)"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="10" font-family="DM Sans,sans-serif" fill="var(--dim)">${Math.round(v)}</text>`}
  let xl='';for(let i=0;i<=3;i++){const t=t0+span*i/3,d=new Date(t);xl+=`<text x="${X(t)}" y="${H-8}" text-anchor="${i===0?'start':i===3?'end':'middle'}" font-size="10" font-family="DM Sans,sans-serif" fill="var(--dim)">${d.getMonth()+1}/${d.getDate()}</text>`}
  const ref=[135,85].map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--sub)" stroke-width="1" stroke-dasharray="4 4"/>`).join('');
  const line=(sl,key,col,wd)=>{const a=pts.filter(p=>p.sl===sl);if(!a.length)return'';const d=a.map((p,i)=>(i?'L':'M')+X(p.t).toFixed(1)+' '+Y(p[key]).toFixed(1)).join(' ');
    return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${wd}" stroke-linejoin="round" stroke-linecap="round" ${sl==='pm'?'opacity=".55"':''}/>`+(a.length<=40?a.map(p=>`<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p[key]).toFixed(1)}" r="${sl==='am'?2.6:2}" fill="${col}" ${sl==='pm'?'opacity=".55"':''}/>`).join(''):'')};

function chart(){
  let ks=wKeys();
  if(wRange){const from=addDays(TODAY(),-wRange);ks=ks.filter(k=>k>=from)}
  if(ks.length<2)return `<div class="muted" style="padding:40px 0;text-align:center">2日分以上記録するとグラフが表示されます</div>`;
  const W=340,H=200,L=34,R=10,T=14,B=26;
  const t0=parse(ks[0]).getTime(),t1=parse(ks[ks.length-1]).getTime(),span=Math.max(t1-t0,864e5);
  const vals=ks.map(k=>S.weights[k]);
  const goals=[];
  Object.keys(S.goals).forEach(ym=>{
    const [y,m]=ym.split('-').map(Number);
    const a=Math.max(new Date(y,m-1,1).getTime(),t0),b=Math.min(new Date(y,m,0).getTime(),t1);
    if(a<=b)goals.push({a,b,v:+S.goals[ym]});
  });
  let lo=Math.min(...vals,...goals.map(g=>g.v)),hi=Math.max(...vals,...goals.map(g=>g.v));
  const padv=Math.max((hi-lo)*0.15,0.5);lo-=padv;hi+=padv;
  const X=t=>L+(t-t0)/span*(W-L-R),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const pts=ks.map(k=>[X(parse(k).getTime()),Y(S.weights[k])]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L${pts[pts.length-1][0].toFixed(1)} ${H-B} L${pts[0][0].toFixed(1)} ${H-B} Z`;
  let grid='';for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3,y=Y(v);grid+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.06)"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="10" font-family="DM Sans,sans-serif" fill="var(--dim)">${v.toFixed(1)}</text>`}
  let xl='';for(let i=0;i<=3;i++){const t=t0+span*i/3,d=new Date(t);xl+=`<text x="${X(t)}" y="${H-8}" text-anchor="${i===0?'start':i===3?'end':'middle'}" font-size="10" font-family="DM Sans,sans-serif" fill="var(--dim)">${d.getMonth()+1}/${d.getDate()}</text>`}
  const gl=goals.map(g=>`<line x1="${X(g.a)}" x2="${X(g.b)}" y1="${Y(g.v)}" y2="${Y(g.v)}" stroke="var(--warn)" stroke-width="1.6" stroke-dasharray="4 4"/>`).join('');
  const lp=pts[pts.length-1],lv=vals[vals.length-1];
  const dots=pts.length<=40?pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.4" fill="var(--leaf)"/>`).join(''):'';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="体重の推移グラフ">
    <defs><linearGradient id="wa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3CC9A6" stop-opacity=".30"/><stop offset="1" stop-color="#3CC9A6" stop-opacity="0"/></linearGradient></defs>
    ${grid}${xl}<path d="${area}" fill="url(#wa)"/>${gl}
    <path d="${line}" fill="none" stroke="var(--leaf)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>${dots}
    <circle cx="${lp[0]}" cy="${lp[1]}" r="5" fill="var(--card)" stroke="var(--leaf)" stroke-width="2.5"/>
    <rect x="${Math.min(lp[0]-26,W-R-52)}" y="${Math.max(lp[1]-30,0)}" width="52" height="19" rx="9" fill="var(--leaf)"/>
    <text x="${Math.min(lp[0],W-R-26)}" y="${Math.max(lp[1]-30,0)+13.5}" text-anchor="middle" font-size="11" font-weight="700" font-family="DM Sans,sans-serif" fill="#0B121B">${lv.toFixed(1)}</text>
  </svg>`;
}

/* ========== 月間目標 ========== */
const ymOf=d=>d.slice(0,7);
function monthInfo(ym){
  const [y,m]=ym.split('-').map(Number),lastDay=new Date(y,m,0).getDate();
  const first=`${ym}-01`,last=`${ym}-${pad(lastDay)}`,ks=wKeys();
  const before=ks.filter(k=>k<first).pop(),inM=ks.filter(k=>k>=first&&k<=last);
  const start=before?S.weights[before]:(inM.length?S.weights[inM[0]]:null);
  const end=inM.length?S.weights[inM[inM.length-1]]:null;
  const goal=S.goals[ym]!=null?+S.goals[ym]:null;
  const ended=ymOf(TODAY())>ym;
  const ok=end!=null&&goal!=null&&end<=goal;
  return {y,m,lastDay,start,end,goal,ended,ok};
}
function viewGoal(){
  const ym=ymOf(TODAY()),mi=monthInfo(ym),today=new Date(),left=mi.lastDay-today.getDate();

  }else{
    const cur_=mi.end??mi.start,need=cur_!=null?cur_-mi.goal:null;
    const prog=mi.start!=null&&cur_!=null&&mi.start!==mi.goal?Math.max(0,Math.min(1,(mi.start-cur_)/(mi.start-mi.goal))):(need!=null&&need<=0?1:0);
    const pace=need>0&&left>0?need/(left/7):0;
    hero=`<section class="goal-hero">
      <div class="m">${mi.y}年${mi.m}月の目標</div>
      <div class="g num">${mi.goal.toFixed(1)}<small> kg</small></div>
      <div class="track"><i style="width:${prog*100}%"></i></div>

      <div style="margin-top:12px;font-size:14px;font-weight:700">${need==null?'体重を記録すると進み具合がわかります':need<=0?'🎉 目標をクリアしています！月末までキープしましょう':`あと ${need.toFixed(1)}kg ・ 残り${left}日${pace?`（週${pace.toFixed(1)}kgペース）`:''}`}</div>
      <button class="btn" onclick="openGoal('${ym}')">目標を変更</button>
    </section>`;
    if(pace>1)hero+=`<div class="warnbox">⚠️ 必要なペースが週1kgを超えています。急な減量は筋肉が落ちてリバウンドしやすくなります。目標の見直しも検討しましょう。</div>`;
  }

  const past=Object.keys(S.goals).filter(k=>k<ym).sort().reverse();
  const won=past.filter(k=>monthInfo(k).ok).length;
  return `<div class="top"><div class="brand"><span class="bi">${IC.target}</span>月間目標</div></div>
  ${hero}
  <button class="wchip" onclick="openGoal('${nym}')"><div><div class="lbl">${nx.getMonth()+1}月の目標</div><div class="val num">${S.goals[nym]!=null?(+S.goals[nym]).toFixed(1)+' kg':'未設定'}</div></div><span class="chip on">${S.goals[nym]!=null?'変更':'設定する'}</span></button>
  <div class="h2">これまでの結果</div>
  ${past.length?`<section class="card"><div class="muted" style="margin-bottom:6px">${past.length}か月中 ${won}か月 達成</div><ul class="list">${past.map(k=>{const r=monthInfo(k);return `<li><div style="flex:1"><b>${r.y}年${r.m}月</b><div class="muted">目標 ${r.goal.toFixed(1)}kg → 月末 ${r.end!=null?r.end.toFixed(1)+'kg':'記録なし'}</div></div><span class="badge ${r.end==null?'wait':r.ok?'ok':'ng'}">${r.end==null?'判定なし':r.ok?'達成':'未達成'}</span></li>`}).join('')}</ul></section>`
  :`<section class="card muted">月が終わると、ここに達成結果が表示されます。月末の結果は、その月に記録した最後の体重で判定します。</section>`}
  <div class="tip"><div class="face">${IC.doctor}</div><div><b>管理栄養士より</b>1か月の減量は、今の体重の5％以内（多くても3〜4kg）が目安です。体重は水分で1日1kg前後動くので、日々の増減より月の流れを見ていきましょう。</div></div>`;
}

function importData(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.meals||!d.weights)throw 0;d.steps=d.steps||{};d.bp=d.bp||{};const key=S.apiKey,gk=S.geminiKey;S=Object.assign(def(),d);if(!S.apiKey)S.apiKey=key;if(!S.geminiKey)S.geminiKey=gk;save();render();toast('復元しました')}catch(e){toast('バックアップファイルを読み込めませんでした')}};
  r.readAsText(f);
}

/* ========== 描画 ========== */
const TABS=[['today',IC.meal,'食事'],['weight',IC.trend,'からだ'],['goal',IC.target,'目標'],['settings',IC.gear,'設定']];
function render(){
  $('#app').innerHTML=tab==='today'?viewToday():tab==='weight'?viewBody():tab==='goal'?viewGoal():viewSettings();
  $('#nav').innerHTML=TABS.map(([k,e,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';wVal=null;wDate=null;render();scrollTo(0,0)">${e}${l}</button>`).join('');
}
render();
hkFromURL();
checkMonthEnd();
</script>
