<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ダッシュボード">
<meta name="theme-color" content="#0B121B">
<title>マイ資産ダッシュボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Sans:opsz,wght@9..40,500;9..40,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0B121B; --card:#131D29; --card2:#18243300; --line:#223246; --ink:#EDF2F7; --sub:#94A5B8; --dim:#62748A;
  --salary:#3CC9A6; --bonus:#F2C14E; --dividend:#7AA7FF;
  --cost:#FF8A6B; --stock:#7AA7FF; --kakei:#F2B84B;
  --pos:#3ECF8E; --neg:#FF6B6B;
  --num:"DM Sans","Zen Kaku Gothic New",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{
  background:radial-gradient(1200px 600px at 10% -10%,#15263A 0%,transparent 60%),radial-gradient(900px 500px at 110% 10%,#2A1E14 0%,transparent 55%),var(--bg);
  background-attachment:fixed;color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
  font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hidden{display:none!important}

/* ---------- ヘッダー ---------- */
.wrap{max-width:1400px;margin:0 auto;padding:22px 26px 40px;
  padding-left:calc(26px + env(safe-area-inset-left,0px));padding-right:calc(26px + env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.title{flex:1;min-width:260px}
.title h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.02em}
.title h1 .ver{font-size:13px;color:var(--dim);font-weight:500;margin-left:8px}
.title .today{color:var(--sub);font-size:15px}
.hdr-right{display:flex;align-items:center;gap:12px}
.sync{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub);padding:8px 14px;border:1px solid var(--line);border-radius:999px}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--pos);box-shadow:0 0 10px var(--pos)}
.sync.off i{background:var(--neg);box-shadow:0 0 10px var(--neg)}
.btn-line{border:1px solid var(--line);background:none;border-radius:999px;padding:8px 16px;font-size:14px;color:var(--sub)}

/* ---------- カード ---------- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.card{
  position:relative;background:linear-gradient(180deg,#16212F 0%,#121B26 100%);
  border:1px solid var(--line);border-radius:22px;padding:20px 22px 22px;overflow:hidden;
  display:flex;flex-direction:column;gap:14px;min-width:0;
}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--c),transparent 85%)}
.card::after{content:"";position:absolute;width:260px;height:260px;right:-120px;top:-140px;border-radius:50%;background:var(--c);opacity:.07;filter:blur(20px);pointer-events:none}
.c-head{display:flex;align-items:center;gap:12px}
.c-ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);flex:none}
.c-ico svg{width:24px;height:24px}
.c-head h2{margin:0;font-size:20px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{border:0;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);font-weight:700;border-radius:999px;padding:9px 16px 9px 18px;font-size:15px;display:flex;align-items:center;gap:4px;flex:none}
.more svg{width:16px;height:16px}

.kpi{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.kpi .main .lbl{font-size:14px;color:var(--sub)}
.kpi .main .val{font-size:38px;font-weight:700;line-height:1.1}
.kpi .main .val small{font-size:20px;margin-right:2px;color:var(--sub);font-weight:500}
.delta{font-size:15px;font-weight:700;padding:3px 10px;border-radius:999px;margin-bottom:4px}
.delta.pos{color:var(--pos);background:rgba(62,207,142,.12)}
.delta.neg{color:var(--neg);background:rgba(255,107,107,.12)}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{flex:1;min-width:120px;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.chip .lbl{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px}
.chip .lbl i{width:9px;height:9px;border-radius:3px;background:var(--dot)}
.chip .v{font-size:20px;font-weight:700}
.chart-box{position:relative;height:230px}
.seg{display:inline-flex;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:5px 14px;font-size:14px;color:var(--sub)}
.seg button.on{background:var(--c);color:#0B121B;font-weight:700}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.yearnav{display:flex;align-items:center;gap:6px}
.yearnav button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);font-size:18px;line-height:1}
.yearnav button:disabled{opacity:.3}
.yearnav b{min-width:74px;text-align:center;font-size:17px}
.note{font-size:13px;color:var(--dim)}
.empty{color:var(--sub);text-align:center;padding:40px 10px}

/* 定期コスト */
.donut-row{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:1100px) and (min-width:901px){.donut-row{grid-template-columns:180px minmax(0,1fr)}}
.donut{position:relative;height:220px}
@media (max-width:1100px) and (min-width:901px){.donut{height:180px}}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.donut-center .lbl{font-size:13px;color:var(--sub)}
.donut-center .v{font-size:24px;font-weight:700}
.legend{display:flex;flex-direction:column;gap:8px}
.lg{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;font-size:15px}
.lg i{width:12px;height:12px;border-radius:4px}
.lg .pct{color:var(--sub);font-size:13px;margin-left:6px}
.upcoming h3{margin:4px 0 8px;font-size:15px;color:var(--sub);font-weight:500}
.up{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.035);margin-bottom:6px}
.up .d{font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--sub);white-space:nowrap}
.up.soon{background:rgba(255,107,107,.1);box-shadow:inset 3px 0 0 var(--neg)}
.up.soon .d{background:var(--neg);color:#fff;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.55}}
.up .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 株 */
.nisa-bar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.06)}
.nisa-bar span{height:100%}
.nisa-legend{display:flex;gap:18px;font-size:14px;color:var(--sub);margin-top:6px;flex-wrap:wrap}
.nisa-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.high{font-size:13px;font-weight:700;color:#0B121B;background:var(--bonus);border-radius:999px;padding:3px 10px;margin-bottom:6px}
.stock-scroll{max-height:300px;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* 家計 */
.banner{border-radius:14px;padding:12px 16px;font-weight:700;font-size:17px;display:flex;gap:10px;align-items:center}
.banner.ok{background:rgba(62,207,142,.12);color:var(--pos)}
.banner.warn{background:rgba(255,107,107,.12);color:var(--neg)}
.banner svg{width:22px;height:22px;flex:none}

/* ---------- ログイン ---------- */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:32px 28px}
.login-card h1{margin:0 0 4px;font-size:24px}
.login-card p{margin:0 0 22px;color:var(--sub);font-size:15px}
.login-card label{display:block;font-size:14px;color:var(--sub);margin:14px 0 6px}
.login-card input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#0E1722;font-size:17px}
.login-card .go{width:100%;margin-top:22px;border:0;border-radius:999px;padding:14px;font-weight:700;font-size:17px;background:linear-gradient(90deg,var(--salary),var(--dividend));color:#0B121B}
.login-card .go:disabled{opacity:.5}
.sr-pin{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px}
.pin-dots{display:flex;justify-content:center;gap:18px;margin:10px 0 4px;padding:10px 0}
.pin-dots .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:transparent;transition:background .12s,border-color .12s,transform .12s}
.pin-dots .dot.on{background:var(--dividend);border-color:var(--dividend);transform:scale(1.12)}
.pin-dots.shake{animation:shake .38s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}100%{transform:translateX(0)}}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.pin-pad button{padding:16px 0;border-radius:14px;border:1px solid var(--line);background:#0E1722;font-size:21px;font-weight:600;color:var(--ink)}
.pin-pad button:active{background:#18293C}
.pin-pad button.del{font-size:18px;color:var(--sub);background:none;border-color:transparent}
.pin-pad span{visibility:hidden}
@media (prefers-reduced-motion:reduce){.pin-dots.shake{animation:none}}
.err{color:var(--neg);font-size:14px;margin-top:12px;min-height:1.4em}
.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--sub)}

/* ---------- 詳細(既存アプリ)表示 ---------- */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  transform:translateY(100%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s linear .32s}
.sheet.open{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
body.sheet-open{overflow:hidden}
.sheet-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:3px solid var(--c);background:#101924}
.sheet-bar .back{border:0;background:var(--c);color:#0B121B;font-weight:700;border-radius:999px;padding:9px 18px 9px 12px;display:flex;align-items:center;gap:4px;font-size:15px}
.sheet-bar .back svg{width:18px;height:18px}
.sheet-bar b{flex:1;font-size:17px}
.sheet-bar .re{border:1px solid var(--line);background:none;border-radius:999px;padding:8px 14px;font-size:14px;color:var(--sub)}
.frames{flex:1;position:relative}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
.frames iframe.on{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="loading" id="scrLoading">読み込み中…</div>

<div class="login hidden" id="scrLogin">
  <div class="login-card" id="loginForm">
    <h1>マイ資産ダッシュボード</h1>
    <p id="loginLead">給与管理アプリと同じ4桁の暗証番号を入力してください。</p>
    <div class="pin-dots" id="pinDots" aria-hidden="true">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <input id="pw" class="sr-pin" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="暗証番号4桁">
    <div class="pin-pad" id="pinPad">
      <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
      <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
      <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
      <span></span><button type="button" data-k="0">0</button><button type="button" class="del" data-k="del" aria-label="1文字削除">⌫</button>
    </div>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div class="wrap hidden" id="scrDash">
  <header>
    <div class="title">
      <h1>マイ資産ダッシュボード<span class="ver">Ver2.0</span></h1>
      <div class="today" id="today"></div>
    </div>
    <div class="hdr-right">
      <div class="sync" id="sync"><i></i><span>同期中</span></div>
      <button class="btn-line" id="logout">ログアウト</button>
    </div>
  </header>

  <div class="grid">
    <!-- 給与管理 -->
    <section class="card" style="--c:var(--salary)">
      <div class="c-head">
        <span class="c-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 7l4 5 4-5M12 12v6M9 13h6M9 16h6"/></svg></span>
        <h2>給与管理</h2>
        <button class="more" data-open="salary">詳細<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
      <div id="salBody"></div>
    </section>

    <!-- 定期コスト -->
    <section class="card" style="--c:var(--cost)">
      <div class="c-head">
        <span class="c-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20v-4h-4"/></svg></span>
        <h2>定期コスト</h2>
        <button class="more" data-open="cost">詳細<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
      <div id="costBody"></div>
    </section>

    <!-- 銘柄別評価損益 -->
    <section class="card" style="--c:var(--stock)">
      <div class="c-head">
        <span class="c-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M4 16l5-5 4 3 7-8"/><path d="M15 6h5v5"/></svg></span>
        <h2>銘柄別評価損益</h2>
        <button class="more" data-open="stock">詳細<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
      <div id="stockBody"></div>
    </section>

    <!-- 家計・年金 -->
    <section class="card" style="--c:var(--kakei)">
      <div class="c-head">
        <span class="c-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg></span>
        <h2>家計・年金シミュレーター</h2>
        <button class="more" data-open="kakei">詳細<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
      <div id="kakeiBody"></div>
    </section>
  </div>
</div>

<!-- 既存アプリを表示するシート -->
<div class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-bar">
    <button class="back" id="sheetClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 6l-6 6 6 6"/></svg>ダッシュボード</button>
    <b id="sheetTitle"></b>
    <button class="re" id="sheetReload">再読込</button>
  </div>
  <div class="frames" id="frames"></div>
</div>

<script type="module">
/* ===== 設定(各アプリと同じFirebaseプロジェクト) ===== */
const firebaseConfig = {
  apiKey: "AIzaSyBUQjfeamTm1gCWNiXhZcxyBIUiQSptvDs",
  authDomain: "asset-tracker-b3fac.firebaseapp.com",
  databaseURL: "https://asset-tracker-b3fac-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "asset-tracker-b3fac",
  storageBucket: "asset-tracker-b3fac.firebasestorage.app",
  messagingSenderId: "36181399487",
  appId: "1:36181399487:web:0ef48412b814d81aaa330a"
};
const APPS = {
  salary:{ name:'給与管理', url:'salary-tracker.html', color:'var(--salary)' },
  cost:  { name:'定期コスト', url:'subscription-tracker.html', color:'var(--cost)' },
  stock: { name:'銘柄別評価損益', url:'stock-portfolio-tracker.html', color:'var(--stock)' },
  kakei: { name:'家計・年金シミュレーター', url:'kakei-sim.html', color:'var(--kakei)' }
};
const DIVIDEND_TAX_RATE = 0.20315;

const $ = id => document.getElementById(id);
const yen = n => (n==null||isNaN(n)) ? '-' : '¥' + Math.round(n).toLocaleString('ja-JP');
const man = n => { const v=n/10000; return (Math.abs(v)>=100 ? Math.round(v).toLocaleString('ja-JP') : (Math.round(v*10)/10).toLocaleString('ja-JP')) + '万'; };
const numv = v => Number(String(v==null?'':v).replace(/,/g,'')) || 0;
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(id){ ['scrLoading','scrLogin','scrDash'].forEach(s=>$(s).classList.toggle('hidden', s!==id)); }

/* ===== Chart.js 共通設定 ===== */
const hasChart = typeof Chart !== 'undefined';
if (hasChart){
  Chart.defaults.color = '#94A5B8';
  Chart.defaults.borderColor = 'rgba(255,255,255,.06)';
  Chart.defaults.font.family = '"DM Sans","Zen Kaku Gothic New",sans-serif';
  Chart.defaults.font.size = 13;
  Chart.defaults.plugins.tooltip.backgroundColor = '#0B121B';
  Chart.defaults.plugins.tooltip.borderColor = '#2B3D55';
  Chart.defaults.plugins.tooltip.borderWidth = 1;
  Chart.defaults.plugins.tooltip.padding = 10;
  Chart.defaults.plugins.tooltip.titleFont = {size:14, weight:'700'};
  Chart.defaults.plugins.tooltip.bodyFont = {size:14};
}
const charts = {};
function chart(id, cfg){
  if (!hasChart) return;
  const el = $(id); if (!el) return;
  if (charts[id] && charts[id].canvas === el){
    charts[id].data = cfg.data; charts[id].options = cfg.options; charts[id].update();
  } else {
    if (charts[id]) charts[id].destroy();
    charts[id] = new Chart(el, cfg);
  }
}
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ===== 状態 ===== */
const D = { salary:null, subs:null, cats:null, holdings:null, price:null, maxProfit:null, kakei:null };
let salYear = new Date().getFullYear();
let salMode = 'month';

/* ===== 日付表示 ===== */
function tick(){
  const d=new Date(), w='日月火水木金土'[d.getDay()];
  $('today').textContent = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日(${w}) ${d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}`;
}

/* ================= 給与管理 ================= */
const TYPES = { salary:{label:'給与',c:'--salary'}, bonus:{label:'賞与',c:'--bonus'}, dividend:{label:'配当',c:'--dividend'} };
function renderSalary(){
  const box = $('salBody');
  if (D.salary === null){ box.innerHTML = '<div class="empty">読み込み中…</div>'; return; }
  const recs = Object.values(D.salary||{}).filter(r=>r && r.date);
  if (!recs.length){ box.innerHTML = '<div class="empty">まだ記録がありません</div>'; return; }
  const years = [...new Set(recs.map(r=>Number(r.date.slice(0,4))))].sort((a,b)=>a-b);
  if (!years.includes(salYear)) salYear = years[years.length-1];

  const cur = sumBy(recs.filter(r=>r.date.startsWith(salYear+'-')));
  const prev = sumBy(recs.filter(r=>r.date.startsWith((salYear-1)+'-')));
  const now = new Date();
  // 前年比は「前年の同時期まで」と比べる(今年の場合)
  let prevCmp = prev.all;
  if (salYear === now.getFullYear()){
    const md = String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
    prevCmp = sumBy(recs.filter(r=>r.date.startsWith((salYear-1)+'-') && r.date.slice(5) <= md)).all;

    </div>

      ${Object.entries(TYPES).map(([k,t])=>`<div class="chip" style="--dot:var(${t.c})"><div class="lbl"><i></i>${t.label}</div><div class="v num">${yen(cur[k])}</div></div>`).join('')}

  }

      label:TYPES[k].label, data:sets[i], backgroundColor:cssVar(TYPES[k].c), borderRadius:5, borderSkipped:false, maxBarThickness:34 })) },
    options:{ responsive:true, maintainAspectRatio:false,

const DEFAULT_CATS = [

function brighten(hex){ // 暗い背景でも見やすいよう少し明るくする
  const m = /^#?([0-9a-f]{6})$/i.exec(hex||''); if(!m) return hex||'#8A8F82';
  const n=parseInt(m[1],16); let r=n>>16,g=(n>>8)&255,b=n&255;
  const f=v=>Math.min(255,Math.round(v+(255-v)*0.28));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function nextOccurrence(dateStr, cycle){
  if(!dateStr) return null;
  const d=new Date(dateStr), t=new Date(); t.setHours(0,0,0,0); d.setHours(0,0,0,0);
  let g=0; while(d<t && g++<600){ if(cycle==='year') d.setFullYear(d.getFullYear()+1); else d.setMonth(d.getMonth()+1); }
  return d;
}

/* ================= 家計・年金シミュレーター ================= */
const INCOME_KEYS = ['salary','dividend'];
const EXPENSE_KEYS = ['food','car','insurance','tax','daily','medical','social','utility','communication','hobby','transport','cash'];
const sumKeys = (o,keys) => keys.reduce((s,k)=>s+numv(o&&o[k]),0);
function pensionAnnual(base65, startAge){
  const months=(startAge-65)*12; let rate=0;
  if(months>0) rate=months*0.007; else if(months<0) rate=months*0.004;
  return Math.round(numv(base65)*(1+rate));
}
function addYears(s,y){ const d=new Date(s); d.setFullYear(d.getFullYear()+y); return d; }
function ageAt(b,date){ const bd=new Date(b); let a=date.getFullYear()-bd.getFullYear(); if(date.getMonth()<bd.getMonth()||(date.getMonth()===bd.getMonth()&&date.getDate()<bd.getDate())) a--; return a; }

// 家計・年金シミュレーターと同じ計算(アプリで最後に実行した条件を使用)
function simulate(st){
  const s=st.settings||{}, entries=st.entries||[];
  const avg=(key,src)=>entries.length?Math.round(entries.reduce((a,e)=>a+numv(e[src]&&e[src][key]),0)/entries.length):0;
  const preNet = entries.length ? Math.round(entries.reduce((a,e)=>a+sumKeys(e.income,INCOME_KEYS)-sumKeys(e.expenses,EXPENSE_KEYS),0)/entries.length) : 0;
  const si = st.simInputs||{};
  const salary = numv(si.salary);
  const dividend = (si.dividend!=null && numv(si.dividend)!==0) ? numv(si.dividend) : avg('dividend','income');
  const exps = si.expenses||{};
  const expenseTotal = EXPENSE_KEYS.reduce((a,k)=>a+(exps[k]!=null?numv(exps[k]):avg(k,'expenses')),0);
  const pensionMonthly = pensionAnnual(s.pensionBase65, Number(s.startAge)||65)/12;
  const netMonthly = salary + pensionMonthly + dividend - expenseTotal;
  const shortfall = numv(s.monthlyBudget) - netMonthly;
  const big={}; (st.bigExpenses||[]).forEach(e=>big[e.ym]=(big[e.ym]||0)+numv(e.amount));
  let sav=numv(st.assets&&st.assets.savings), inv=numv(st.assets&&st.assets.investment);
  const startDate=addYears(s.birthDate, Number(s.startAge)||65), endDate=addYears(s.birthDate, Number(s.simEndAge)||90);
  const today=new Date(); today.setDate(1);
  let cur=new Date(today<startDate?today:startDate), depleted=null, g=0;
  const pts=[{date:new Date(cur), bal:sav+inv}];
  const draw=a=>{ if(a<=0) return false; if(sav>=a){sav-=a;return false;} const r=a-sav; sav=0; if(inv>=r){inv-=r;return false;} inv=0; return true; };
  while(cur<endDate && g<2400){
    g++;
    const ym=`${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}`;
    if(big[ym] && draw(big[ym])){ depleted=new Date(cur); depleted.setMonth(depleted.getMonth()+1); cur.setMonth(cur.getMonth()+1); pts.push({date:new Date(cur),bal:sav+inv}); break; }
    if(cur<startDate){ sav+=preNet; if(sav<0) sav=0; }
    else if(shortfall>0){ if(draw(shortfall)){ depleted=new Date(cur); depleted.setMonth(depleted.getMonth()+1); cur.setMonth(cur.getMonth()+1); pts.push({date:new Date(cur),bal:sav+inv}); break; } }
    else sav+=-shortfall;
    cur.setMonth(cur.getMonth()+1);
    if(g%12===0) pts.push({date:new Date(cur), bal:sav+inv});
  }
  if(!depleted) pts.push({date:new Date(cur), bal:sav+inv});
  return { pts, depleted, startDate, shortfall, final:sav+inv, preNet, pensionMonthly, endAge:Number(s.simEndAge)||90 };
}

const vline = { id:'vline', afterDatasetsDraw(c, _a, o){
  if (o.index==null || o.index<0) return;
  const x=c.scales.x.getPixelForValue(o.index), {top,bottom}=c.chartArea, g=c.ctx;
  g.save(); g.strokeStyle='rgba(242,184,75,.8)'; g.setLineDash([5,5]); g.lineWidth=1.5;
  g.beginPath(); g.moveTo(x,top+18); g.lineTo(x,bottom); g.stroke(); g.setLineDash([]);
  g.fillStyle='#F2B84B'; g.font='700 13px "Zen Kaku Gothic New",sans-serif'; g.textAlign='center'; g.fillText(o.label,x,top+12); g.restore();
}};

          { label:'支出', data:recent.map(e=>sumKeys(e.expenses,EXPENSE_KEYS)), backgroundColor:'rgba(255,138,107,.8)', borderRadius:4, maxBarThickness:18 } ] },
      options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
        plugins:{ legend:{position:'top', align:'end', labels:{boxWidth:10,boxHeight:10,useBorderRadius:true,borderRadius:3}}, title:{display:true,text:'直近の収支',align:'start',color:'#94A5B8',font:{size:13,weight:'500'}},
          tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${yen(c.raw)}`}} },
        scales:{ x:{grid:{display:false}}, y:{ticks:{callback:v=>man(v),maxTicksLimit:4},border:{display:false}} } }
    });
  }
}

function renderAll(){ renderSalary(); renderCost(); renderStock(); renderKakei(); }

/* ================= 既存アプリの表示 ================= */
const frames = {};
let openId = null;
function openApp(id){
  const a = APPS[id]; openId = id;
  $('sheet').style.setProperty('--c', a.color);
  $('sheetTitle').textContent = a.name;
  if (!frames[id]){
    const f=document.createElement('iframe'); f.src=a.url; f.title=a.name; frames[id]=f; $('frames').appendChild(f);
  }
  Object.entries(frames).forEach(([k,f])=>f.classList.toggle('on',k===id));
  $('sheet').classList.add('open'); document.body.classList.add('sheet-open'); $('sheet').setAttribute('aria-hidden','false');
}
function closeApp(){ $('sheet').classList.remove('open'); document.body.classList.remove('sheet-open'); $('sheet').setAttribute('aria-hidden','true'); openId=null; }
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openApp(b.dataset.open));
$('sheetClose').onclick = closeApp;
$('sheetReload').onclick = () => { if(openId && frames[openId]) frames[openId].src = APPS[openId].url; };

/* ================= Firebase ================= */
const B='https://www.gstatic.com/firebasejs/10.12.2/';
let fb;
try{
  const [{ initializeApp }, { initializeAuth, browserLocalPersistence, signInAnonymously, onAuthStateChanged }, { getDatabase, ref, onValue }] =
    await Promise.all([import(B+'firebase-app.js'), import(B+'firebase-auth.js'), import(B+'firebase-database.js')]);
  const app = initializeApp(firebaseConfig);
  const auth = initializeAuth(app, { persistence: browserLocalPersistence });
  auth.languageCode = 'ja';
  const db = getDatabase(app);
  fb = { auth, db, ref, onValue, signInAnonymously, onAuthStateChanged };
}catch(e){
  console.error(e);
  $('scrLoading').textContent = 'Firebaseを読み込めませんでした。通信状態を確認して再読み込みしてください。';
}

let unsubs = [];
function subscribe(){
  unsubs.forEach(u=>u()); unsubs=[];
  const on = (path, cb) => unsubs.push(fb.onValue(fb.ref(fb.db, path), s=>cb(s.val()), err=>{ console.error(path, err); cb(undefined); }));
  on('salary/records', v=>{ D.salary = v||{}; renderSalary(); });
  on('subscriptions', v=>{ D.subs = v||{}; renderCost(); });
  on('costCategories', v=>{ D.cats = v||null; renderCost(); });
  on('stockPortfolio/holdings', v=>{ D.holdings = v||{}; renderStock(); });
  on('stockPortfolio/priceCache', v=>{ D.price = v||{}; renderStock(); });
  on('stockPortfolio/maxTotalProfit', v=>{ D.maxProfit = v && typeof v.value==='number' ? v.value : null; renderStock(); });
  on('household-finance', v=>{ D.kakei = v||{}; renderKakei(); });
  on('.info/connected', v=>{ $('sync').classList.toggle('off', !v); $('sync').querySelector('span').textContent = v ? '同期中' : 'オフライン'; });
}

async function hashPin(pin){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('salary-tracker:'+pin));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
const TRY_KEY = 'dash_pin_try';
const tryState = () => { try{ return JSON.parse(localStorage.getItem(TRY_KEY))||{n:0,until:0}; }catch(e){ return {n:0,until:0}; } };
const setTry = v => { try{ localStorage.setItem(TRY_KEY, JSON.stringify(v)); }catch(e){} };

if (fb){
  /* ---- 暗証番号(4桁)パッド ---- */
  const dots = [...$('pinDots').querySelectorAll('.dot')];
  const pinInput = $('pw');
  let pinStored = null; // 給与管理アプリが salary/pin に保存している暗証番号のハッシュ
  function renderPin(){ const n=pinInput.value.length; dots.forEach((d,i)=>d.classList.toggle('on', i<n)); }
  function shakePin(msg){
    $('pinDots').classList.remove('shake'); void $('pinDots').offsetWidth; $('pinDots').classList.add('shake');
    pinInput.value=''; renderPin();
    if (msg) $('loginErr').textContent = msg;
  }
  $('pinPad').addEventListener('click', e => {
    const b = e.target.closest('button[data-k]'); if (!b || b.disabled) return;
    const k = b.dataset.k;
    if (k === 'del') pinInput.value = pinInput.value.slice(0,-1);
    else if (pinInput.value.length < 4) pinInput.value += k;
    renderPin();
    $('loginErr').textContent = '';
    if (pinInput.value.length === 4) checkPin();
  });
  pinInput.addEventListener('input', () => {
    pinInput.value = pinInput.value.replace(/[^0-9]/g,'').slice(0,4);
    renderPin();
    if (pinInput.value.length === 4) checkPin();
  });

  async function checkPin(){
    const pin = pinInput.value;
    if (pin.length !== 4) return;
    if (!pinStored){ shakePin('給与管理アプリで暗証番号が設定されていません。先にそちらで設定してください。'); return; }
    const st = tryState();
    if (Date.now() < st.until){ shakePin(`しばらく待ってからお試しください(あと${Math.ceil((st.until-Date.now())/60000)}分)`); return; }
    $('pinPad').querySelectorAll('button').forEach(b=>b.disabled=true);
    try{
      if (await hashPin(pin) === pinStored){
        setTry({n:0,until:0});
        pinInput.value=''; renderPin();
        show('scrDash'); renderAll(); subscribe();
      } else {
        const n=(st.n||0)+1;
        setTry(n>=5 ? {n:0,until:Date.now()+3*60000} : {n,until:0});
        shakePin(n>=5 ? '5回間違えたため、3分間入力できません' : `暗証番号が違います(${n}回目)`);
      }
    }catch(e){ shakePin('確認できませんでした。通信状態を確認してください。'); }
    finally{ $('pinPad').querySelectorAll('button').forEach(b=>b.disabled=false); }
  }

  $('logout').onclick = () => {
    if (!confirm('ロックしますか?')) return;
    unsubs.forEach(x=>x()); unsubs=[]; Object.keys(D).forEach(k=>D[k]=null); closeApp();
    pinInput.value=''; renderPin(); $('loginErr').textContent=''; show('scrLogin');
  };

  fb.onAuthStateChanged(fb.auth, u => {
    if (!u) return;
    fb.onValue(fb.ref(fb.db, 'salary/pin'), s => {
      pinStored = s.val();
      $('loginLead').textContent = pinStored ? '給与管理アプリと同じ4桁の暗証番号を入力してください。' : '給与管理アプリで暗証番号がまだ設定されていません。先にそちらで設定してください。';
      show('scrLogin');
    }, err => {
      console.error(err);
      $('scrLoading').textContent = 'データベースを読み込めませんでした。通信状態を確認して再読み込みしてください。';
      show('scrLoading');
    });
  });
  fb.signInAnonymously(fb.auth).catch(e => {
    console.error(e);
    $('scrLoading').textContent = '接続できませんでした。通信状態を確認して再読み込みしてください。';
  });
}

tick(); setInterval(tick, 30000);
let rt; window.addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(()=>Object.values(charts).forEach(c=>c.resize()),150); });
