<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ダッシュボード">
<title>マイ ダッシュボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --panel:#FFFFFF; --ink:#1C2733; --sub:#5B6875; --line:#D5DBE1;
  --rail:#1F3A5F; --rail-ink:#C9D6E6; --rail-on:#FFFFFF;
  --c-salary:#2E7D6B; --c-cost:#C0533A; --c-stock:#3F5BA9; --c-kakei:#A87A1F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141A21; --panel:#1E2630; --ink:#E6EBF0; --sub:#9AA7B4; --line:#2E3946;
    --rail:#0F1E31; --rail-ink:#8FA3BA;
  }
}
:root[data-theme="dark"]{
  --bg:#141A21; --panel:#1E2630; --ink:#E6EBF0; --sub:#9AA7B4; --line:#2E3946;
  --rail:#0F1E31; --rail-ink:#8FA3BA;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%;
  overflow:hidden;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid #6FA8FF;outline-offset:2px}

.app{display:flex;height:100%}

/* ---- 左レール ---- */
.rail{
  width:96px;flex:none;background:var(--rail);
  display:flex;flex-direction:column;align-items:stretch;
  padding:14px 8px;gap:6px;
  padding-left:calc(8px + env(safe-area-inset-left,0px));
}
.rail button{
  background:none;border:0;border-radius:14px;padding:10px 4px;
  color:var(--rail-ink);display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:12px;line-height:1.3;text-align:center;
}
.rail button svg{width:30px;height:30px}
.rail button.on{background:rgba(255,255,255,.12);color:var(--rail-on)}
.rail button .dot{width:6px;height:6px;border-radius:50%;background:transparent}
.rail button.on .dot{background:var(--accent,#fff)}
.rail .spacer{flex:1}

/* ---- メイン ---- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;
  padding-right:env(safe-area-inset-right,0px)}
.view{flex:1;min-height:0;display:none}
.view.show{display:flex;flex-direction:column}

/* ホーム */
.home{overflow-y:auto;padding:36px 40px 40px}
.home-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.date{font-size:44px;font-weight:700;letter-spacing:.02em;line-height:1.15}
.date small{display:block;font-size:17px;font-weight:500;color:var(--sub);letter-spacing:0;margin-bottom:4px}
.ver{font-size:13px;color:var(--sub);margin-left:6px;font-weight:400}
.split-btn{
  border:2px solid var(--ink);background:none;border-radius:999px;
  padding:10px 22px;font-weight:700;display:flex;align-items:center;gap:8px
}
.split-btn svg{width:22px;height:22px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.tile{
  position:relative;text-align:left;border:0;border-radius:20px;
  background:var(--panel);padding:26px 26px 22px 34px;min-height:190px;
  display:flex;flex-direction:column;gap:8px;overflow:hidden;
  border:1px solid var(--line);
}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--c)}
.tile .ico{width:52px;height:52px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center}
.tile .ico svg{width:30px;height:30px}
.tile h2{margin:6px 0 0;font-size:24px;line-height:1.3}
.tile p{margin:0;color:var(--sub);font-size:15px}
.tile .go{margin-top:auto;font-weight:700;color:var(--c);font-size:16px}
.tile .warn{color:var(--c-cost);font-size:14px;font-weight:700}
.tile:active{transform:scale(.985)}

/* アプリ表示 */
.split-bar{display:none;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.split-bar.show{display:flex}
.split-bar label{font-size:14px;color:var(--sub);display:flex;align-items:center;gap:8px}
.split-bar select{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.stage{position:relative;flex:1;min-height:0}
.pane{position:absolute;display:none;flex-direction:column;background:var(--panel)}
.pane.full{display:flex;inset:0}
.pane.left{display:flex;top:0;bottom:0;left:0;width:calc(50% - 3px)}
.pane.right{display:flex;top:0;bottom:0;right:0;width:calc(50% - 3px)}
@media (orientation:portrait){
  .pane.left{width:auto;right:0;bottom:auto;height:calc(50% - 3px)}
  .pane.right{width:auto;left:0;top:auto;height:calc(50% - 3px)}
}
.pane-bar{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 16px;border-bottom:3px solid var(--c);flex:none}
.pane-bar b{flex:1;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pane-bar button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 12px;font-size:14px;display:flex;align-items:center;gap:6px}
.pane-bar button svg{width:16px;height:16px}
.pane iframe{flex:1;width:100%;border:0;background:#fff}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;color:var(--sub)}
.empty button{border:0;background:var(--c);color:#fff;border-radius:999px;padding:10px 24px;font-weight:700}

/* 設定 */
.settings{overflow-y:auto;padding:36px 40px 60px}
.settings h1{font-size:30px;margin:0 0 6px}
.settings .lead{color:var(--sub);margin:0 0 24px;max-width:40em}
.field{background:var(--panel);border:1px solid var(--line);border-left:8px solid var(--c);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.field label{display:block;font-weight:700;margin-bottom:6px}
.field input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.primary{border:0;background:var(--rail);color:#fff;border-radius:999px;padding:12px 30px;font-weight:700}
:root[data-theme="dark"] .primary{background:#3A5F8F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .primary{background:#3A5F8F}}
.ghost{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:12px 24px}
.note{margin-top:28px;font-size:14px;color:var(--sub);max-width:44em}
.note h3{font-size:15px;color:var(--ink);margin:0 0 4px}

.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--bg);padding:10px 22px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:700px){
  .tiles{grid-template-columns:1fr}
  .home,.settings{padding:24px 18px}
  .date{font-size:34px}
  .rail{width:78px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail" aria-label="メニュー"></nav>
  <main class="main">
    <section class="view home" id="v-home">
      <div class="home-head">
        <div class="date" id="date"></div>
        <button class="split-btn" id="toSplit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg>
          2画面で並べる
        </button>
      </div>
      <div class="tiles" id="tiles"></div>
    </section>

    <section class="view" id="v-apps">
      <div class="split-bar" id="splitBar">
        <label>左(上)<select id="selL"></select></label>
        <label>右(下)<select id="selR"></select></label>
      </div>
      <div class="stage" id="stage"></div>
    </section>

    <section class="view settings" id="v-settings">
      <h1>設定<span class="ver">Ver1.0</span></h1>
      <p class="lead">各アプリのURLを入力してください。ダッシュボードと同じGitHubリポジトリに置いている場合は、ファイル名だけで動きます。</p>
      <div id="fields"></div>
      <div class="row">
        <button class="primary" id="save">URLを保存</button>
        <button class="ghost" id="reset">初期値に戻す</button>
      </div>
      <div class="note">
        <h3>アプリが表示されないとき</h3>
        各アプリと同じGitHub Pages(同じ https://〇〇.github.io)に置くと確実です。別サイトのページは埋め込みを拒否されることがあります。その場合は画面上部の「別タブ」から開いてください。
        <h3 style="margin-top:14px">ログインについて</h3>
        各アプリのログインはそれぞれのアプリで行います。ダッシュボード内で画面を切り替えても、一度開いたアプリは読み込み直さずそのまま残ります。
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const APPS = [
  {id:'salary', name:'給与管理', desc:'給与・賞与・配当の記録と年別の集計', color:'var(--c-salary)', def:'salary-tracker.html',
   icon:'<circle cx="12" cy="12" r="9"/><path d="M8 7l4 5 4-5M12 12v6M9 13h6M9 16h6"/>'},
  {id:'cost', name:'定期コスト', desc:'サブスクなど定期的な支払いと次回請求日', color:'var(--c-cost)', def:'subscription-tracker.html',
   icon:'<path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20v-4h-4"/>'},
  {id:'stock', name:'銘柄別評価損益', desc:'保有銘柄ごとの評価額と損益', color:'var(--c-stock)', def:'https://shin0320ghub.github.io/asset_tracker/stock-portfolio-tracker.html',
   icon:'<path d="M3 20h18"/><path d="M4 16l5-5 4 3 7-8"/><path d="M15 6h5v5"/>'},
  {id:'kakei', name:'家計・年金シミュレーター', desc:'収支の記録と年金生活での資産の見通し', color:'var(--c-kakei)', def:'kakei-sim.html',
   icon:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>'}
];
const KEY = 'dashboard-urls-v1';
const svg = (inner, sw=2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const $ = id => document.getElementById(id);

let urls = {};
try { urls = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e) { urls = {}; }
APPS.forEach(a => { if (!urls[a.id]) urls[a.id] = a.def; });

let view = 'home';          // home | app | split | settings
let current = null;         // 1画面表示中のアプリ
let split = { l:'salary', r:'cost' };
try { const s = JSON.parse(localStorage.getItem('dashboard-split') || 'null'); if (s) split = s; } catch(e) {}

/* ---- 左レール ---- */
function buildRail(){
  const items = [
    {id:'home', name:'ホーム', icon:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'},
    ...APPS,
    {id:'split', name:'2画面', icon:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/>'},
  ];
  $('rail').innerHTML = items.map(it =>
    `<button data-go="${it.id}" style="--accent:${it.color||'#fff'}">${svg(it.icon,1.8)}<span>${it.name.replace('・','・<wbr>')}</span><i class="dot"></i></button>`
  ).join('') + `<div class="spacer"></div>
    <button data-go="settings">${svg('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',1.6)}<span>設定</span><i class="dot"></i></button>`;
  $('rail').addEventListener('click', e => {
    const b = e.target.closest('button[data-go]'); if (!b) return;
    go(b.dataset.go);
  });
}

/* ---- ホーム ---- */
function buildTiles(){
  $('tiles').innerHTML = APPS.map(a => `
    <button class="tile" data-app="${a.id}" style="--c:${a.color}">
      <span class="ico">${svg(a.icon)}</span>
      <h2>${a.name}</h2>
      <p>${a.desc}</p>
      ${urls[a.id] ? `<span class="go">開く</span>` : `<span class="warn">URLが未設定です(設定で入力)</span>`}
    </button>`).join('');
}
$('tiles').addEventListener('click', e => {
  const t = e.target.closest('.tile'); if (t) go(t.dataset.app);
});
$('toSplit').onclick = () => go('split');

function updateDate(){
  const d = new Date();
  const w = '日月火水木金土'[d.getDay()];
  const hm = d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
  $('date').innerHTML = `<small>${d.getFullYear()}年 ${hm}</small>${d.getMonth()+1}月${d.getDate()}日(${w})`;
}

/* ---- アプリ表示(iframeは一度作ったら使い回す) ---- */
const panes = {};
function ensurePane(id){
  if (panes[id]) return panes[id];
  const a = APPS.find(x => x.id === id);
  const p = document.createElement('div');
  p.className = 'pane'; p.style.setProperty('--c', a.color);
  p.innerHTML = `<div class="pane-bar"><b>${a.name}</b>
      <button data-act="reload">${svg('<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>')}再読込</button>
      <button data-act="open">${svg('<path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>')}別タブ</button>
    </div><div class="body" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>`;
  p.querySelector('.pane-bar').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.act === 'reload') loadInto(id, true);
    if (b.dataset.act === 'open' && urls[id]) window.open(urls[id], '_blank');
  });
  $('stage').appendChild(p);
  panes[id] = p;
  loadInto(id);
  return p;
}
function loadInto(id, force){
  const body = panes[id].querySelector('.body');
  const url = urls[id];
  if (!url){
    body.innerHTML = `<div class="empty"><p>このアプリのURLがまだ設定されていません。</p><button onclick="go('settings')">設定を開く</button></div>`;
    return;
  }
  let f = body.querySelector('iframe');
  if (!f){
    body.innerHTML = '';
    f = document.createElement('iframe');
    f.title = APPS.find(x=>x.id===id).name;
    f.setAttribute('allow','clipboard-write; fullscreen');
    body.appendChild(f);
    f.src = url;
  } else if (force || f.dataset.url !== url){
    f.src = url;
  }
  f.dataset.url = url;
}

function layout(){
  Object.values(panes).forEach(p => p.classList.remove('full','left','right'));
  if (view === 'app') ensurePane(current).classList.add('full');
  if (view === 'split'){
    ensurePane(split.l).classList.add('left');
    if (split.r !== split.l) ensurePane(split.r).classList.add('right');
  }
}

function fillSelects(){
  const opts = APPS.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
  $('selL').innerHTML = opts; $('selR').innerHTML = opts;
  $('selL').value = split.l; $('selR').value = split.r;
}
function onSplitChange(){
  split = { l:$('selL').value, r:$('selR').value };
  if (split.l === split.r) toast('左右で別のアプリを選んでください');
  try { localStorage.setItem('dashboard-split', JSON.stringify(split)); } catch(e) {}
  layout();
}
$('selL').onchange = onSplitChange; $('selR').onchange = onSplitChange;

/* ---- 画面切り替え ---- */
function go(target){
  if (target === 'home' || target === 'settings' || target === 'split') view = target;
  else { view = 'app'; current = target; }
  $('v-home').classList.toggle('show', view === 'home');
  $('v-settings').classList.toggle('show', view === 'settings');
  $('v-apps').classList.toggle('show', view === 'app' || view === 'split');
  $('splitBar').classList.toggle('show', view === 'split');
  document.querySelectorAll('.rail button').forEach(b => {
    const g = b.dataset.go;
    b.classList.toggle('on', view === 'app' ? g === current : g === view);
  });
  if (view === 'app' || view === 'split') layout();
  if (view === 'settings') buildFields();
  try { sessionStorage.setItem('dashboard-view', view === 'app' ? current : view); } catch(e) {}
}

/* ---- 設定 ---- */
function buildFields(){
  $('fields').innerHTML = APPS.map(a => `
    <div class="field" style="--c:${a.color}">
      <label for="u-${a.id}">${a.name}</label>
      <input id="u-${a.id}" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false"
        placeholder="例: https://〇〇.github.io/リポジトリ名/${a.def || 'ファイル名.html'}" value="${(urls[a.id]||'').replace(/"/g,'&quot;')}">
    </div>`).join('');
}
$('save').onclick = () => {
  APPS.forEach(a => { urls[a.id] = $('u-'+a.id).value.trim(); });
  try { localStorage.setItem(KEY, JSON.stringify(urls)); } catch(e) {}
  Object.keys(panes).forEach(id => loadInto(id));
  buildTiles();
  toast('URLを保存しました');
};
$('reset').onclick = () => {
  if (!confirm('URLを初期値に戻しますか?')) return;
  APPS.forEach(a => { urls[a.id] = a.def; });
  try { localStorage.setItem(KEY, JSON.stringify(urls)); } catch(e) {}
  buildFields(); buildTiles();
  Object.keys(panes).forEach(id => loadInto(id));
  toast('初期値に戻しました');
};

let tt;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---- 起動 ---- */
buildRail(); buildTiles(); fillSelects(); updateDate();
setInterval(updateDate, 30000);
let start = 'home';
try { start = sessionStorage.getItem('dashboard-view') || 'home'; } catch(e) {}
go(start);
</script>
</body>
</html>
